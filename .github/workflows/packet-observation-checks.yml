name: Read-only packet observation checks

on:
  pull_request:
    paths:
      - 'source/FishingAutomation/Telemetry/**'
      - 'tests/packet-observation/**'
      - 'tests/common-observation/**'
      - 'source/FishingAutomation/Telemetry/VerifiedScreenIncidentDiagnostic.cs'
      - 'source/FishingAutomation/dungeon/ScenarioEngine.AbyssState.cs'
      - 'source/FishingAutomation/dungeon/GatheringScreen.cs'
      - 'source/FishingAutomation/dungeon/AlteringScreen.cs'
      - 'source/FishingAutomation/dungeon/CraftingScreen.cs'
      - 'source/FishingAutomation/dungeon/ScenarioEngine.cs'
      - 'source/FishingAutomation/FishingBot.cs'
      - 'tests/ai-autopilot/test_passive_cli_context.py'
      - 'tests/ai-autopilot/test_evidence_ab_stage15.py'
      - 'tests/ai-autopilot/test_incident_coverage_stage21.py'
      - 'tests/ai-autopilot/test_incident_priority_stage22.py'
      - 'tests/ai-autopilot/test_incident_review_bridge_stage23.py'
      - 'tests/ai-autopilot/test_paired_prompt_ab_stage24.py'
      - 'tests/ai-autopilot/test_integration_safety_stage25.py'
      - 'tests/ai-autopilot/test_stage16_preview_contract.py'
      - 'source/FishingAutomation/ai-autopilot/evidence_ab.py'
      - 'source/FishingAutomation/ai-autopilot/incident_coverage_audit.py'
      - 'source/FishingAutomation/ai-autopilot/incident_priority_review.py'
      - 'source/FishingAutomation/ai-autopilot/incident_review_context.py'
      - 'source/FishingAutomation/ai-autopilot/paired_prompt_ab_stage24.py'
      - 'source/FishingAutomation/ai-autopilot/integration_safety_gate_stage25.py'
      - 'source/FishingAutomation/AiRuntimeErrorJournal.cs'
      - 'source/FishingAutomation/AiAutopilotHost.cs'
      - 'source/FishingAutomation/MabinogiMobileCli.cs'
      - 'source/FishingAutomation/Program.cs'
      - 'source/FishingAutomation/Stage16ReadOnlyPreviewForm.cs'
      - 'source/FishingAutomation/FishingAutomation.csproj'
      - 'tools/Stage16Preview/**'
      - 'tools/PacketReceiveProbe/**'
      - 'tests/packet-receive-probe/**'
      - 'tools/MobilayExportInspector/**'
      - 'tests/mobilay-export-inspector/**'
      - 'docs/PACKET_OBSERVATION_STAGE1.md'
      - '.github/workflows/packet-observation-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check packet observation diagnostic regressions
        shell: pwsh
        run: |
          dotnet run --project tests/packet-observation/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Packet observation regression failed' }
      - name: Check shared read-only evidence reconciliation and historical DPS
        shell: pwsh
        run: |
          dotnet run --project tests/common-observation/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Cross-feature evidence regression failed' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify sanitized AI evidence uses existing untrusted-log boundary
        shell: pwsh
        run: |
          python -m unittest discover -s tests/ai-autopilot -p test_passive_cli_context.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Passive AI context safety regression failed' }
      - name: Compare baseline vs diagnostic evidence offline (no Codex)
        shell: pwsh
        run: |
          python -m unittest discover -s tests/ai-autopilot -p test_evidence_ab_stage15.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Offline A/B evidence regression failed' }
      - name: Audit bounded Stage21 offline incident coverage and privacy
        shell: pwsh
        run: |
          python -m unittest discover -s tests/ai-autopilot -p test_incident_coverage_stage21.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Stage21 incident coverage audit regression failed' }
      - name: Check Stage22 diagnostic-review priority safety and deterministic policy
        shell: pwsh
        run: |
          python -m unittest discover -s tests/ai-autopilot -p test_incident_priority_stage22.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Stage22 fixed diagnostic review priority regression failed' }
      - name: Check Stage23 isolated anonymous AI prompt review bridge
        shell: pwsh
        run: |
          python -m unittest discover -s tests/ai-autopilot -p test_incident_review_bridge_stage23.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Stage23 passive AI review context contract failed' }
      - name: Check Stage24 matched-error A/B prompt safety without AI or game
        shell: pwsh
        run: |
          python -m unittest discover -s tests/ai-autopilot -p test_paired_prompt_ab_stage24.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Stage24 paired offline prompt A/B regression failed' }
      - name: Check Stage25 cross-feature offline integration safety contracts
        shell: pwsh
        run: |
          python -m unittest discover -s tests/ai-autopilot -p test_integration_safety_stage25.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Stage25 final integration safety regression failed' }
          python source/FishingAutomation/ai-autopilot/integration_safety_gate_stage25.py
          if ($LASTEXITCODE -ne 0) { throw 'Stage25 passive integration source gate rejected' }
      - name: Check isolated Stage16 GUI user-click and no-input contract
        shell: pwsh
        run: |
          python -m unittest discover -s tests/ai-autopilot -p test_stage16_preview_contract.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Stage16 preview contract regression failed' }
      - name: Check packet receive probe safety and strict CLI
        shell: pwsh
        run: |
          dotnet run --project tests/packet-receive-probe/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Receive probe safety regression failed' }
      - name: Build independent receive diagnostic (no live capture)
        shell: pwsh
        run: |
          dotnet build tools/PacketReceiveProbe/PacketReceiveProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Independent capture diagnostic build failed' }
      - name: Check offline export inspector safety regressions
        shell: pwsh
        run: |
          dotnet run --project tests/mobilay-export-inspector/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Export inspector regression failed' }
      - name: Build independent offline export inspector
        shell: pwsh
        run: |
          dotnet build tools/MobilayExportInspector/MobilayExportInspector.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Export inspector build failed' }
      - name: Build main Windows app
        shell: pwsh
        run: |
          dotnet build source/FishingAutomation/FishingAutomation.csproj -c Release -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Main Windows app build failed' }
      - name: Publish isolated Stage16 manual read-only GUI
        shell: pwsh
        run: |
          $staging = Join-Path (Get-Location) '_stage16-published'
          dotnet publish source/FishingAutomation/FishingAutomation.csproj -c Release -r win-x64 --self-contained true -p:Stage16PreviewOnly=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o $staging
          if ($LASTEXITCODE -ne 0) { throw 'Stage16 isolated GUI build failed' }
          $exe = Join-Path $staging 'FishingAutomation.exe'
          if (-not (Test-Path $exe)) { throw 'Stage16 isolated EXE missing' }
          $check = Start-Process -FilePath $exe -ArgumentList '--stage16-self-test' -Wait -PassThru -NoNewWindow
          if ($check.ExitCode -ne 0) { throw 'Stage16 opt-in entrypoint smoke test failed' }
          $delivery = Join-Path (Get-Location) '_stage16-readonly-delivery'
          New-Item -ItemType Directory -Force -Path $delivery | Out-Null
          # Deliberately allow only the standalone executable and printed
          # instructions; do not ship production settings, AI configuration,
          # bots, updater scripts, private files or the release START.cmd.
          Copy-Item $exe (Join-Path $delivery 'FishingAutomation.exe')
          Copy-Item 'tools/Stage16Preview/Run_Stage16_ReadOnly.cmd' $delivery
          Copy-Item 'tools/Stage16Preview/사용안내.txt' $delivery
          $names = @(Get-ChildItem -LiteralPath $delivery -File | ForEach-Object Name | Sort-Object)
          $expected = @('FishingAutomation.exe', 'Run_Stage16_ReadOnly.cmd', '사용안내.txt' | Sort-Object)
          if (@(Compare-Object -ReferenceObject $expected -DifferenceObject $names).Count -ne 0) { throw 'Stage16 artifact contains unexpected files' }
          Write-Host 'Stage16 preview self-test passed. No GUI click, CLI call, capture, game input or AI process executed in CI.'
      - name: Upload isolated Stage16 read-only test ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: MabiAuto-Stage16-Isolated-ReadOnly-Win64
          path: _stage16-readonly-delivery/**
          if-no-files-found: error
          retention-days: 14
      - name: Publish self-contained Windows x64 diagnostic
        shell: pwsh
        run: |
          $dest = Join-Path (Get-Location) '_packet-receive-probe-publish'
          dotnet publish tools/PacketReceiveProbe/PacketReceiveProbe.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o $dest
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic publish failed' }
          if (-not (Test-Path (Join-Path $dest 'PacketReceiveProbe.exe'))) { throw 'Published EXE missing' }
          Copy-Item 'tools/PacketReceiveProbe/RunReceiveProbe.cmd' $dest
          Copy-Item 'tools/PacketReceiveProbe/RunAllChecks.cmd' $dest
          Copy-Item 'tools/PacketReceiveProbe/사용안내.txt' $dest
          Write-Host 'Packaged independently of the existing macro. Live capture was not performed in CI.'
      - name: Upload click-to-run diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: PacketReceiveProbe-Win64-ClickToRun
          path: _packet-receive-probe-publish/**
          if-no-files-found: error
          retention-days: 14
      - name: Publish independent offline export checker
        shell: pwsh
        run: |
          $dest = Join-Path (Get-Location) '_mobilay-export-inspector-publish'
          dotnet publish tools/MobilayExportInspector/MobilayExportInspector.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o $dest
          if ($LASTEXITCODE -ne 0) { throw 'Export inspector publish failed' }
          if (-not (Test-Path (Join-Path $dest 'MobilayExportInspector.exe'))) { throw 'Published export inspector missing' }
          Copy-Item 'tools/MobilayExportInspector/RunExportCheck.cmd' $dest
          Copy-Item 'tools/MobilayExportInspector/RunCoverageCheck.cmd' $dest
          Copy-Item 'tools/MobilayExportInspector/사용안내.txt' $dest
          Write-Host 'Export inspector never opens network, game, capture drivers or raw packet files.'
      - name: Upload drag-and-drop offline export checker
        uses: actions/upload-artifact@v4
        with:
          name: MobilayExportInspector-Win64-Offline
          path: _mobilay-export-inspector-publish/**
          if-no-files-found: error
          retention-days: 14
