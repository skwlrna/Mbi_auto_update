name: Release V3.0.20 Safe Altering Receipt and Search-only Crafting
# Strict category UI fixture aligned
# Rerun after updating shared processing search and 17px production-tab typography regressions.
# Unified production UI regressions aligned with the 17px category-tab typography

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release-v320.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v320-safe-altering-receipt-search-only-crafting
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify release source and versions
        shell: pwsh
        run: |
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'main fetch failed' }
          if ((git rev-parse HEAD) -ne (git rev-parse origin/main)) { throw 'release must use latest main' }
          $u = Get-Content source/FishingAutomation/UpdateManager.cs -Raw
          if ($u -notmatch 'CurrentVersion = "V3\.0\.20"') { throw 'version constant mismatch' }
          $p = Get-Content source/FishingAutomation/FishingAutomation.csproj -Raw
          foreach ($field in @('Version','AssemblyVersion','FileVersion')) {
            $expected = if ($field -eq 'Version') { '3.0.20' } else { '3.0.20.0' }
            if ($p -notmatch [regex]::Escape("<$field>$expected</$field>")) { throw "$field mismatch" }
          }
      - name: Restore and test
        shell: pwsh
        run: |
          dotnet restore source/FishingAutomation/FishingAutomation.csproj -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'dotnet step failed' }
          dotnet restore source/MacroWatchdog/MacroWatchdog.csproj -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'dotnet step failed' }
          dotnet restore changes/tests/stability/Regression.csproj
          if ($LASTEXITCODE -ne 0) { throw 'dotnet step failed' }
          dotnet build source/FishingAutomation/FishingAutomation.csproj -c Release -r win-x64 --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'dotnet step failed' }
          dotnet build source/MacroWatchdog/MacroWatchdog.csproj -c Release -r win-x64 --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'dotnet step failed' }
          dotnet run --project changes/tests/stability/Regression.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'dotnet step failed' }
      - name: Updater rollback regression tests
        shell: pwsh
        run: ./changes/tests/stability/Updater.Tests.ps1 -Updater ./source/tools/ApplyUpdate.ps1

      - name: Loot and retry regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/loot-retry/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Loot/retry regressions failed' }
          dotnet run --project tests/retry-flow/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Retry flow regressions failed' }

      - name: Read-only CLI regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/cli-readonly/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'CLI regressions failed' }
      - name: Inventory loot regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/inventory-loot/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Inventory loot regressions failed' }
      - name: Automatic altering regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/altering/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Altering regressions failed' }
          dotnet build tests/altering-visual/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Altering visual harness build failed' }

      - name: Diagnostic-only regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/gathering-diagnostic/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic regressions failed' }

      - name: Automatic gathering regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/gathering/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Gathering regressions failed' }

      - name: Crafting regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/crafting/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Crafting regressions failed' }

      - name: V3 production architecture checks
        shell: pwsh
        run: |
          $craft = Get-Content source/FishingAutomation/dungeon/CraftingScreen.cs -Raw
          $gather = Get-Content source/FishingAutomation/dungeon/GatheringScreen.cs -Raw
          $bulk = Get-Content source/FishingAutomation/dungeon/InventoryBulkGatheringScreen.cs -Raw
          $alter = Get-Content source/FishingAutomation/dungeon/AlteringScreen.cs -Raw
          $runtime = Get-Content source/FishingAutomation/dungeon/ProductionUiRuntime.cs -Raw
          $search = Get-Content source/FishingAutomation/dungeon/ProductionSearchFlow.cs -Raw
          $states = Get-Content source/FishingAutomation/ProductionStageMachine.cs -Raw
          foreach($screen in @($craft,$gather,$bulk,$alter)){
            if($screen -notmatch 'ProductionUiRuntime'){throw 'production screen bypasses V3 runtime'}
            if($screen -match 'RefreshInputFrame'){throw 'legacy whole-frame freshness code returned'}
            if($screen -match 'GuardedInputController _input' -or $screen -match 'WindowCapture _capture'){throw 'legacy screen-owned input/capture returned'}
            if($screen -notmatch 'ProductionStageMachine'){throw 'production screen state tracking missing'}
          }
          if($runtime -match 'changed > sampled' -or $runtime -match 'sampled \* 0\.02'){throw 'whole-frame pixel diff returned'}
          if($runtime -notmatch '클릭 직전 대상 위치가 바뀌었습니다'){throw 'target ROI final re-read missing'}
          if($runtime -notmatch 'MeasureVisualChangeRatio' -or $runtime -notmatch 'HasMeaningfulVisualChange'){throw 'fixed-ROI visual transition helper missing'}
          if($search -notmatch 'TapFresh\(0x1C, ct\)'){throw 'mandatory Enter search confirmation missing'}
          if($craft -match 'ProductionSearchFlow\.SearchAndSelectAsync' -or
             $craft -match 'ClickOffsetFromStableExactAsync' -or
             $craft -match '검색창 확인 실패 · 돋보기만 OCR fallback'){throw 'unsafe crafting OCR fallback click returned'}
          if($craft -notmatch 'MeasureVisualChangeRatio' -or
             $craft -notmatch '검색창 열림 확인 · OCR 미사용' -or
             $craft -notmatch '추가 클릭 없이 정지'){throw 'crafting search visual-state stop guards missing'}
          $layout = Get-Content source/FishingAutomation/CraftingHubLayout.cs -Raw
          if($layout -notmatch 'new\(400, 862\)' -or
             $layout -notmatch 'ProductListSettleDelayMs = 1200'){throw 'live crafting search input coordinate or settle delay missing'}
          if($layout -notmatch 'new\(218, 613\)'){throw 'live crafting first result card center missing'}
          foreach($point in @('new\(275, 835\)','new\(400, 835\)','new\(525, 835\)','new\(307, 950\)','new\(507, 950\)')){
            if($layout -notmatch $point){throw "live crafting detail control missing: $point"}
          }
          if($craft -match 'ReadCraftCountAsync|ReadStableCraftCountAsync'){throw 'crafting count OCR hard gate returned'}
          if($craft -notmatch '기본 1회 유지' -or
             $craft -notmatch '기본 1회 기준' -or
             $craft -notmatch '재료 충분 · 제작하러 가기' -or
             $craft -notmatch '재료 부족 · 퀘스트 만들기'){throw 'fixed crafting detail/direct route missing'}
          if($craft -match 'for \(int i = 0; i < 9; i\+\+\)' -or
             $craft -match 'CraftCountMinusPoint, ct'){throw 'crafting count must not spam minus-reset clicks'}
          if($layout -notmatch 'CraftDetailSettleDelayMs = 100' -or
             $layout -notmatch 'CraftReadyPollDelayMs = 150'){throw 'crafting responsive delay constants missing'}
          if($layout -notmatch 'new\(742, 310\)' -or
             $layout -notmatch 'ProductionQuestPopupArea'){throw 'fixed newest production quest geometry missing'}
          if($layout -notmatch 'ProductionQuestMaterialArea' -or
             $layout -notmatch 'new\(160, 640, 480, 270\)'){throw 'live lower quest material ROI missing'}
          if($layout -notmatch 'AcquisitionMethodHeaderArea' -or
             $layout -notmatch 'new\(135, 505, 530, 115\)' -or
             $layout -notmatch 'new\(400, 650\)'){throw 'live acquisition popup/recommended geometry missing'}
          if($craft -match 'WaitForDirectCraftDepartureAsync' -or
             $craft -match '제작하러 가기 클릭 후 화면 전환/자동이동을 확인하지 못했습니다'){throw 'direct crafting must not hard-gate transient travel'}
          if($craft -notmatch 'CraftActionButtonArea' -or
             $craft -notmatch '제작대 도착 · 제작하기 버튼 즉시 확인' -or
             $craft -notmatch 'TapFresh\(0x39, ct\)'){throw 'direct crafting must quickly wait for 제작하기 and press Space'}
          if($craft -match '직접 제작대 도착 · .*회 설정'){throw 'direct crafting must not reset count again after station arrival'}
          if($craft -match '제작 완료 화면의 결과물이' -or
             $craft -match 'freshProduct'){throw 'craft completion must not hard-gate on product-name OCR'}
          if($craft -notmatch 'InventoryOnlyCountAsync\(displayName' -or
             $craft -notmatch 'CraftCompletionConfirmArea' -or
             $craft -notmatch '품목명 OCR 비필수' -or
             $craft -notmatch 'Space = 결과창 확인'){throw 'craft completion inventory/confirm fallback missing'}
          $questText = Get-Content source/FishingAutomation/CraftingQuestText.cs -Raw
          if($questText -notmatch 'IsTitleNameOnly' -or
             $questText -notmatch 'IsQuestProgress'){throw 'crafting quest split-title/structure helpers missing'}
          if($craft -notmatch 'FindQuestTitleCandidate' -or
             $craft -notmatch '퀘스트 제목 보조 인식' -or
             $craft -notmatch '준비행\+제작대행 확인'){throw 'crafting right-side quest fallback missing'}
          if($craft -match '제작 퀘스트를 오른쪽 목록에서 찾지 못했습니다' -or
             $craft -match 'firstQuest = quest.Value' -or
             $craft -match 'freshQuest = quest.Value'){throw 'post-create quest opening must not OCR the tiny right-side title'}
          if($craft -notmatch 'ProductionQuestTopPoint' -or
             $craft -notmatch '오른쪽 최상단 고정좌표' -or
             $craft -notmatch '상세창 중복 OCR 생략'){throw 'fixed post-create quest or fast count path missing'}
          if($craft -match 'var roi = new Rectangle\(70, 130, 670, 520\)' -or
             $craft -notmatch 'ProductionQuestMaterialArea' -or
             $craft -notmatch '실제 하단 재료행 기준'){throw 'quest material OCR must use live lower popup ROI'}
          if($craft -match 'new Rectangle\(45, 230, 560, 180\)' -or
             $craft -notmatch 'AcquisitionMethodHeaderArea' -or
             $craft -notmatch 'AcquisitionMethodRecommendedPoint' -or
             $craft -notmatch '추천 획득처 선택 · 고정좌표'){throw 'acquisition popup must use live header and fixed recommended row'}
          if($craft -match '제작 목록 화면을 확인하지 못했습니다' -or
             $craft -match '제작 목록 복귀를 확인하지 못했습니다'){throw 'crafting fixed list navigation must not be hard-gated by header OCR'}
          if($craft -notmatch '헤더 OCR 생략'){throw 'crafting fixed list OCR-skip trace missing'}
          if($states -notmatch 'enum ProductionStage'){throw 'V3 state machine missing'}
          if($alter -match '늦게 표시된 하단 확인 팝업 감지 · Space 입력' -or $alter -match '이동 확인 Space 입력 완료'){throw 'facility travel Space regression returned'}
          if($alter -notmatch '추가 Space 입력 없음'){throw 'passive facility travel rule missing'}

      - name: Quest travel CLI rejection regression guard
        shell: pwsh
        run: |
          $craft = Get-Content source/FishingAutomation/dungeon/CraftingScreen.cs -Raw
          $data = Get-Content source/FishingAutomation/CraftingCliData.cs -Raw
          if ($craft -notmatch 'IsTransientLoadingRejection\(activityResponse\)') { throw 'crafting travel transient activity rejection guard missing' }
          if ($craft -notmatch '재고 CLI 조회 생략') { throw 'crafting must skip inventory polling while travel/gathering is active' }
          if ($craft -notmatch 'InventoryOnlyCountWithLoadingRetryAsync') { throw 'crafting post-travel inventory retry path missing' }
          if ($data -notmatch 'get_items CLI 일시 거부') { throw 'crafting inventory transient rejection retry logging missing' }

      - name: Crafting search-only catalog regression guard
        shell: pwsh
        run: |
          $queries = Get-Content source/FishingAutomation/CraftingQueries.cs -Raw
          $page = Get-Content source/FishingAutomation/MainForm.CraftingPage.cs -Raw
          if ($queries -notmatch 'ResolveUiCategory') { throw 'search-only crafting station resolver missing' }
          if ($page -match '제작 분류 탭|제작 아이템|제작 음식|BuildCategoryTabs|SetCategory') { throw 'crafting item/food tabs must stay removed' }
          if ($page -notmatch '전체 제작 품목을 한 목록에서 검색') { throw 'search-only crafting guidance missing' }
          if ($page -notmatch 'var visible = _choices') { throw 'crafting search must filter the full catalog' }

      - name: Runtime transition regression guard
        shell: pwsh
        run: |
          $craftScreen = Get-Content source/FishingAutomation/dungeon/CraftingScreen.cs -Raw
          $alterScreen = Get-Content source/FishingAutomation/dungeon/AlteringScreen.cs -Raw
          $gatherData = Get-Content source/FishingAutomation/GatheringCliData.cs -Raw
          $gatherAuto = Get-Content source/FishingAutomation/GatheringAutomation.cs -Raw
          if ($craftScreen -notmatch '_lastSingleQuestDeficit' -or $craftScreen -notmatch '직전 마지막 부족 재료 재고 검증 완료') { throw 'crafting final-material empty-row recovery missing' }
          if ($alterScreen -notmatch 'TryFacilityWorkCountAsync' -or $alterScreen -notmatch 'CLI 작업 감소로 수령 확정') { throw 'altering receipt CLI evidence fallback missing' }
          $receiptPolicy = Get-Content source/FishingAutomation/AlteringReceiptPolicy.cs -Raw
          if ($receiptPolicy -notmatch '!travelDialogVisible' -or $receiptPolicy -notmatch '!autoTraveling') { throw 'altering receipt travel veto policy missing' }
          if ($alterScreen -notmatch '완료품 수령 전 현장 가공대 확인' -or
              $alterScreen -notmatch 'await TravelToFacilityAsync\(plan, ct\)' -or
              $alterScreen -notmatch '설비로 이동 없음.*파란 수령 버튼.*Space') { throw 'altering receipt must prove on-site bench before Space' }
          if ($alterScreen -notmatch 'IsFacilityTravelDialogAsync' -or
              $alterScreen -notmatch 'AutoTraveling=true · 추가 Space 차단') { throw 'altering completion travel popup/autotravel Space veto missing' }
          if ($gatherData -notmatch 'IsTransientLoadingRejection' -or $gatherData -notmatch '20회 연속 거절') { throw 'gathering transient CLI retry missing' }
          if ($gatherAuto -notmatch '이동 중 · 재고 CLI 조회 생략') { throw 'gathering pure-travel inventory skip missing' }

      - name: Crafting UI parity regression guard
        shell: pwsh
        run: |
          $craft = Get-Content source/FishingAutomation/MainForm.CraftingPage.cs -Raw
          if ($craft -match 'AccessibleName = "제작 분류 탭"' -or
              $craft -match 'Button\("아이템"' -or
              $craft -match 'Button\("음식"') { throw 'crafting category controls returned' }
          if ($craft -notmatch 'Math\.Min\(ClientSize\.Width / 1212f, ClientSize\.Height / 858f\)') { throw 'crafting typography scale does not match production page' }
          if ($craft -notmatch 'Typography\(header\.Controls\[0\], 36\)') { throw 'crafting title typography mismatch' }
          if ($craft -notmatch 'BuildLabeledField\("품목 검색", _search, "crafting-field"\)') { throw 'crafting search field missing' }

      - name: Production UI unification regression guard
        shell: pwsh
        run: |
          $prod = Get-Content source/FishingAutomation/MainForm.ProductionPage.cs -Raw
          $craft = Get-Content source/FishingAutomation/MainForm.CraftingPage.cs -Raw
          if ($prod -notmatch 'internal readonly ListBox Items') { throw 'processing/gathering text list missing' }
          if ($craft -notmatch 'internal readonly ListBox Items') { throw 'crafting text list missing' }
          if ($prod -notmatch 'AccessibleName = "실행 상태"') { throw 'production right status column missing' }
          if ($craft -notmatch 'AccessibleName = "제작 실행 상태"') { throw 'crafting right status column missing' }
          if ($prod -match '_pageLog' -or $craft -match '_pageLog') { throw 'embedded production log UI must stay removed' }
          if ($prod -notmatch '_search\.TextChanged \+= \(_, _\) => Filter\(\)') { throw 'shared production search missing' }
          if ($prod -notmatch 'AccessibleName = "가공 시설 "') { throw 'existing altering facility tabs missing' }
          if ($craft -match '제작 분류 탭|제작 아이템|제작 음식') { throw 'crafting item/food tabs returned' }
          if ($craft -notmatch 'var visible = _choices') { throw 'crafting full-catalog search list missing' }
          if ($prod -match 'summaries\.Controls\.Add' -or $craft -match 'summaryLayout\.Controls\.Add') { throw 'old owned-summary UI returned' }
          $productionUi = Get-Content source/FishingAutomation/MainForm.ProductionUI.cs -Raw
          if ($productionUi -notmatch 'class QuantityTextBox : TextBox') { throw 'plain quantity input missing' }
          if ($prod -match 'ArrowlessNumericUpDown|UpDownButtons' -or $craft -match 'ArrowlessNumericUpDown|UpDownButtons') { throw 'native quantity spinner artifact path returned' }

      - name: Inline production UI regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/production-ui/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Production UI regressions failed' }

      - name: Publish Windows binaries
        shell: pwsh
        run: |
          New-Item artifacts/app,artifacts/watchdog -ItemType Directory -Force | Out-Null
          dotnet publish source/FishingAutomation/FishingAutomation.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:PublishAot=false -p:DebugType=None -p:DebugSymbols=false -o artifacts/app
          if ($LASTEXITCODE -ne 0) { throw 'dotnet step failed' }
          dotnet publish source/MacroWatchdog/MacroWatchdog.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:PublishAot=false -p:DebugType=None -p:DebugSymbols=false -o artifacts/watchdog
          if ($LASTEXITCODE -ne 0) { throw 'dotnet step failed' }
          if ((Get-Item artifacts/app/FishingAutomation.exe).VersionInfo.FileVersion -ne '3.0.20.0') { throw 'EXE version mismatch' }
      - name: Smoke test published app
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path artifacts/app/FishingAutomation.exe).Path
          $process=Start-Process $exe -WorkingDirectory (Resolve-Path artifacts/app).Path -WindowStyle Hidden -PassThru
          Start-Sleep 5
          $process.Refresh()
          if($process.HasExited){throw "App exited early: $($process.ExitCode)"}
          Stop-Process $process.Id -Force
          Get-Process MacroWatchdog -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Package
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $pkg = Join-Path $PWD 'artifacts/package'
          $release = Join-Path $pkg 'release'
          $tools = Join-Path $pkg 'tools'
          $compat = Join-Path $pkg 'FishingAutomation'
          New-Item $release,$tools,$compat -ItemType Directory -Force | Out-Null
          Copy-Item artifacts/app/* $release -Recurse -Force
          Copy-Item source/FishingAutomation/interception.dll (Join-Path $release 'interception.dll') -Force
          Copy-Item artifacts/watchdog/MacroWatchdog.exe (Join-Path $release 'MacroWatchdog.exe') -Force
          Copy-Item source/tools/ApplyUpdate.ps1 (Join-Path $tools 'ApplyUpdate.ps1') -Force
          Copy-Item source/tools/RollbackPrevious.ps1 (Join-Path $tools 'RollbackPrevious.ps1') -Force
          Copy-Item source/ROLLBACK_PREVIOUS.cmd (Join-Path $pkg 'ROLLBACK_PREVIOUS.cmd') -Force
          Copy-Item source/START.cmd (Join-Path $pkg 'START.cmd') -Force
          Copy-Item source/REPAIR_AUTO_UPDATE.cmd (Join-Path $pkg 'REPAIR_AUTO_UPDATE.cmd') -Force
          'Compatibility directory for legacy updater notification restore.' | Set-Content (Join-Path $compat '.update_compat') -Encoding ASCII
          'MABI AUTO V3.0.20 Windows Lite - user ZIP UI, free gathering and read-only CLI diagnostics' | Set-Content (Join-Path $pkg 'WINDOWS_LITE.txt') -Encoding UTF8
          $required = @(
            'release/FishingAutomation.exe','release/MacroWatchdog.exe',
            'release/abyss/config/targets.json','release/abyss/config/scenario.json',
            'release/abyss/templates/loot_v173/loot_hallucination_stone.png',
            'release/abyss/templates/loot_v173/loot_mor_corsair_tricorne.png',
            'release/interception.dll','START.cmd','tools/ApplyUpdate.ps1',
            'ROLLBACK_PREVIOUS.cmd','tools/RollbackPrevious.ps1')
          foreach($r in $required){ if(-not (Test-Path (Join-Path $pkg $r))){ throw "missing $r" } }
          git rev-parse HEAD | Set-Content (Join-Path $pkg 'BUILD_COMMIT.txt') -Encoding ASCII
          $winZip = Join-Path $PWD 'artifacts/MabiAuto_V3.0.20_Windows_Lite.zip'
          [System.IO.Compression.ZipFile]::CreateFromDirectory($pkg,$winZip,[System.IO.Compression.CompressionLevel]::Optimal,$false)
          $sha = (Get-FileHash $winZip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  MabiAuto_V3.0.20_Windows_Lite.zip" | Set-Content "$winZip.sha256" -Encoding ASCII
          $srcStage = Join-Path $PWD 'artifacts/source-package'
          New-Item $srcStage -ItemType Directory -Force | Out-Null
          Copy-Item source (Join-Path $srcStage 'source') -Recurse -Force
          Copy-Item changes (Join-Path $srcStage 'changes') -Recurse -Force
          Copy-Item BUILD_VERIFY.ps1,README.txt,GITHUB_MIGRATION.md $srcStage -Force
          Copy-Item tests (Join-Path $srcStage 'tests') -Recurse -Force
          Copy-Item .github (Join-Path $srcStage '.github') -Recurse -Force
          git rev-parse HEAD | Set-Content (Join-Path $srcStage 'BUILD_COMMIT.txt') -Encoding ASCII
          $buildDirs = @(Get-ChildItem $srcStage -Directory -Recurse | Where-Object { $_.Name -in @('bin','obj') })
          foreach ($dir in ($buildDirs | Sort-Object { $_.FullName.Length } -Descending)) { if(Test-Path -LiteralPath $dir.FullName){ $resolved=(Resolve-Path -LiteralPath $dir.FullName).Path; if(-not $resolved.StartsWith($srcStage + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)){throw 'Unsafe cleanup path'}; Remove-Item -LiteralPath $resolved -Recurse -Force } }
          $srcZip = Join-Path $PWD 'artifacts/MabiAuto_V3.0.20_Source.zip'
          [System.IO.Compression.ZipFile]::CreateFromDirectory($srcStage,$srcZip,[System.IO.Compression.CompressionLevel]::Optimal,$false)
      - name: Upload verified release packages
        uses: actions/upload-artifact@v4
        with:
          name: V3.0.20-release-packages
          path: |
            artifacts/MabiAuto_V3.0.20_Windows_Lite.zip
            artifacts/MabiAuto_V3.0.20_Windows_Lite.zip.sha256
            artifacts/MabiAuto_V3.0.20_Source.zip
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=50" | ConvertFrom-Json
          if($LASTEXITCODE-ne0){throw 'Release list failed'}
          $r = @($releases | Where-Object { $_.tag_name -eq 'V3.0.20' }) | Select-Object -First 1

