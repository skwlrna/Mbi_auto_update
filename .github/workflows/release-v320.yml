          git fetch origin release-v320-code
          if($LASTEXITCODE-ne0){throw 'Release code branch fetch failed'}
          $releaseTarget=(git rev-parse origin/release-v320-code).Trim()
          if($releaseTarget -ne '285fdd1154a6dd5b73b95e27eff4f5c161a94d22'){throw "Release code target mismatch: $releaseTarget"}

          if(-not $r) {
