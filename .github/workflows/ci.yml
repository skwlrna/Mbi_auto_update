          if ($altering -notmatch 'oldMinimum = checked' -or $altering -notmatch 'grossGained - oldMinimum') { throw 'pre-existing output exclusion missing from final verification' }

          $mainAltering = Get-Content source/FishingAutomation/MainForm.Altering.cs -Raw
          if ($mainAltering -notmatch 'sessionStore\.Load\(\)' -or $mainAltering -notmatch 'MatchesPlan\(plan\)' -or $mainAltering -notmatch 'MatchesIdentity\(identity\.Baseline\)') { throw 'UI resume preflight validation missing' }
          if ($mainAltering -notmatch 'sessionStore: sessionStore' -or $mainAltering -notmatch 'session: session') { throw 'persistent session not wired into altering automation' }
          if ($mainAltering -notmatch 'automation\.Progress \+=' -or $mainAltering -notmatch '_productionProgressSummary = progress\.Summary') { throw 'live one-line progress is not wired to the UI' }
          if ($mainAltering -notmatch 'automation\.NoteStage' -or $mainAltering -notmatch 'LastObservedOutputQuantity') { throw 'deep material stage/output resume validation is not wired' }
          if ($mainAltering -notmatch '시작 전.*materialEstimate') { throw 'start-time material estimate log missing' }

          $productionPage = Get-Content source/FishingAutomation/MainForm.ProductionPage.cs -Raw
          if ($productionPage -notmatch 'ApplySavedAlteringSessionSelection' -or $productionPage -match '이어하기 대기|ReadPendingPlans\(') { throw 'fresh F9 production page must not auto-restore a historical session' }
          $alteringQueries = Get-Content source/FishingAutomation/AlteringQueries.cs -Raw
          if ($alteringQueries -notmatch 'AlteringFacilityResolver' -or $alteringQueries -notmatch 'FoodRecipes' -or $alteringQueries -notmatch 'MedicineRecipes') { throw 'shared facility resolver for food/medicine missing' }
          foreach($foodName in @('마요네즈','밀가루','치즈','면','생크림')){
            if($alteringQueries -notmatch [regex]::Escape($foodName)){throw "food recipe classification missing: $foodName"}
          }
          foreach($medicineName in @('새록 버섯 진액','튼튼 버섯 가루','불꽃의 결정')){
            if($alteringQueries -notmatch [regex]::Escape($medicineName)){throw "medicine recipe classification missing: $medicineName"}
          }
          if ($alteringQueries -notmatch 'MissingIngredients' -or $alteringQueries -notmatch 'continue;') { throw 'facility metadata scan must skip ingredient payloads' }
          foreach($tabLabel in @('"목재"','"금속"','"가죽"','"옷감"','"약품"','"식재료"')){
            if($productionPage -notmatch [regex]::Escape($tabLabel)){throw "short facility tab label missing: $tabLabel"}
          }
          if ($productionPage -notmatch 'AlteringFacilityResolver\.Resolve') { throw 'production tabs are not using shared facility resolver' }
          if ($productionPage -notmatch 'AlteringMaterialEstimate\.Describe') { throw 'material estimate preview is not shown on quantity/recipe selection' }
          if ($productionPage -notmatch '_productionProgressSummary') { throw 'production page does not display live progress summary' }
          if ($productionPage -notmatch '_search\.PlaceholderText = "품목을 검색하세요"' -or
              $productionPage -notmatch 'BuildLabeledField\("품목 검색", _search, "production-field"\)') { throw 'shared altering/gathering item search wiring missing' }
          if ($productionPage -notmatch '_search\.TextChanged \+= \(_, _\) => Filter\(\)' -or
              $productionPage -notmatch 'if \(!string\.IsNullOrWhiteSpace\(search\)\)') { throw 'shared production search filter missing' }
          if ($productionPage -notmatch 'FacilityUiOrder' -or $productionPage -notmatch 'BuildFacilityTabs' -or $productionPage -notmatch 'RecipeFacility') { throw 'facility-tab recipe filtering UI missing' }
          foreach($facilityTab in @('목재 가공 시설','금속 가공 시설','가죽 가공 시설','옷감 가공 시설','약품 가공 시설','식재료 가공 시설')){
            if($productionPage -notmatch [regex]::Escape($facilityTab)){throw "facility tab missing: $facilityTab"}
          }
          $productionUi = Get-Content source/FishingAutomation/MainForm.ProductionUI.cs -Raw
          if ($productionUi -notmatch 'class QuantityTextBox : TextBox') { throw 'plain target quantity input missing' }
          if ($productionPage -notmatch 'Quantity = new QuantityTextBox' -or $productionPage -match 'ArrowlessNumericUpDown|UpDownButtons') { throw 'gathering and altering must use the artifact-free quantity text input' }
          if ($productionPage -match 'AddRow\(form, 4, "가공 시설", Facility\)') { throw 'old altering facility dropdown returned to visible UI' }
          if ($altering -notmatch 'int freeSlots = Math\.Max\(0, 7 - facilityCount\)') { throw 'seven-slot free-capacity calculation missing' }
          if ($altering -notmatch 'int batchGoal = Math\.Min\(freeSlots, plan\.RequiredWorks - QueuedWorks\)') { throw 'batch size must be capped by free slots and remaining works' }
          if ($altering -notmatch 'while \(queuedThisBatch < batchGoal') { throw 'verified batch registration loop missing' }
          if ($altering -notmatch '일괄 등록 시작' -or $altering -notmatch '일괄 등록 완료') { throw 'batch registration diagnostics missing' }
          if ($altering -notmatch 'count > previous \+ 1' -or $altering -notmatch 'count == previous \+ 1') { throw 'each batched slot must still be CLI-verified exactly once' }
          if ($altering -notmatch 'ct, TimeSpan\.FromSeconds\(1\)') { throw 'registration verification must poll every second' }
          if ($altering -notmatch '기존 .* 작업 .*건 유지 · 완료되는 즉시 수령하고 빈 슬롯에 새 목표 작업을 채웁니다') { throw 'legacy jobs must remain while freed slots are refilled' }
          if ($altering -match '기존 동일 품목 작업 수령 완료') { throw 'legacy jobs must not be fully drained before new target registration' }
          if ($altering -notmatch 'bool firstCollected;' -or
              $altering -notmatch 'firstCollected = await coordinated\.CollectAsync\(plan, directive, ct\)' -or
              $altering -notmatch 'firstCollected = await _screen\.CollectAsync\(plan, ct\)' -or
              $altering -notmatch '자체 재이동/2차 수령 금지') { throw 'first receive must obey manager authority while Automatic keeps legacy behavior' }
          if ($altering -match 'for \(int i = 0; i < 4; i\+\+\)[\s\S]{0,500}TimeSpan\.FromSeconds\(2\)') { throw 'old eight-second first-receipt queue polling returned' }
          if ($altering -notmatch '1차 모두 받기 = 설비 이동 · 즉시 가공대 수령 화면 대기') { throw 'immediate travel branch diagnostic missing' }
          if ($altering -notmatch 'TimeSpan delay = pollDelay \?\? TimeSpan\.FromSeconds\(5\)') { throw 'non-registration verification default delay changed unexpectedly' }
          if ($altering -notmatch 'StallThreshold = TimeSpan\.FromSeconds\(60\)') { throw 'altering stall threshold must stay at 60 seconds' }
          if ($altering -notmatch 'MaxStallRecoveries = 3') { throw 'altering stall recovery bound missing' }
          if ($altering -notmatch 'ProgressSignature\(works, plan, QueuedWorks\)') { throw 'queue progress signature stall detector missing' }
          if ($altering -notmatch '정체 감지' -or $altering -notmatch 'RecoverStallUnderManagerAsync') { throw 'altering stall recovery must delegate to manager' }
          if ($altering -notmatch 'lastProgressAt = DateTime\.UtcNow') { throw 'stall recovery grace window reset missing' }
          if ($altering -notmatch '마지막 진단 화면을 저장한 상태로 정지합니다') { throw 'bounded stall final-stop diagnostic missing' }

          $recovery = [regex]::Match($screen, 'public async Task RecoverStallAsync[\s\S]*?(?=\r?\n    private void Fail)').Value
          if ([string]::IsNullOrWhiteSpace($recovery)) { throw 'altering screen stall recovery method missing' }
          if ($recovery -notmatch 'altering-stall-last\.png') { throw 'stall screenshot output missing' }
          if ($recovery -notmatch '_cachedRecipeKey = null' -or $recovery -notmatch '_hasCachedRecipeCenter = false') { throw 'stall recovery must clear fast-path recipe assumptions' }
          if ($recovery -notmatch 'EnterFacilityAsync\(plan, ct\)') { throw 'stall recovery must safely re-evaluate the requested facility' }
          if ($recovery -match 'TravelToFacilityAsync\(' -or $recovery -match 'SelectRecipeAsync\(' -or $recovery -match 'QueueAsync\(') { throw 'stall recovery must not travel, select recipe, or register work' }
          if ($recovery -notmatch 'TapFresh\(0x01, ct\)' -or $recovery -match 'TapFresh\(0x39, ct\)') { throw 'stall popup recovery may cancel with Escape but must never confirm with Space' }

          # V3.1.72: only F9 manager K-navigation uses two independent
          # bottom-tab structure frames + CLI idle before its fixed click.
          # Inconclusive screens still use the original bounded OCR fallback.
          $managerK = [regex]::Match($screen,
              'private async Task<bool> TrySelectManagedProcessingTabAsync[\s\S]*?(?=\r?\n    private async Task<bool> ClickLabelAsync)').Value
          $managerEntry = [regex]::Match($screen,
              'private async Task EnterFacilityAsync[\s\S]*?(?=\r?\n    private static string RecipeCacheKey)').Value
          $visualWait = [regex]::Match($screen,
              'private Task<bool> WaitForManagedProcessingNavigationReadyAsync[\s\S]*?(?=\r?\n    private Task<bool> WaitForProcessingNavigationReadyAsync)').Value
          if ([string]::IsNullOrWhiteSpace($managerK) -or
              [string]::IsNullOrWhiteSpace($managerEntry) -or
              [string]::IsNullOrWhiteSpace($visualWait) -or
              $managerK -notmatch 'directive == AlteringFacilityEntryDirective.Automatic' -or
              $managerK -notmatch 'HasManagedProcessingBottomTabVisual' -or
              $managerK -notmatch 'HasManagedKEntryBlockingModal' -or
              $managerK -notmatch 'RequireManagedIdleAsync' -or
              $managerK -notmatch 'new Point\(360, 948\)' -or
              $managerEntry -notmatch 'TrySelectManagedProcessingTabAsync' -or
              $managerEntry -notmatch 'WaitForManagedProcessingNavigationReadyAsync' -or
              $managerEntry -notmatch 'await ClickLabelAsync\("가공"' -or
              $visualWait -match 'FindAsync\(|FindFacilityHeaderAsync\(' -or
              $screen -notmatch 'HasManagedKEntryFieldHudVisual' -or
              $screen -notmatch 'HasFixedProcessingHubVisual' -or
              $managerEntry -notmatch 'CanAuthorizeManagedKEntry' -or
              $managerEntry -notmatch 'DetectManagedWorldHudTemplates' -or
              $managerEntry -match 'HasManagedKEntryFieldHudVisual' -or
              $screen -notmatch 'abyss/templates/outside_home_v75.png' -or
              $screen -notmatch 'abyss/templates/outside_end_v75.png' -or
              $screen -notmatch 'abyss/templates/outside_k_v75.png' -or
              $screen -notmatch 'abyss/templates/outside_i_v75.png') {
              throw 'V3.1.75 F9 K requires first-press CLI+modal guard and template-verified re-entry, no old colour veto'
          }
          $zeroWing = Get-Content source/FishingAutomation/ZeroWingScreenGuards.cs -Raw
          if ($zeroWing -notmatch 'ZeroWingAlteringScreen : IAlteringScreen' -or
              $zeroWing -notmatch 'IAlteringCoordinatorQueueScreen' -or
              $zeroWing -notmatch 'IAlteringRecoveryScreen') { throw 'zero-wing wrapper does not expose coordinator queue and guarded stall recovery' }
          if ($zeroWing -notmatch 'GuardAsync\("\[자동 가공\] 정체 화면 재판정"') { throw 'stall recovery is not wrapped in currency verification' }
          # M2: manager-directed recovery must report a non-travel UI
          # observation; the manager alone can re-confirm prior onsite.
          $alterTests = Get-Content tests/altering/Program.cs -Raw
          $managedRecovery = [regex]::Match(
              $screen,
              'public async Task<AlteringStallRecoveryObservation> RecoverStallForCoordinatorAsync[\s\S]*?(?=\r?\n    public async Task RecoverStallAsync)').Value
          if ([string]::IsNullOrWhiteSpace($managedRecovery) -or
              $managedRecovery -notmatch '_confirmedOnsiteFacility = null' -or
              $managedRecovery -notmatch 'await EnterFacilityAsync\(plan, ct, AlteringFacilityEntryDirective.ReuseCoordinatorConfirmedOnsite\)' -or
              $managedRecovery -notmatch 'for \(int pass = 0; pass < 2; pass\+\+\)' -or
              $managedRecovery -notmatch 'HasBottomConfirmationModal' -or
              $managedRecovery -notmatch 'TryAutoTravelingAsync' -or
              $managedRecovery -notmatch 'SameFacilityUiRestoredWithoutTravel' -or
              $managedRecovery -match 'HasFacilityMoveButtonVisual\(' -or
              $managedRecovery -match 'TravelToFacilityAsync\(' -or
              $managedRecovery -match 'forceMoveClick' -or
              $managedRecovery -match 'TapFresh\(0x39') {
              throw 'M2 managed stall recovery must only observe proven nontravel UI without button-based location reclassification'
          }
          $managerRecovery = [regex]::Match(
              $altering,
              'internal async Task RecoverStallUnderManagerAsync[\s\S]*?(?=\r?\n    internal void NoteStage)').Value
          if ([string]::IsNullOrWhiteSpace($managerRecovery) -or
              $managerRecovery -notmatch 'wasOnsite = _facilityState.IsOnsiteConfirmed' -or
              $managerRecovery -notmatch '_facilityState.InvalidateOnsite' -or
              $managerRecovery -notmatch 'RecoverStallForCoordinatorAsync' -or
              $managerRecovery -notmatch 'AlteringStallRecoveryPolicy.CanRetainOnsite' -or
              $managerRecovery -notmatch '_facilityState.ConfirmOnsite' -or
              $altering -notmatch 'IAlteringCoordinatorStallRecoveryScreen' -or
              $zeroWing -notmatch 'IAlteringCoordinatorStallRecoveryScreen' -or
              $zeroWing -notmatch '중간관리자 정체 복구 증거 확인' -or
              $alterTests -notmatch 'M2: coordinator re-confirms previously proven onsite' -or
              $alterTests -notmatch 'M2: UI recovery cannot create onsite authority' -or
              $alterTests -notmatch 'M2: popup, travel, missing header or unknown CLI' -or
              $alterTests -notmatch 'M2: manager invalidates onsite before failed stall recovery' -or
              $alterTests -notmatch 'M2: single-altering keeps its bounded legacy recovery') {
              throw 'M2 stall recovery outcome is not controlled by lane manager'
          }
          $detailPolicy = Get-Content source/FishingAutomation/AlteringDetailPolicy.cs -Raw
          if ($detailPolicy -notmatch 'materialsVisible && \(freeActionVisible \|\| paidActionVisible\)') { throw 'detail fallback policy weakened' }
          $wingGuard = Get-Content source/FishingAutomation/ZeroWingScreenGuards.cs -Raw
          if ($wingGuard -notmatch '시작 실패 후 날개 검사') { throw 'failed gathering start wing log label missing' }


      - name: Automatic gathering regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/gathering/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Gathering regressions failed' }
          $screen = Get-Content source/FishingAutomation/dungeon/GatheringScreen.cs -Raw
          if ($screen -match 'Normalize\(name') { throw 'first-place OCR string equality check returned' }
          if ($screen -notmatch 'GatheringNavigationPolicy\.IsStableFirstRow') { throw 'first-place geometry stability gate missing' }
          if ($screen -notmatch 'first\.Value\.Bounds\.Left\+first\.Value\.Bounds\.Width/2') { throw 'fresh second-frame row click missing' }
          if ($screen -notmatch 'beforeCount=await _data\.ItemCountAsync' -or $screen -notmatch 'gained>=plan\.TargetQuantity') { throw 'inventory-based gathering success evidence missing' }
          if ($screen -notmatch 'activity 상태와 무관하게 성공 처리') { throw 'inventory-authoritative completion log missing' }
          $ingredientClick = [regex]::Match($screen, 'private async Task ClickIngredientAsync[\s\S]*?(?=\r?\n    private async Task ClickMethodAsync)').Value
          if ([string]::IsNullOrWhiteSpace($ingredientClick)) { throw 'gathering ingredient selection method missing' }
          if ($ingredientClick -notmatch 'dim:true') { throw 'gathering ingredient names must use dim-text OCR' }
          if ($ingredientClick -notmatch '필요한 재료' -or $ingredientClick -notmatch '어두운 재료명 OCR 2프레임 확인') { throw 'dim ingredient structural/two-frame confirmation missing' }
          if ($ingredientClick -match 'DragClientPoint') { throw 'gathering ingredient selection must not drag the recipe UI' }
          $vision = Get-Content source/FishingAutomation/dungeon/GatheringVision.cs -Raw
          if ($vision -match 'names\.Length != 1') { throw 'first-place OCR still requires exactly one text read' }
          $queries = Get-Content source/FishingAutomation/GatheringQueries.cs -Raw
          if ($queries -match 'IsSafeField[^\r\n]*IsAutoPlaying' -or $queries -match '!IsAutoPlaying') { throw 'IsAutoPlaying must not be an unsafe-field gate' }
          if ($queries -notmatch 'DescribeCatalogSchema') { throw 'read-only gatherable schema diagnostics missing' }
          $productionPage = Get-Content source/FishingAutomation/MainForm.ProductionPage.cs -Raw
          $catalogLoader = [regex]::Match($productionPage, 'internal async Task LoadCatalogAsync[\s\S]*?(?=\r?\n        private void ApplySavedAlteringSessionSelection)').Value
          if ($catalogLoader -notmatch 'GetGatherableItemsAsync' -or $catalogLoader -notmatch 'DescribeCatalogSchema') { throw 'gatherable schema probe is not wired to catalog refresh' }
          if ($catalogLoader -match 'ExecuteGatheringAsync|ExecuteAlteringAsync|StopActionAsync|CompleteAlteringWorkAsync') { throw 'catalog schema probe must remain read-only' }
          if ($queries -match 'IsSafeField[\s\S]{0,300}!IsInBattlefield') { throw 'Battlefield flag must not be an unsafe-field gate' }
          $automation = Get-Content source/FishingAutomation/GatheringAutomation.cs -Raw
          if ($automation -notmatch 'AutoPlaying=' -or $automation -notmatch 'Battlefield=') { throw 'gathering activity diagnostics missing' }
          $safetyPolicy = Get-Content source/FishingAutomation/GatheringSafetyPolicy.cs -Raw
          if ($automation -notmatch 'GatheringSafetyPolicy\.IsSafeField' -or
              $automation -notmatch 'WaitForCombatEndAsync' -or
              $automation -notmatch '전투 중 · 입력 없이 종료 대기') { throw 'gathering combat-wait policy is not wired to execution' }
          if ($safetyPolicy -match 'IsClearlyStaleReviving' -or
              $safetyPolicy -match 'activity\.IsReviving') { throw 'Reviving must not gate gathering safety' }
          if ($safetyPolicy -notmatch 'ShouldWaitForCombat' -or
              $safetyPolicy -notmatch 'activity\.IsInCombat') { throw 'combat wait-state policy missing' }
          foreach($hardGate in @('IsDead','IsDialoguePlaying','IsWaitingForSelection','NotInDungeon','IsPlayingMiniGame')){
            if($safetyPolicy -notmatch $hardGate){throw "gathering hard safety gate missing: $hardGate"}
          }
          $bulkScreen = Get-Content source/FishingAutomation/dungeon/InventoryBulkGatheringScreen.cs -Raw
          # V3.1.70: exact OCR+icon must succeed in both real dynamic row
          # captures; click that SECOND OCR center with NO third OCR pass.
          $bulkLifeStart = [regex]::Match($bulkScreen, 'private async Task StartLifeSkillHundredAsync[\s\S]*?(?=\r?\n    private static Point LifeSkillNearestClickPoint)').Value
          $bulkStableRow = [regex]::Match($bulkScreen, 'private async Task<DetectionResult\?> FindStableLifeSkillRowAsync[\s\S]*?(?=\r?\n    private async Task<DetectionResult\?> FindLifeSkillLabelAsync)').Value
          if ([string]::IsNullOrWhiteSpace($bulkLifeStart) -or [string]::IsNullOrWhiteSpace($bulkStableRow)) {
            throw 'two-frame life-skill dynamic row methods missing'
          }
          if ($bulkLifeStart -notmatch 'FindStableLifeSkillRowAsync\(source, ct\)' -or
              $bulkLifeStart -notmatch 'Math\.Clamp\(row\.Value\.Center\.X, 180, 740\)' -or
              $bulkLifeStart -notmatch 'row\.Value\.Center\.Y' -or
              $bulkLifeStart -match 'for \(int pass = 1; pass <= 3; pass\+\+\)' -or
              $bulkLifeStart -match 'clickRow\.Value|lastConfirmFrame|rowRoi') {
            throw 'dynamic life-skill selection must click second OCR row, never third-pass / fixed row'
          }
          if ([regex]::Matches($bulkStableRow, 'FindLifeSkillLabelAsync\(').Count -ne 2 -or
              $bulkStableRow -notmatch 'GatheringNavigationPolicy\.IsStableFirstRow' -or
              [regex]::Matches($bulkStableRow, 'HasRowIconVisual\(').Count -lt 2 -or
              $bulkStableRow -notmatch 'return second;') {
            throw 'bulk gathering must verify exact OCR/icon on TWO fresh screen captures'
          }
          if ($bulkScreen -notmatch 'GatheringSafetyPolicy\.IsSafeField' -or
              $bulkScreen -notmatch 'WaitForCombatEndAsync' -or
              $bulkScreen -notmatch '전투 중 · 입력 없이 종료 대기') { throw 'bulk life-skill combat wait is not wired' }
          $stopPolicy = Get-Content source/FishingAutomation/LifeSkillStopPolicy.cs -Raw
          $postStop = [regex]::Match($bulkScreen, 'private async Task ConfirmLifeSkillStoppedAsync[\s\S]*?(?=\r?\n    private async Task StartInventoryHundredQuestAsync)').Value
          if ([string]::IsNullOrWhiteSpace($postStop)) { throw 'post-Space life-skill stop confirmation missing' }
          if ($postStop -notmatch 'LifeSkillStopPolicy\.IsStoppedAfterSpace') { throw 'post-Space stop confirmation must use activity-only policy' }
          if ($postStop -match 'IsOwnedLifeSkillActivity\(activity\)') { throw 'stale MainButtonState must not keep post-Space gathering alive' }
          if ($postStop -notmatch 'MainButtonState 잔상은 종료 판정에서 제외') { throw 'post-Space stale button diagnostic missing' }
          if ($stopPolicy -notmatch '!activity\.IsGathering' -and $stopPolicy -notmatch '!isGathering') { throw 'post-Space policy must require gathering ended' }
          if ($stopPolicy -notmatch '!activity\.IsAutoTraveling' -and $stopPolicy -notmatch '!isAutoTraveling') { throw 'post-Space policy must require travel ended' }
          if ($stopPolicy -notmatch '!activity\.IsFishing' -and $stopPolicy -notmatch '!isFishing') { throw 'post-Space policy must require fishing ended' }
          if ($stopPolicy -match 'MainButtonState') { throw 'post-Space policy must ignore stale main-button state' }
          $lifeLayout = Get-Content source/FishingAutomation/LifeSkillListLayout.cs -Raw
          if ($bulkScreen -notmatch 'LifeSkillListLayout\.TryFixedRowPoint') { throw 'fixed one-page life-skill row policy is not wired' }
          if ($bulkScreen -notmatch 'LifeSkillListLayout\.SafeDragStart' -or
              $bulkScreen -notmatch 'LifeSkillListLayout\.SafeDragEnd') { throw 'safe in-modal life-skill drag policy is not wired' }
          if ($bulkScreen -match 'new Point\(715, 765\)' -or $bulkScreen -match 'new Point\(715, 345\)') { throw 'unsafe border-adjacent life-skill drag returned' }
          if ($lifeLayout -notmatch '"추수"' -or
              $lifeLayout -notmatch '"양털 깎기"' -or
              $lifeLayout -notmatch 'NeverScroll') { throw 'one-page harvest/wool no-scroll policy missing' }
          foreach($point in @('new Point\(400, OnePageRowY\[index\]\)','580, 760','580, 350')){
            if($lifeLayout -notmatch $point){throw "life-skill fixed/safe layout evidence missing: $point"}
          }

      - name: V3 production engine regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/crafting/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Crafting/V3 production regressions failed' }

          $crafting = Get-Content source/FishingAutomation/MainForm.Crafting.cs -Raw
          $craftScreen = Get-Content source/FishingAutomation/dungeon/CraftingScreen.cs -Raw
          $craftEngine = Get-Content source/FishingAutomation/CraftingAutomation.cs -Raw
          $gatherScreen = Get-Content source/FishingAutomation/dungeon/GatheringScreen.cs -Raw
          $bulkScreen = Get-Content source/FishingAutomation/dungeon/InventoryBulkGatheringScreen.cs -Raw
          $gatherVision = Get-Content source/FishingAutomation/dungeon/GatheringVision.cs -Raw
          $alterScreen = Get-Content source/FishingAutomation/dungeon/AlteringScreen.cs -Raw
          $runtime = Get-Content source/FishingAutomation/dungeon/ProductionUiRuntime.cs -Raw
          $search = Get-Content source/FishingAutomation/dungeon/ProductionSearchFlow.cs -Raw
          $stages = Get-Content source/FishingAutomation/ProductionStageMachine.cs -Raw
          $bulkEngine = Get-Content source/FishingAutomation/LifeSkillBulkGatheringAutomation.cs -Raw
          $mapping = Get-Content source/FishingAutomation/LivingSkillGatheringCatalog.cs -Raw
          $resolver = Get-Content source/FishingAutomation/RecursiveAlteringSupplyResolver.cs -Raw
          $zeroWing = Get-Content source/FishingAutomation/ZeroWingScreenGuards.cs -Raw
          $alteringPlan = Get-Content source/FishingAutomation/AlteringPlan.cs -Raw
          $multiGather = Get-Content source/FishingAutomation/MultiGatheringCoordinator.cs -Raw
          $multiAlter = Get-Content source/FishingAutomation/MultiAlteringCoordinator.cs -Raw
          $dependencyScheduler = Get-Content source/FishingAutomation/MultiAlteringDependencyScheduler.cs -Raw
          $laneOwnership = Get-Content source/FishingAutomation/FacilityLaneState.cs -Raw
          $consumptionLedger = Get-Content source/FishingAutomation/MultiAlteringConsumptionLedger.cs -Raw
          $multiAlterMain = Get-Content source/FishingAutomation/MainForm.MultiAltering.cs -Raw
          $productionPage = Get-Content source/FishingAutomation/MainForm.ProductionPage.cs -Raw
          $lifeLayout = Get-Content source/FishingAutomation/LifeSkillListLayout.cs -Raw

          if($crafting -notmatch 'CraftingAutomation'){throw 'crafting automation wiring missing'}
          if($multiAlter -notmatch 'Func<AlteringPlan, int, CancellationToken, Task<bool>>' -or
             $multiAlter -notmatch 'facilityWorks\.All\(x => x\.IsCompleted\)' -or
             $multiAlter -notmatch '배치 전체 완료 전 이동 없음') { throw 'multi-altering must use whole-facility batch scheduling' }
          if($multiAlter -match 'TapFresh|ClickFresh|DragFresh|SendInput|InterceptionInput|ProductionUiRuntime') { throw 'multi-altering coordinator must never own direct input' }
          # M2 wait: per-facility progress evidence must survive each
          # one-slot batch return. A stagnant lane stops without extra input,
          # even while other facilities continue legitimately progressing.
          $alterTests = Get-Content tests/altering/Program.cs -Raw
          $watchCore = [regex]::Match(
              $multiAlter,
              'internal sealed class MultiAlteringWaitWatchdog[\s\S]*?(?=\r?\ninternal sealed class MultiAlteringCoordinator)').Value
          if ([string]::IsNullOrWhiteSpace($watchCore) -or
