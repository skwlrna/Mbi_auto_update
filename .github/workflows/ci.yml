name: Check V0.1.82 Read-only CLI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        shell: pwsh
        run: |
          dotnet restore source/FishingAutomation/FishingAutomation.csproj -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'dotnet step failed' }
          dotnet restore source/MacroWatchdog/MacroWatchdog.csproj -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'dotnet step failed' }
          dotnet restore changes/tests/stability/Regression.csproj
          if ($LASTEXITCODE -ne 0) { throw 'dotnet step failed' }
      - name: Build
        shell: pwsh
        run: |
          dotnet build source/FishingAutomation/FishingAutomation.csproj -c Release -r win-x64 --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'dotnet step failed' }
          dotnet build source/MacroWatchdog/MacroWatchdog.csproj -c Release -r win-x64 --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'dotnet step failed' }
      - name: Stability regression tests
        shell: pwsh
        run: dotnet run --project changes/tests/stability/Regression.csproj -c Release --no-restore
      - name: Verify migration constants
        shell: pwsh
        run: |
          $u = Get-Content source/FishingAutomation/UpdateManager.cs -Raw
          if ($u -notmatch 'CurrentVersion = "V0\.1\.82"') { throw 'version constant mismatch' }
          if ($u -notmatch 'RepositoryOwner = "skwlrna"') { throw 'repository owner mismatch' }
          $p = Get-Content source/FishingAutomation/FishingAutomation.csproj -Raw
          if ($p -notmatch '<Version>0\.1\.82</Version>') { throw 'project version mismatch' }

      - name: Loot and retry regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/loot-retry/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Loot/retry regressions failed' }
          dotnet run --project tests/retry-flow/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Retry flow regressions failed' }
          $retry = Get-Content source/FishingAutomation/dungeon/ScenarioEngine.AbyssRetry.cs -Raw
          if ($retry -match 'DetectAbyssOutsideWorkflowAsync') { throw 'retry transition must not use outside HUD detector' }
          $outside = Get-Content source/FishingAutomation/dungeon/ScenarioEngine.cs -Raw
          if ($outside -notmatch 'exitConfirmed') { throw 'outside detection exit gate missing' }

      - name: Maintenance safety checks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Test-Path source/tools/RollbackPrevious.ps1)){throw 'RollbackPrevious.ps1 missing'}
          if(-not (Test-Path source/ROLLBACK_PREVIOUS.cmd)){throw 'ROLLBACK_PREVIOUS.cmd missing'}
          [ScriptBlock]::Create((Get-Content source/tools/ApplyUpdate.ps1 -Raw)) | Out-Null
          [ScriptBlock]::Create((Get-Content source/tools/RollbackPrevious.ps1 -Raw)) | Out-Null
          $u=Get-Content source/tools/ApplyUpdate.ps1 -Raw
          if($u -notmatch '\.previous_version'){throw 'previous-version retention missing'}
          $f=Get-Content source/FishingAutomation/FishingBot.cs -Raw
          if($f -notmatch 'MaxDebugBytes = 100L \* 1024 \* 1024'){throw 'fishing debug cap missing'}

      - name: Read-only CLI regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/cli-readonly/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'CLI regressions failed' }
