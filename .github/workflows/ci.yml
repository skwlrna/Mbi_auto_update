          if($multiGather -match 'TapFresh|ClickFresh|DragFresh|SendInput|InterceptionInput') { throw 'multi-gather coordinator must never own direct input' }
          if($lifeLayout -notmatch 'SafeDragStart = new\(580, 760\)' -or
             $lifeLayout -notmatch 'SafeDragEnd = new\(580, 350\)') { throw 'safe modal-internal drag coordinates missing' }
          if($craftScreen -notmatch '퀘스트 만들기' -or $craftScreen -notmatch '제작 완료'){throw 'quest-driven crafting flow missing'}

          foreach($screen in @($craftScreen,$gatherScreen,$bulkScreen,$alterScreen)){
