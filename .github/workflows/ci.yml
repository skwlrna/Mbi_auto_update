              $alterTests -notmatch 'M2 wait: stalled wood lane stops after 60s despite progressing metal lane') {
              throw 'M2 long batch-wait watchdog missing per-facility safety and regression coverage'
          }
          if($multiAlter -notmatch '같은 시설 여러 품목은 라운드로빈 혼합' -or
             $multiAlter -notmatch 'runBatch\(plan, 1, ct\)') { throw 'same-facility round-robin slot mixing missing' }
          $session = Get-Content source/FishingAutomation/AlteringSession.cs -Raw
          $status = Get-Content source/FishingAutomation/AlteringStatus.cs -Raw
          if($session -notmatch 'MultiPlanPath' -or
             $session -notmatch 'SHA256.HashData' -or
             $session -notmatch 'IsLegacyMultiPath') { throw 'stable per-plan multi-altering session key missing' }
          if($alteringPlan -notmatch 'AlteringEtaEstimator' -or
             $status -notmatch '남은시간\(예상\)') { throw 'full-plan altering ETA status missing' }
          if($multiAlterMain -notmatch 'RunBatchAsync\(' -or
             $multiAlterMain -notmatch 'slotBudget' -or
             $multiAlterMain -notmatch '시설별 최대 7칸 혼합 병렬 운용' -or
             $multiAlterMain -match 'StartAlteringAsync\(plan, batchChild: true\)') { throw 'multi-altering runtime must use batch-yield engine instead of full sequential child runs' }
          if($multiAlterMain -notmatch 'new MultiAlteringDependencyScheduler' -or
