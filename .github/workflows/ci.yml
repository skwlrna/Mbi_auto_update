name: Check V3 Production Engine

on:
  push:
    branches: [ main, fix/n02-multi-altering-resume, fix/f05-durable-consumption-journal ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        shell: pwsh
        run: |
          dotnet restore source/FishingAutomation/FishingAutomation.csproj -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'dotnet step failed' }
          dotnet restore source/MacroWatchdog/MacroWatchdog.csproj -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'dotnet step failed' }
          dotnet restore changes/tests/stability/Regression.csproj
          if ($LASTEXITCODE -ne 0) { throw 'dotnet step failed' }
      - name: Build
        shell: pwsh
        run: |
          dotnet build source/FishingAutomation/FishingAutomation.csproj -c Release -r win-x64 --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'dotnet step failed' }
          dotnet build source/MacroWatchdog/MacroWatchdog.csproj -c Release -r win-x64 --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'dotnet step failed' }
      - name: Stability regression tests
        shell: pwsh
        run: dotnet run --project changes/tests/stability/Regression.csproj -c Release --no-restore

      - name: N02 deterministic batch persistence regressions
        shell: pwsh
        run: |
          dotnet run --project tests/n02-resume/Regression.csproj -c Release -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'N02 batch persistence regressions failed' }

      - name: F05 deterministic durable consumption journal regressions
        shell: pwsh
        run: |
          dotnet run --project tests/f05-consumption/Regression.csproj -c Release -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'F05 durable consumption regressions failed' }

      - name: N03 deterministic input cancellation regressions
        shell: pwsh
        run: |
          dotnet run --project tests/n03-input/Regression.csproj -c Release -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'N03 input cancellation regressions failed' }

      - name: Stable production behavior lock
        shell: pwsh
        run: ./tests/stability/ProductionBehaviorBaseline.ps1

      - name: Verify migration constants
        shell: pwsh
        run: |
          $u = Get-Content source/FishingAutomation/UpdateManager.cs -Raw
          if ($u -notmatch 'CurrentVersion = "V3\.1\.76"') { throw 'version constant mismatch' }
          if ($u -notmatch 'RepositoryOwner = "skwlrna"') { throw 'repository owner mismatch' }
          $p = Get-Content source/FishingAutomation/FishingAutomation.csproj -Raw
          if ($p -notmatch '<Version>3\.1\.76</Version>') { throw 'project version mismatch' }
          $release = Get-Content .github/workflows/release-v3176-auto-update.yml -Raw
          if (-not $release.Contains('CurrentVersion = "V3\.1\.76"')) {
            throw 'release workflow eligibility version mismatch'
          }

      - name: Updater rollback regression tests
        shell: pwsh
        run: ./changes/tests/stability/Updater.Tests.ps1 -Updater ./source/tools/ApplyUpdate.ps1

      - name: Loot and retry regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/loot-retry/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Loot/retry regressions failed' }
          dotnet run --project tests/retry-flow/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Retry flow regressions failed' }
          $retry = Get-Content source/FishingAutomation/dungeon/ScenarioEngine.AbyssRetry.cs -Raw
          if ($retry -match 'DetectAbyssOutsideWorkflowAsync') { throw 'retry transition must not use outside HUD detector' }
          $outside = Get-Content source/FishingAutomation/dungeon/ScenarioEngine.cs -Raw
          if ($outside -notmatch 'exitConfirmed') { throw 'outside detection exit gate missing' }

      - name: Maintenance safety checks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Test-Path source/tools/RollbackPrevious.ps1)){throw 'RollbackPrevious.ps1 missing'}
          if(-not (Test-Path source/ROLLBACK_PREVIOUS.cmd)){throw 'ROLLBACK_PREVIOUS.cmd missing'}
          [ScriptBlock]::Create((Get-Content source/tools/ApplyUpdate.ps1 -Raw)) | Out-Null
          [ScriptBlock]::Create((Get-Content source/tools/RollbackPrevious.ps1 -Raw)) | Out-Null
          $u=Get-Content source/tools/ApplyUpdate.ps1 -Raw
          if($u -notmatch '\.previous_version'){throw 'previous-version retention missing'}
          $f=Get-Content source/FishingAutomation/FishingBot.cs -Raw
          if($f -notmatch 'MaxDebugBytes = 100L \* 1024 \* 1024'){throw 'fishing debug cap missing'}

      - name: Read-only CLI regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/cli-readonly/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'CLI regressions failed' }

      - name: Read-only CLI and free screen wiring checks
        shell: pwsh
        run: |
          $cli = Get-Content source/FishingAutomation/MabinogiMobileCli.cs -Raw
          if($cli -notmatch 'private static bool IsAllowedAction\(string command\)[\s\S]*?=> false;'){throw 'CLI actions are not fully blocked'}
          $appLog = Get-Content source/FishingAutomation/AppLog.cs -Raw
          if($appLog -notmatch 'WriteBackground' -or $appLog -notmatch 'publishToScreen'){throw 'file-only background logging path missing'}
          if($cli -notmatch 'backgroundOnly = result\.Success' -or $cli -notmatch 'WriteBackground\(line\)'){throw 'successful CLI polling is not hidden from screen'}
          if($cli -notmatch 'result\.Command is not \("status" or "capabilities"\)'){throw 'startup CLI status/capabilities must remain visible'}
          foreach($command in @('capabilities','get_my_info','get_currencies','get_items','get_activity','get_alterable_items','get_altering_works','get_gatherable_items','get_craftable_items','get_inventory')){
            if($cli -notmatch $command){throw "missing CLI read-only query: $command"}
          }
          $g = Get-Content source/FishingAutomation/MainForm.Gathering.cs -Raw
          if($g -notmatch 'new InventoryBulkGatheringScreen\('){throw 'gathering is not wired to zero-wing bulk navigation'}
          if($g -match 'new GatheringCliScreen\('){throw 'gathering still wires paid CLI action screen'}
          $a = Get-Content source/FishingAutomation/MainForm.Altering.cs -Raw
          if($a -notmatch 'new AlteringScreen\('){throw 'altering is not wired to free screen navigation'}
          if($a -notmatch 'new InventoryBulkGatheringScreen\('){throw 'altering material resolver is not wired to life-skill bulk gathering'}
          if($a -match 'new AlteringCliScreen\('){throw 'altering still wires paid CLI action screen'}
          foreach($file in @($g,$a)){
            if($file -match '"execute_gathering"' -or $file -match '"execute_altering"' -or $file -match '"complete_altering_work"' -or $file -match '"stop_action"'){
              throw 'production main flow still requires CLI action commands'
            }
          }
          $guards = Get-Content source/FishingAutomation/CliAutomationGuards.cs -Raw
          if($guards -notmatch 'EnsureCapabilitiesAsync'){throw 'capability preflight missing'}
          if($guards -notmatch 'CliIdentityGuard'){throw 'identity guard missing'}
          if($guards -notmatch 'CurrencyChanges'){throw 'currency delta tracking missing'}
          if($g -notmatch 'CliIdentityGuard.CaptureAsync' -or $a -notmatch 'CliIdentityGuard.CaptureAsync'){throw 'mode identity capture wiring missing'}

      - name: Zero Spirit Wings safety checks
        shell: pwsh
        run: |
          $plan = Get-Content source/FishingAutomation/AlteringPlan.cs -Raw
          if($plan -notmatch 'MaximumWings => 0'){throw 'zero-wing invariant missing from AlteringPlan'}
          if($plan -notmatch 'if \(AllowPaidButton\)'){throw 'paid altering plan rejection missing'}
          $screen = Get-Content source/FishingAutomation/dungeon/AlteringScreen.cs -Raw
          if($screen -notmatch '"가공하기"'){throw 'free on-site process button missing'}
          if($screen -notmatch '"가공하러 가기"'){throw 'remote paid button observation gate missing'}
          if($screen -notmatch '"설비로 이동"'){throw 'free facility travel path missing'}
          if($screen -match 'reserveFiveWings\(\)'){throw 'screen still reserves Spirit Wings'}
          if($screen -match 'FindAsync\([^\r\n]*RecipeActionButton[^\r\n]*"5"'){throw 'fixed wing-cost number returned to production screen logic'}
          if($screen -notmatch 'plan\.OutputName'){throw 'qualified recipe detail-title fallback missing'}
          $wingGuard = Get-Content source/FishingAutomation/ZeroWingScreenGuards.cs -Raw
          if($wingGuard -notmatch 'after < before'){throw 'Spirit Wings decrease guard missing'}
          if($wingGuard -notmatch 'actionFailure' -or $wingGuard -notmatch 'verificationFailure'){throw 'post-failure Spirit Wings verification missing'}
          if($wingGuard -notmatch 'VerifyWithLoadingRetryAsync' -or $wingGuard -notmatch 'CurrencySnapshotWithLoadingRetryAsync'){throw 'post-loading wing verification retry missing'}
          if($wingGuard -notmatch 'TimeSpan.FromSeconds\(20\)'){throw 'post-loading wing verification retry window missing'}
          if($wingGuard -notmatch 'ZeroWingAlteringScreen' -or $wingGuard -notmatch 'ZeroWingGatheringScreen' -or $wingGuard -notmatch 'ZeroWingCraftingScreen'){throw 'screen wing guards missing'}
          $settings = Get-Content source/FishingAutomation/AlteringSettingsDialog.cs -Raw
          if($settings -match 'Checked = true' -and $settings -match '정령의 날개'){throw 'paid Spirit Wings option remains enabled'}
          $production = Get-Content source/FishingAutomation/MainForm.ProductionPage.cs -Raw
          if($production -match 'ProducedPerWork, true'){throw 'production UI still authorizes paid altering'}
          if($production -notmatch 'MissingIngredients\.Count > 0'){throw 'concrete missing ingredient startup gate missing'}
          $project = Get-Content source/FishingAutomation/FishingAutomation.csproj -Raw
          if($project -notmatch 'interception\.dll[^>]*CopyToPublishDirectory="PreserveNewest"'){throw 'interception.dll publish copy missing'}

      - name: Test publish contains Interception
        shell: pwsh
        run: |
          dotnet publish source/FishingAutomation/FishingAutomation.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -o artifacts/ci-test-publish
          if ($LASTEXITCODE -ne 0) { throw 'test publish failed' }
          if (-not (Test-Path artifacts/ci-test-publish/FishingAutomation.exe)) { throw 'published exe missing' }
          if (-not (Test-Path artifacts/ci-test-publish/interception.dll)) { throw 'published interception.dll missing' }

      - name: Unified production UI checks
        shell: pwsh
        run: |
          $state = Get-Content source/FishingAutomation/MainForm.ProductionUI.cs -Raw
          if($state -match 'class ProductionDashboard'){throw 'separate production overlay must stay removed'}
          $layout = Get-Content source/FishingAutomation/MainForm.ReferenceUI.cs -Raw
          if($layout -match 'new ProductionDashboard\(this\)'){throw 'separate production dashboard is still attached'}
          foreach($text in @('자동 가공','자동 채집','제작','작업 대상','진행 수량')){
            if($layout -notmatch [regex]::Escape($text)){throw "unified UI text missing: $text"}
          }
          if($layout -notmatch 'AddButton\("자동 가공",[\s\S]*?SelectMode\(4\)'){throw 'home to automatic altering one-click route missing'}
          if($layout -notmatch 'AddButton\("자동 채집",[\s\S]*?SelectMode\(5\)'){throw 'home to automatic gathering one-click route missing'}
          if($layout -notmatch 'AddButton\("제작",[\s\S]*?SelectMode\(6\)'){throw 'home to crafting one-click route missing'}
          if($layout -match '자동채집'){throw 'automatic gathering spacing is inconsistent in reference UI'}
          $main = Get-Content source/FishingAutomation/MainForm.cs -Raw
          if($main -notmatch 'DisplayModeName'){throw 'display mode normalization missing'}
          if($main -notmatch 'mode is "가공" or "채집" or "제작"'){throw 'production statistics branch missing'}
          $dashboard = Get-Content source/FishingAutomation/MainForm.Dashboard.cs -Raw
          if($dashboard -notmatch '자동 가공 설정 / 시작'){throw 'altering action caption missing'}
          if($dashboard -notmatch '자동 채집 설정 / 시작'){throw 'gathering action caption missing'}
          if($dashboard -notmatch '제작 설정 / 시작'){throw 'crafting action caption missing'}
          $craftPage = Get-Content source/FishingAutomation/MainForm.CraftingPage.cs -Raw
          if($craftPage -match '제작 분류 탭|제작 아이템|제작 음식|BuildCategoryTabs|SetCategory'){throw 'crafting item/food category tabs must stay removed'}
          if($craftPage -notmatch '전체 제작 품목을 한 목록에서 검색'){throw 'crafting search-only guidance missing'}
          if($craftPage -notmatch 'var visible = _choices'){throw 'crafting search must filter the full catalog'}

      - name: Inventory loot regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/inventory-loot/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Inventory loot regressions failed' }


      # L2 exercises compiled production AlteringScreen methods, not only FakeWorld.
      - name: Real altering screen authority regressions (L2)
        shell: pwsh
        run: |
          dotnet run --project tests/altering-screen-integration/Regression.csproj -c Release -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'L2 real AlteringScreen regressions failed' }

      - name: Automatic altering regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/altering/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Altering regressions failed' }
          dotnet build tests/altering-visual/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Altering visual harness build failed' }
          $screen = Get-Content source/FishingAutomation/dungeon/AlteringScreen.cs -Raw
          if ($screen -notmatch 'HasCollectButtonVisual') { throw 'visual collect-button detector missing' }
          if ($screen -notmatch 'GetAlteringWorksAsync' -or $screen -notmatch 'IsCompleted') { throw 'collect must require a completed CLI work' }
          if ($screen -notmatch 'CollectVisualButton') { throw 'tight visual collect ROI missing' }
          if ($screen -match 'FindAsync\([^\r\n]*CollectButton[^\r\n]*"모두 받기"' -or $screen -match 'FindCompactLabelAsync\([^\r\n]*CollectButton[^\r\n]*"모두 받기"') { throw 'collect must not depend on 모두 받기 OCR' }
          if ($screen -match 'FindAsync\([^\r\n]*"Space"') { throw 'collect must not depend on tiny Space OCR' }
          if ($screen -notmatch '설비 도착 후 현장 가공 버튼 화면 확인') { throw 'on-site visual processing confirmation log missing' }
          if ($screen -notmatch 'TryFindFreeProcessButtonVisual' -or $screen -notmatch 'FreeProcessVisualButton') { throw 'visual on-site process detector missing' }
          if ($screen -notmatch 'actionPixels \* 100 < sampled \* 8' -or $screen -notmatch 'width < 300' -or $screen -notmatch 'height < 28') { throw 'wide green process-button shape gate missing' }
          if ($screen -notmatch 'IsRecipeDetailStructureAsync') { throw 'post-click structural recipe detail check missing' }
          if ($screen -match 'IsRecipeDetailAsync\(popup, plan, ct\)' -or
              $screen -match 'IsRecipeDetailAsync\(frame, plan, ct\)') { throw 'post-click recipe-name OCR reconfirmation must stay removed' }
          $selectRecipe = [regex]::Match($screen, 'private async Task SelectRecipeAsync[\s\S]*?(?=\r?\n    public async Task QueueAsync)').Value
          if ($selectRecipe -match 'DragClientPoint') { throw 'altering recipe selection must not drag the fixed UI' }
          if ($selectRecipe -notmatch 'attempt <= 4') { throw 'fixed-position recipe OCR retry missing' }
          if ($selectRecipe -notmatch 'RecipeCacheKey' -or $selectRecipe -notmatch '_cachedRecipeCenter') { throw 'confirmed recipe-coordinate reuse missing' }
          if ($selectRecipe -notmatch '고정 품목 좌표 재사용' -or $selectRecipe -notmatch '고정 품목 좌표 저장') { throw 'recipe coordinate cache diagnostics missing' }
          if ($selectRecipe -match 'DragClientPoint') { throw 'cached recipe path must never drag the UI' }
          $fixedLayout = Get-Content source/FishingAutomation/AlteringRecipeLayout.cs -Raw
          foreach($point in @(
            '"물에 불린 쌀".*new\(340, 724\)',
            '"목재\+".*new\(340, 412\)',
            '"강철괴".*new\(461, 412\)',
            '"가죽\+".*new\(340, 412\)',
            '"옷감\+".*new\(461, 412\)'
          )){
            if($fixedLayout -notmatch $point){throw "user-confirmed processing fixed coordinate missing: $point"}
          }
          if($fixedLayout -notmatch '"최상급 목재", 2\).*new\(340, 756\)'){throw 'duplicate wood recipe ordinal coordinate missing'}
          # Food crafting owns search geometry; medicine must share ALL seven values.
          foreach($part in @(
            'ProcessingSearchIconPoint = CraftingHubLayout\.ProductSearchIconPoint',
            'ProcessingSearchDialogArea = CraftingHubLayout\.ProductSearchDialogArea',
            'ProcessingSearchInputPoint = CraftingHubLayout\.ProductSearchInputPoint',
            'ProcessingSearchResultArea = CraftingHubLayout\.ProductSearchResultArea',
            'ProcessingSearchFirstResultPoint = CraftingHubLayout\.ProductFirstResultPoint',
            'ProcessingSearchOpenChangeRatio = CraftingHubLayout\.SearchDialogOpenChangeRatio',
            'ProcessingSearchResultChangeRatio = CraftingHubLayout\.SearchResultChangeRatio'
          )){
            if($fixedLayout -notmatch $part){throw "medicine search diverged from food crafting: $part"}
          }
          if($selectRecipe -notmatch 'TrySelectFixedRecipeAsync' -or
             $selectRecipe -notmatch 'TrySelectMedicineRecipeBySearchAsync'){throw 'fixed processing / medicine search routes missing'}
          $fixedSelect = [regex]::Match($screen, 'private async Task<bool> TrySelectFixedRecipeAsync[\s\S]*?(?=\r?\n    private async Task<bool> TrySelectMedicineRecipeBySearchAsync)').Value
          $medicineSelect = [regex]::Match($screen, 'private async Task<bool> TrySelectMedicineRecipeBySearchAsync[\s\S]*?(?=\r?\n    private async Task SelectRecipeAsync)').Value
          if($fixedSelect -notmatch 'HasFacilityMoveButtonVisual' -or
             $fixedSelect -notmatch '설비로 이동 버튼이 남아 있어 원격 화면으로 판정'){throw 'fixed recipe remote-screen veto missing'}
          $fixedRetry = Get-Content source/FishingAutomation/AlteringFixedRecipeRetryPolicy.cs -Raw
          if($fixedSelect -notmatch 'Task\.Delay\(300, ct\)' -or
             $fixedSelect -notmatch '상세 전환 지연 확인 · 추가 클릭 없이 계속' -or
             $fixedSelect -notmatch 'AlteringFixedRecipeRetryPolicy\.ShouldRetry' -or
             $fixedSelect -notmatch '동일 좌표 재클릭 1/1' -or
             $fixedSelect -notmatch '재클릭 1/1 성공 · 추가 재시도 없음' -or
             [regex]::Matches($fixedSelect, '_ui\.ClickFresh\(center, ct\)').Count -ne 2){throw 'bounded fixed recipe click retry missing'}
          if($fixedRetry -notmatch '!detailVisible' -or
             $fixedRetry -notmatch 'facilityVisible' -or
             $fixedRetry -notmatch '!moveButtonVisible' -or
             $fixedRetry -notmatch '!retryAlreadyUsed'){throw 'fixed recipe retry safety policy missing'}
          if($medicineSelect -notmatch 'bool exactUnique = exact.Count == 1' -or
              $medicineSelect -notmatch 'if \(!exactUnique &&' -or
              $medicineSelect -notmatch 'ProcessingSearchResultChangeRatio' -or
              $medicineSelect -match 'IsNearMedicineFirstResult|exact.Count != 1' -or
              $medicineSelect -notmatch 'await Task.Delay\(550, ct\)' -or
              $medicineSelect -notmatch 'ProcessingSearchFirstResultPoint'){
              throw 'medicine search must match food: OCR advisory, ROI transition, first-row click and 550ms settle'
          }
          if($medicineSelect -notmatch 'HasFacilityMoveButtonVisual' -or
             $medicineSelect -notmatch '설비로 이동 버튼이 남아 있어 원격 화면으로 판정' -or
             $medicineSelect -notmatch '검색 입력을 차단'){throw 'medicine remote-screen veto missing'}
          # H1: explicit coordinator directives must survive through every
          # recipe route, including the first-click retry; Automatic remains strict.
          $alteringPlan = Get-Content source/FishingAutomation/AlteringPlan.cs -Raw
          if($alteringPlan -notmatch 'class AlteringFacilityEntryPolicy' -or
             $alteringPlan -notmatch 'directive == AlteringFacilityEntryDirective.Automatic' -or
             $alteringPlan -notmatch 'moveButtonVisible'){throw 'H1 centralized recipe move-visual policy missing'}
          if($fixedSelect -notmatch 'AlteringFacilityEntryDirective directive' -or
             $fixedSelect -notmatch 'AlteringFacilityEntryPolicy.ShouldVetoRecipeMoveButton' -or
             $fixedSelect -notmatch 'directive, HasFacilityMoveButtonVisual\(retryGate\)' -or
             $medicineSelect -notmatch 'AlteringFacilityEntryDirective directive' -or
             $medicineSelect -notmatch 'AlteringFacilityEntryPolicy.ShouldVetoRecipeMoveButton' -or
             $selectRecipe -notmatch 'TrySelectFixedRecipeAsync\(plan, directive, ct\)' -or
             $selectRecipe -notmatch 'TrySelectMedicineRecipeBySearchAsync\(plan, directive, ct\)' -or
             $selectRecipe -notmatch 'AlteringFacilityEntryPolicy.ShouldVetoRecipeMoveButton' -or
             $screen -notmatch 'await SelectRecipeAsync\(plan, directive, ct\)') {throw 'H1 manager directive not preserved through fixed/medicine/cached/retry recipe paths'}
          if($fixedSelect -match 'if\s*\(HasFacilityMoveButtonVisual\(' -or
             $medicineSelect -match 'if\s*\(HasFacilityMoveButtonVisual\(' -or
             $selectRecipe -match 'if\s*\(HasFacilityMoveButtonVisual\('){throw 'H1 raw move-button veto bypassed manager directive'}
          $facilityLayout = Get-Content source/FishingAutomation/AlteringFacilityLayout.cs -Raw
          if($facilityLayout -notmatch 'MoveButtonVisualArea = new\(15, 205, 155, 65\)' -or
             $facilityLayout -notmatch 'MoveButtonPoint = new\(85, 235\)' -or
             $facilityLayout -notmatch 'MoveButtonAnchorArea = new\(35, 218, 100, 34\)'){throw 'fixed facility move shape/anchor geometry missing'}
          if($facilityLayout -notmatch 'OnsiteCloseVisualArea = new\(744, 42, 44, 44\)' -or
             $facilityLayout -notmatch 'moveShapeVisible && moveAnchorVisible'){throw 'fixed-anchor move authority policy missing'}
          if($screen -notmatch 'HasOnsiteCloseButtonVisual' -or
             $screen -notmatch 'anchorTeal \* 100 >= anchorSampled \* 18' -or
             $screen -notmatch 'moveAnchorVisible: moveAnchor' -or
             $screen -notmatch 'ShouldAcceptMoveButton'){throw 'broad-shape plus fixed-anchor move detector missing'}
          if($screen -notmatch '고정 이동버튼 전체형태\+중심앵커 부재 2회 확인'){throw 'on-site reuse fixed-anchor diagnostic missing'}
          if($screen -notmatch 'HasFacilityMoveButtonVisual' -or
             $screen -notmatch '품목 선택보다 설비 이동 1회 우선' -or
             $screen -notmatch '설비 도착 · 이제'){throw 'facility-first processing route missing'}
          if($screen -match 'FindAsync\([^\r\n]*FacilityMoveButton[^\r\n]*"설비로 이동"'){throw 'small facility move label OCR returned to processing flow'}
          if($screen -notmatch 'teal \* 100 < sampled \* 5' -or
             $screen -notmatch 'width >= 90 && height >= 18'){throw 'facility move teal-shape detector missing'}
          if($screen -notmatch '설비로 이동 고정좌표 클릭' -or
             $screen -notmatch 'HasFacilityMoveButtonPositiveEvidenceAsync' -or
             $screen -notmatch '첫 입력 1회 · 픽셀 동일할 때만 추가 1회 가능 · 품목 선택 전 실행' -or
             $screen -notmatch 'ShouldRetryUnchangedFixedMove' -or
             $screen -notmatch 'MeasureVisualChangeRatio'){throw 'fixed move pixel confirmation and bounded retry missing'}
          if ($screen -match 'ConfirmFacilityTravelAsync') { throw 'facility travel must not use the obsolete Space confirmation flow' }
          $queue = [regex]::Match($screen, 'public async Task QueueAsync[\s\S]*?(?=\r?\n    private async Task RecoverRemoteDetailToOnsiteAsync)').Value
          $remoteRecovery = [regex]::Match($screen, 'private async Task RecoverRemoteDetailToOnsiteAsync[\s\S]*?(?=\r?\n    private static bool HasBottomConfirmationModal)').Value
          $travelIndex = $queue.IndexOf('await TravelToFacilityAsync')
          $selectIndex = $queue.IndexOf('await SelectRecipeAsync')
          if ($travelIndex -lt 0 -or $selectIndex -lt 0 -or $travelIndex -gt $selectIndex) { throw 'facility travel must happen before recipe selection' }
          $coordinatorReuse = [regex]::Match(
              $queue,
              'if \(directive == AlteringFacilityEntryDirective\.ReuseCoordinatorConfirmedOnsite\)[\s\S]*?(?=\r?\n        else if \(directive == AlteringFacilityEntryDirective\.FreshMoveRequired\))').Value
          if ([string]::IsNullOrWhiteSpace($coordinatorReuse) -or
              $coordinatorReuse -match 'TravelToFacilityAsync|TryReuseOnsiteFacilityAsync|HasFacilityMoveButtonVisual') { throw 'coordinator-confirmed onsite reuse must not re-decide or re-run facility travel' }
          if ([regex]::Matches($queue, 'await TravelToFacilityAsync').Count -ne 2) { throw 'queue must keep one fresh-directive move path plus one legacy automatic fallback path' }
          if ($queue -notmatch 'TravelToFacilityAsync\(plan, ct, forceMoveClick: true\)') { throw 'fresh facility registration must force one move before recipe selection' }
          if ($queue -notmatch '새 시설 첫 등록' -or
