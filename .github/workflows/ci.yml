          if($stages -notmatch 'enum ProductionStage' -or
             $stages -notmatch 'class ProductionStageMachine'){throw 'explicit V3 production state machine missing'}
          foreach($screen in @($craftScreen,$gatherScreen,$bulkScreen,$alterScreen)){
            if($screen -notmatch 'ProductionStageMachine'){throw 'production screen is not state-tracked'}
          }

          if($bulkScreen -notmatch '생활 스킬 100회 우선' -or $bulkScreen -notmatch '가까운 위치 찾기'){throw 'life-skill 100-action primary route missing'}
          $bulkStart = [regex]::Match($bulkScreen, 'public async Task StartAsync[\s\S]*?(?=\r?\n    private static bool CanUseInventoryFallback)').Value
          if([string]::IsNullOrWhiteSpace($bulkStart)){throw 'bulk gathering StartAsync block missing'}
          if($bulkStart -match 'InventoryBulkGatheringAutomation|StartInventoryHundredQuestAsync|_fallback\.StartAsync'){throw 'bulk gathering must not fall back to inventory/material-detail acquisition'}
          if($bulkStart -notmatch '가방/재료상세 경로로 우회하지 않음'){throw 'life-skill-only failure trace missing'}
          if($bulkScreen -notmatch '프로필 열기 · C 입력' -or
             $bulkScreen -notmatch 'ProfileLifeSkillPoint = new\(400, 944\)' -or
             $bulkScreen -notmatch '생활 스킬 고정좌표 클릭' -or
             $bulkScreen -notmatch '생활 스킬 화면 진입 확인 · 상단 제목 2프레임 안정'){throw 'fixed life-skill profile navigation missing'}
          if($bulkScreen -notmatch 'WaitForProfileOpenAsync' -or
             $bulkScreen -notmatch 'LifeSkillProfilePolicy\.MayRetryToggle' -or
             $bulkScreen -notmatch 'C 추가 입력 없음' -or
             $bulkScreen -notmatch '토글키 C를 다시 누르지 않고 안전하게 정지'){throw 'safe profile-toggle recovery missing'}
          if($bulkScreen -match 'attempt <= 3'){throw 'profile recognition must not blindly toggle C three times'}
          foreach($fixedCategory in @(
            '"일상 채집" => new Point\(222, 206\)',
            '"나무 베기" => new Point\(341, 206\)',
            '"광석 캐기" => new Point\(460, 206\)',
            '"약초 채집" => new Point\(578, 206\)',
            '"양털 깎기" => new Point\(222, 383\)',
            '"추수" => new Point\(341, 383\)',
            '"호미질" => new Point\(460, 383\)'
          )){
            if($bulkScreen -notmatch $fixedCategory){throw "life-skill fixed category coordinate missing: $fixedCategory"}
          }
          $lifeSkillStart = [regex]::Match($bulkScreen, 'private async Task StartLifeSkillHundredAsync[\s\S]*?(?=\r?\n    private async Task<DetectionResult\?> FindStableLifeSkillRowAsync)').Value
          if([string]::IsNullOrWhiteSpace($lifeSkillStart)){throw 'life-skill start block missing'}
          if($lifeSkillStart -match 'ClickExactAsync\(\s*"생활 스킬"' -or
             $lifeSkillStart -match 'ClickExactAsync\(\s*source\.Category'){throw 'life-skill/profile category navigation must use fixed coordinates, not OCR clicks'}
          if($lifeSkillStart -notmatch '_ui\.ClickFresh\(ProfileLifeSkillPoint, ct\)' -or
             $lifeSkillStart -notmatch '_ui\.ClickFresh\(categoryPoint, ct\)'){throw 'fixed life-skill/category clicks missing'}
          if($bulkScreen -match 'LifeSkillNearestLocationPoint'){throw 'obsolete fixed nearest-location coordinate returned'}
          if($bulkScreen -notmatch 'LifeSkillNearestHelpTemplate' -or
             $bulkScreen -notmatch 'life_skill_nearest_help\.png' -or
             $bulkScreen -notmatch 'ClickLifeSkillNearestLocationAsync'){throw 'life-skill nearest-location help-icon template path missing'}
          if(-not (Test-Path source/FishingAutomation/dungeon/templates/life_skill_nearest_help.png)){throw 'life-skill nearest-location help-icon template file missing'}
          if($lifeSkillStart -match 'ClickExactAsync\(\s*"가까운 위치 찾기"' -or
             $lifeSkillStart -match 'FindUniqueAsync\([\s\S]{0,300}"100회 채집"'){throw 'life-skill start must not OCR-click nearest location or search for a visible 100회 control'}
          if($lifeSkillStart -match 'detailTarget' -or
             $lifeSkillStart -match '생활 스킬 상세 팝업을 확인하지 못해'){throw 'life-skill target name must not be OCR-reconfirmed after row selection'}
          if($lifeSkillStart -notmatch '상세 품목명/가까운 위치 문구 OCR 생략'){throw 'life-skill post-click OCR removal trace missing'}
          $nearestPoint = [regex]::Match($bulkScreen, 'private static Point LifeSkillNearestClickPoint[\s\S]*?(?=\r?\n    private async Task ClickLifeSkillNearestLocationAsync)').Value
          if([string]::IsNullOrWhiteSpace($nearestPoint) -or
             $nearestPoint -notmatch 'nominalLeftOffset' -or
             $nearestPoint -notmatch 'clickPoint\.X < 140' -or
             $nearestPoint -notmatch 'clickPoint\.X > 390'){throw 'nearest-location safe offset policy missing'}
          $nearestHelper = [regex]::Match($bulkScreen, 'private async Task ClickLifeSkillNearestLocationAsync[\s\S]*?(?=\r?\n    private async Task<bool> TryRetryLifeSkillNearestLocationAsync)').Value
          if([string]::IsNullOrWhiteSpace($nearestHelper)){throw 'nearest-location help-icon helper missing'}
          if($nearestHelper -match 'FindUniqueAsync|FindCompact|ClickStableExact|FindBrightGlyphMultiScale'){throw 'nearest-location initial helper must delegate final-frame template validation to shared runtime and never depend on OCR'}
          if($nearestHelper -notmatch 'ClickOffsetFromStableBrightTemplateAsync' -or
             $nearestHelper -notmatch 'threshold: 0\.78' -or
             $nearestHelper -notmatch 'LifeSkillNearestClickPoint' -or
             $nearestHelper -notmatch '클릭 직전 재확인'){throw 'nearest-location final-frame validated template/offset guard missing'}
          $nearestRetry = [regex]::Match($bulkScreen, 'private async Task<bool> TryRetryLifeSkillNearestLocationAsync[\s\S]*?(?=\r?\n    private async Task ResolveLifeSkillNearestResultAsync)').Value
          if([string]::IsNullOrWhiteSpace($nearestRetry) -or
             $nearestRetry -notmatch 'FindBrightTemplate' -or
             $nearestRetry -notmatch 'ProductionUiRuntime\.Stable' -or
             $nearestRetry -notmatch '_ui\.ClickFresh' -or
             $nearestRetry -notmatch '상세창 \? 기준이 계속 보일 때만 입력'){throw 'nearest-location ignored-click stable-anchor retry missing'}
          if($runtime -notmatch 'ClickOffsetFromStableBrightTemplateAsync' -or
             $runtime -notmatch 'FindBrightTemplate\(' -or
             $runtime -notmatch '클릭 직전 템플릿 위치가 바뀌었습니다' -or
             $runtime -notmatch '_input\.ClickClientPoint'){throw 'shared final-frame bright-template click guard missing'}

          $nearestResult = [regex]::Match($bulkScreen, 'private async Task ResolveLifeSkillNearestResultAsync[\s\S]*?(?=\r?\n    private async Task<\(bool Confirmed)').Value
          if([string]::IsNullOrWhiteSpace($nearestResult)){throw 'nearest-location direct/recommended routing helper missing'}
          if($nearestResult -notmatch 'IsOwnedLifeSkillActivity\(activity\)' -or
             $nearestResult -notmatch '_navigationVision\.FirstPlaceAsync' -or
             $nearestResult -notmatch '_navigationVision\.HasPlaceListHeaderAsync' -or
             $nearestResult -notmatch 'GatheringNavigationPolicy\.IsStableFirstRow' -or
             $nearestResult -notmatch '가까운 위치 결과=바로 이동형' -or
             $nearestResult -notmatch '가까운 위치 결과=추천 장소형' -or
             $nearestResult -notmatch '가까운 위치 결과=직접 전환형'){throw 'nearest-location direct/recommended/transition split is incomplete'}
          if($nearestResult -notmatch 'poll == 4 \|\| poll == 8' -or
             $nearestResult -notmatch 'retryOffset = retryNumber == 1 \? 56 : 84' -or
             $nearestResult -notmatch 'TryRetryLifeSkillNearestLocationAsync' -or
             $nearestResult -notmatch '상세창 \? 2프레임 소실' -or
             $nearestResult -notmatch '상세창 \? 소실 4초 유지 \+ 추천 장소 헤더 없음'){throw 'nearest-location no-response retry/transition safety guard missing'}
          if($gatherVision -notmatch 'HasPlaceListHeaderAsync' -or
             $gatherVision -notmatch '"구하는 방법"'){throw 'recommendation-list header detector missing'}
          if($bulkScreen -notmatch 'TimeSpan\.FromSeconds\(90\)' -or
             $bulkScreen -notmatch '생활 스킬 이동/채집 상태나 재고 증가를 확인하지 못했습니다'){throw 'direct-transition startup timeout guard missing'}
          $cliRouteIndex = $nearestResult.IndexOf('if (IsOwnedLifeSkillActivity(activity))')
          $placeRouteIndex = $nearestResult.IndexOf('_navigationVision.FirstPlaceAsync')
          if($cliRouteIndex -lt 0 -or $placeRouteIndex -lt 0 -or $cliRouteIndex -gt $placeRouteIndex){throw 'CLI/main-button direct-travel decision must run before recommended-place screen input'}
          if($lifeSkillStart -notmatch 'ResolveLifeSkillNearestResultAsync\(source\.TargetName, ct\)'){throw 'life-skill start does not route nearest-location result'}
          if($lifeSkillStart -notmatch '100회는 행동 횟수이며 획득 수량과 분리'){throw '100-action vs item-count separation trace missing'}

          $craftReturn = [regex]::Match($craftScreen, 'public async Task ReturnToStationAndCraftAsync[\s\S]*?(?=\r?\n    private async Task FinishDirectCraftAsync)').Value
          if([string]::IsNullOrWhiteSpace($craftReturn)){throw 'crafting station-return block missing'}
          if($craftReturn -match 'FindQuestStageAsync|SetCraftCountAsync|CloseOverlayAsync'){throw 'completed quest must not re-find station stage, close quest, or reset count'}
          if($craftReturn -notmatch '제작대 자동 복귀 대기' -or
             $craftReturn -notmatch '추가 퀘스트/ESC/Space 입력 없음' -or
             $craftReturn -notmatch '수량 재설정 없음'){throw 'passive crafting auto-return trace missing'}

          $completionWait = [regex]::Match($craftScreen, 'private async Task WaitForCompletionAsync[\s\S]*?(?=\r?\n    private async Task ClickExactAsync)').Value
          if([string]::IsNullOrWhiteSpace($completionWait)){throw 'crafting completion wait block missing'}
          if($completionWait -match 'inventoryIncreased|sawBusy|busySeen|latestInventory > inventoryBefore'){throw 'crafting completion must never use inventory or busy-state as completion authority'}
          if($completionWait -notmatch 'completionPopupVisible' -or
             $completionWait -notmatch 'freshComplete is null && freshConfirm is null' -or
             $completionWait -notmatch '실제 제작 완료창 확인'){throw 'crafting completion must wait for the real result popup'}
          if($completionWait -notmatch '재고 증가는 완료 판정에 사용하지 않음'){throw 'crafting in-progress inventory trace missing'}

          if($craftEngine -notmatch 'WaitForOutputIncreaseAfterCompletionAsync' -or
             $craftEngine -notmatch '완료 판정은 완료창 기준'){throw 'post-popup inventory validation guard missing'}
          $postPopup = [regex]::Match($craftEngine, 'long beforeCraft = await _data\.ItemCountAsync[\s\S]*?CompletedCrafts \+= batchCrafts;').Value
          if([string]::IsNullOrWhiteSpace($postPopup)){throw 'post-popup crafting validation block missing'}
          $popupIndex = $postPopup.IndexOf('await _screen.ReturnToStationAndCraftAsync')
          $inventoryIndex = $postPopup.IndexOf('WaitForOutputIncreaseAfterCompletionAsync')
          if($popupIndex -lt 0 -or $inventoryIndex -lt 0 -or $popupIndex -gt $inventoryIndex){throw 'inventory threshold must run only after real completion popup handling'}
          if($bulkEngine -match '100개' -or $bulkEngine -notmatch 'after <= before'){throw 'life-skill engine must verify variable inventory gain'}
          foreach($required in @('우물','굵은 나무','먹구름 양','개암 버섯','동 광맥','밀','감자')){
            if($mapping -notmatch [regex]::Escape($required)){throw "life-skill mapping missing: $required"}
          }
          foreach($insect in @('석양 나비','유령 반딧불이','황혼잠자리')){
            if($mapping -notmatch [regex]::Escape($insect)){throw "quest-only insect missing: $insect"}
          }
          if($resolver -notmatch 'IsQuestOnlyMaterial'){throw 'recursive altering must not bulk-gather quest-only insects'}

          if($alteringPlan -notmatch 'interface IAlteringFieldExitScreen'){throw 'altering field-exit contract missing'}
          if($alterScreen -notmatch 'IAlteringFieldExitScreen' -or
             $alterScreen -notmatch 'ExitToFieldAsync' -or
             $alterScreen -notmatch '채집 전 가공 UI 종료 확인 · 일반 필드 2프레임 확인' -or
             $alterScreen -notmatch 'stableFieldFrames >= 2'){throw 'altering UI field-exit implementation missing'}
          $fieldExit = [regex]::Match($alterScreen, 'public async Task ExitToFieldAsync[\s\S]*?(?=\r?\n    public async Task RecoverStallAsync)').Value
          if([string]::IsNullOrWhiteSpace($fieldExit)){throw 'altering field-exit method block missing'}
          if($fieldExit -match 'TapFresh\(0x39'){throw 'altering field-exit must never press Space'}
          if($fieldExit -match 'ClickFresh\(new Point\(33, 55\), ct\)'){throw 'altering field-exit must not use the obsolete left-top back coordinate'}
          if($fieldExit -notmatch 'TapFresh\(0x01, ct\)'){throw 'altering field-exit must unwind facility and hub with ESC'}
          if($zeroWing -notmatch 'IAlteringFieldExitScreen' -or
             $zeroWing -notmatch '채집 전 가공 UI 종료'){throw 'zero-wing field-exit guard missing'}

          $resolverGather = [regex]::Match($resolver, 'var multiGather = await BuildMultiGatheringPlanAsync[\s\S]*?await coordinator\.RunAsync\(multiGather, ct\);').Value
          if([string]::IsNullOrWhiteSpace($resolverGather)){throw 'recursive multi-gather transition block missing'}
          $exitIndex = $resolverGather.IndexOf('await ExitToFieldAndNotifyManagerAsync(')
          $gatherIndex = $resolverGather.IndexOf('await coordinator.RunAsync(multiGather, ct)')
          if($exitIndex -lt 0 -or $gatherIndex -lt 0 -or $exitIndex -gt $gatherIndex){throw 'recursive multi-gather must exit altering UI before opening life skill'}
          # M1: detecting missing materials is not evidence of travel.
          # Keep the shared manager's onsite proof until H5 confirms an exit,
          # another facility transition is proven, or stall/remote recovery fires.
          $materialEntry = [regex]::Match(
              $alteringPlan,
              'SaveStage\("재료 해결 · "[\s\S]*?await _supplyResolver\.ResolveAsync\(plan, recipe, remainingWorks, ct\);').Value
          if ([string]::IsNullOrWhiteSpace($materialEntry) -or
              $materialEntry -match '_facilityState\?\.InvalidateOnsite' -or
              $materialEntry -notmatch '실제 필드/타 시설 이탈 전 현장확정 유지' -or
              $alterTests -notmatch 'M1: material inspection and same-facility resolution without travel retain manager onsite' -or
              $alterTests -notmatch 'M1: material inspection cannot invent onsite proof' -or
              $alterTests -notmatch 'M1: material-only failure stops without queueing or revoking proven onsite') {
              throw 'M1 material-only resolution must not revoke valid manager onsite before real departure'
          }
          if($resolverGather -notmatch '다중 채집 전 가공 UI 종료 · 일반 필드 복귀 확인'){throw 'recursive multi-gather field-exit trace missing'}
          # H5: all three supply branches share one confirmed field-exit
          # notification to the lane manager; failed navigation is treated
          # as an unknown location, not as permission to reuse onsite.
          $managerExit = [regex]::Match(
              $resolver,
              'private async Task ExitToFieldAndNotifyManagerAsync[\s\S]*?(?=\r?\n    public async Task ResolveAsync)').Value
          if ([string]::IsNullOrWhiteSpace($managerExit) -or
              $managerExit -notmatch 'await fieldExit.ExitToFieldAsync\(ct\)' -or
              $managerExit -notmatch '_laneState\?\.InvalidateOnsite' -or
              $managerExit -notmatch '실제 필드 복귀 확인' -or
              $managerExit -notmatch '필드 이탈 진행 중 위치 미확정' -or
              [regex]::Matches($resolver, 'await ExitToFieldAndNotifyManagerAsync\(').Count -ne 3 -or
              $multiAlterMain -notmatch 'dependencyScheduler: dependencyScheduler,\s*laneState: laneState' -or
              $resolver -notmatch 'FacilityLaneState\? laneState = null' -or
              $alterTests -notmatch 'H5: after an intermediate onsite confirmation, a subsequent grouped field exit' -or
              $alterTests -notmatch 'H5: whole-plan preflight announces confirmed field exit' -or
              $alterTests -notmatch 'H5: hidden raw shortage discovered after intermediate processing' -or
              $alterTests -notmatch 'H5: uncertain or failed field exit invalidates stale onsite' -or
              $alterTests -notmatch 'H5: resolver preflight without actual field departure') {
              throw 'H5 actual field exit must invalidate manager onsite before every subsequent gather'
          }
          if($multiGather -notmatch 'new GatheringAutomation' -or
             $multiGather -notmatch 'await automation\.RunAsync\(plan, ct\)'){throw 'multi-gather must delegate execution to verified single-gather automation'}
          if($multiGather -match 'TapFresh|ClickFresh|DragFresh|0x39'){throw 'multi-gather coordinator must not own direct input or Space'}

          if($alterScreen -match 'ConfirmFacilityTravelDialogIfPresentAsync' -or
             $alterScreen -notmatch '이동 확인창 감지' -or
             $alterScreen -notmatch '이동 확인창 닫힘 확인'){throw 'continuous center travel-popup handling missing'}

          foreach($source in @($craftScreen,$gatherScreen,$bulkScreen,$alterScreen,$resolver,$multiGather)){
            if($source -match 'execute_gathering|execute_altering|execute_crafting'){throw 'paid production CLI action leaked into V3 production execution'}
          }

      - name: Inline production UI regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/production-ui/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Production UI regressions failed' }

      - name: Diagnostic-only regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/gathering-diagnostic/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic regressions failed' }
