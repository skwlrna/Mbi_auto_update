            if($screen -match 'GuardedInputController _input' -or $screen -match 'WindowCapture _capture'){throw 'production screen owns legacy input/capture instead of V3 runtime'}
          }

          if($runtime -notmatch 'RequireStableExactAsync' -or
             $runtime -notmatch '클릭 직전 대상 위치가 바뀌었습니다' -or
