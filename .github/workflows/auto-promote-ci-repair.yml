name: Auto Promote CI-Validated Repair

# Trusted main-branch workflow. A Codex candidate branch does NOT execute
# release credentials: only its finished production CI result is inspected.
on:
  workflow_run:
    workflows: ["Check V3 Production Engine"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: mabi-reviewed-auto-repair-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      ${{ github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.repository.full_name == github.repository &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          startsWith(github.event.workflow_run.head_branch, 'auto-repair/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout trusted promotion gate from main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Identify a single, still-open auto-repair candidate
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_CI_SHA: ${{ github.event.workflow_run.head_sha }}
          REPAIR_CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPAIR_CI_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "skwlrna/Mbi_auto_update" ]]; then
            echo 'Unexpected repository: auto promotion blocked' >&2
            exit 1
          fi
          if [[ ! "$REPAIR_CI_BRANCH" =~ ^auto-repair/[0-9a-f]{24}-[0-9a-f]{8}$ ]] ||
             [[ ! "$REPAIR_CI_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Not a generated repair branch and full commit: blocked' >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            > "$RUNNER_TEMP/open-repair-prs.json"
          pr_number=$(python3 - "$RUNNER_TEMP/open-repair-prs.json" \
            "$REPAIR_CI_SHA" "$REPAIR_CI_BRANCH" <<'PY'
          import json
          import sys
          from pathlib import Path

          prs = json.loads(Path(sys.argv[1]).read_text(encoding="utf8"))
          sha, branch = sys.argv[2:]
          if not isinstance(prs, list) or len(prs) == 100:
              # Fail closed rather than trusting a potentially truncated list.
              raise SystemExit("Open PR list ambiguous or truncated")
          matches = [
              pr for pr in prs
              if pr.get("state") == "open"
              and pr.get("head", {}).get("sha") == sha
              and pr.get("head", {}).get("ref") == branch
              and pr.get("head", {}).get("repo", {}).get("full_name")
                  == "skwlrna/Mbi_auto_update"
              and pr.get("base", {}).get("ref") == "main"
          ]
          if len(matches) == 0:
              # CI reruns AFTER merge must not trigger another release.
              print("none")
          elif len(matches) == 1:
              print(matches[0]["number"])
          else:
              raise SystemExit("Multiple matching repair PRs: blocked")
          PY
          )
          if [[ "$pr_number" == "none" ]]; then
            echo "No open candidate for CI run $REPAIR_CI_ID; no action"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$pr_number" =~ ^[1-9][0-9]{0,7}$ ]]; then
            echo 'Invalid PR number' >&2
            exit 1
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "pr=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Exact-head audit, guarded squash merge and release request
        if: steps.candidate.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr }}
        run: |
          set -euo pipefail
          # The existing gate is authoritative. It verifies the original
          # incident fingerprint, source parent SHA, ONLY registered C# and
          # one test folder, a single candidate commit, unchanged main and
          # the newest successful production CI of this exact PR head.
          # Branch protection/reviews are never bypassed or overridden.
          #
          # "ci_only" is explicit: no real-game test was performed.
          python3 tools/mabi-auto-repair/promotion_gate.py \
            promote-ci-only "$PR_NUMBER" \
            --acknowledge-unverified --acknowledge-merge

          # promote-ci-only queues prepare-reviewed-repair-release.yml.
          # That workflow independently checks main CI, prepares exactly
          # four version files, and triggers a fresh production CI.
          # The existing publisher separately enforces EXE smoke, ZIP
          # SHA256, rollback assets, exact SHA and no duplicate release.
