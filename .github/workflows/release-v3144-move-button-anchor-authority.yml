name: Release V3.1.44 Move Button Anchor Authority
# Pinned V3.1.44 source snapshot. Makes the fixed left move-button anchor authoritative over ambiguous top-right X/currency pixels.
# release trigger: V3.1.44 mixed multi-altering build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release-v3144-move-button-anchor-authority.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v3144-nested-dependency-resume-safety
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6f7118a150608e81c2a7c24f4b6824b60037c83b
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify release source and versions
        shell: pwsh
        run: |
          $releaseSource = '6f7118a150608e81c2a7c24f4b6824b60037c83b'
          if ((git rev-parse HEAD) -ne $releaseSource) { throw 'release source snapshot mismatch' }
          $u = Get-Content source/FishingAutomation/UpdateManager.cs -Raw
          if ($u -notmatch 'CurrentVersion = "V3\.1\.44"') { throw 'version constant mismatch' }
          $p = Get-Content source/FishingAutomation/FishingAutomation.csproj -Raw
          foreach ($field in @('Version','AssemblyVersion','FileVersion')) {
            $expected = if ($field -eq 'Version') { '3.1.44' } else { '3.1.44.0' }
            if ($p -notmatch [regex]::Escape("<$field>$expected</$field>")) { throw "$field mismatch" }
          }
      - name: Restore and test
        shell: pwsh
        run: |
          dotnet restore source/FishingAutomation/FishingAutomation.csproj -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'dotnet step failed' }
          dotnet restore source/MacroWatchdog/MacroWatchdog.csproj -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'dotnet step failed' }
          dotnet restore changes/tests/stability/Regression.csproj
          if ($LASTEXITCODE -ne 0) { throw 'dotnet step failed' }
          dotnet build source/FishingAutomation/FishingAutomation.csproj -c Release -r win-x64 --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'dotnet step failed' }
          dotnet build source/MacroWatchdog/MacroWatchdog.csproj -c Release -r win-x64 --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'dotnet step failed' }
          dotnet run --project changes/tests/stability/Regression.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'dotnet step failed' }
      - name: Stable production behavior lock
        shell: pwsh
        run: ./tests/stability/ProductionBehaviorBaseline.ps1

      - name: Updater rollback regression tests
        shell: pwsh
        run: ./changes/tests/stability/Updater.Tests.ps1 -Updater ./source/tools/ApplyUpdate.ps1

      - name: Loot and retry regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/loot-retry/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Loot/retry regressions failed' }
          dotnet run --project tests/retry-flow/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Retry flow regressions failed' }

      - name: Read-only CLI regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/cli-readonly/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'CLI regressions failed' }
      - name: Inventory loot regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/inventory-loot/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Inventory loot regressions failed' }
      - name: Automatic altering regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/altering/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Altering regressions failed' }
          dotnet build tests/altering-visual/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Altering visual harness build failed' }

      - name: Diagnostic-only regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/gathering-diagnostic/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic regressions failed' }

      - name: Automatic gathering regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/gathering/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Gathering regressions failed' }

      - name: Crafting regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/crafting/Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Crafting regressions failed' }

      - name: Receipt field-return safety regression guards
        shell: pwsh
        run: |
          $screen = Get-Content source/FishingAutomation/dungeon/AlteringScreen.cs -Raw
          $policy = Get-Content source/FishingAutomation/AlteringReceiptPolicy.cs -Raw
          $tests = Get-Content tests/altering/Program.cs -Raw
          if ($screen -notmatch '일반 필드 3회 확인' -or
              $screen -notmatch 'await EnterFacilityAsync\(plan, ct\)' -or
              $screen -notmatch 'IsProvenReceiptAfterReopen' -or
              $screen -notmatch '재수령 Space 금지') { throw 'bounded field return recovery with read-only receipt proof missing' }
          if ($policy -notmatch 'CanRecoverFieldAfterCompletion' -or
              $policy -notmatch 'autoTraveling == false' -or
              $policy -notmatch 'IsProvenReceiptAfterReopen') { throw 'receipt field recovery policy is missing or unsafe' }
          if ($tests -notmatch '14:23 receipt regression' -or
              $tests -notmatch 'unknown CLI state blocks field re-entry' -or
              $tests -notmatch 'reopened facility cannot falsely confirm unchanged') { throw 'field return regression coverage missing' }

      - name: V3.1.44 behavior guards
        shell: pwsh
        run: |
          $bulk = Get-Content source/FishingAutomation/dungeon/InventoryBulkGatheringScreen.cs -Raw
          $craft = Get-Content source/FishingAutomation/dungeon/CraftingScreen.cs -Raw
          $runtime = Get-Content source/FishingAutomation/dungeon/ProductionUiRuntime.cs -Raw
          if($craft -notmatch 'IsProductDetailStructureAsync' -or
             $craft -notmatch '선택 후 품목명 OCR 재확인 생략'){throw 'crafting post-click structural detail check missing'}
          if($craft -match 'if \(await IsProductDetailAsync\(verify, displayName, ct\)\)'){throw 'crafting post-click item-name OCR reconfirmation returned'}
          $craftAuto = Get-Content source/FishingAutomation/CraftingAutomation.cs -Raw

          $bulkStart = [regex]::Match($bulk, 'public async Task StartAsync[\s\S]*?(?=\r?\n    private static bool CanUseInventoryFallback)').Value
          if([string]::IsNullOrWhiteSpace($bulkStart)){throw 'bulk gathering StartAsync block missing'}
          if($bulkStart -match 'InventoryBulkGatheringAutomation|StartInventoryHundredQuestAsync|_fallback\.StartAsync'){throw 'bulk gathering must stay life-skill only'}
          if($bulk -notmatch '프로필 열기 · C 입력' -or
             $bulk -notmatch 'ProfileLifeSkillPoint = new\(400, 944\)' -or
             $bulk -notmatch '생활 스킬 고정좌표 클릭' -or
             $bulk -notmatch '생활 스킬 화면 진입 확인 · 상단 제목 2프레임 안정'){throw 'fixed profile/life-skill navigation missing'}
          foreach($fixedCategory in @(
            '"일상 채집" => new Point\(222, 206\)',
            '"나무 베기" => new Point\(341, 206\)',
            '"광석 캐기" => new Point\(460, 206\)',
            '"약초 채집" => new Point\(578, 206\)',
            '"양털 깎기" => new Point\(222, 383\)',
            '"추수" => new Point\(341, 383\)',
            '"호미질" => new Point\(460, 383\)'
          )){
            if($bulk -notmatch $fixedCategory){throw "fixed life-skill category coordinate missing: $fixedCategory"}
          }
          $lifeSkillStart = [regex]::Match($bulk, 'private async Task StartLifeSkillHundredAsync[\s\S]*?(?=\r?\n    private async Task<DetectionResult\?> FindStableLifeSkillRowAsync)').Value
          if([string]::IsNullOrWhiteSpace($lifeSkillStart)){throw 'life-skill start block missing'}
          if($lifeSkillStart -match 'ClickExactAsync\(\s*"생활 스킬"' -or
             $lifeSkillStart -match 'ClickExactAsync\(\s*source\.Category'){throw 'life-skill/profile category navigation must stay fixed-coordinate'}
          if($bulk -match 'LifeSkillNearestLocationPoint'){throw 'obsolete fixed nearest-location coordinate returned'}
          if($bulk -notmatch 'LifeSkillNearestHelpTemplate' -or
             $bulk -notmatch 'life_skill_nearest_help\.png' -or
             $bulk -notmatch 'ClickLifeSkillNearestLocationAsync'){throw 'life-skill nearest-location help-icon template path missing'}
          if(-not (Test-Path source/FishingAutomation/dungeon/templates/life_skill_nearest_help.png)){throw 'life-skill nearest-location help-icon template file missing'}
          if($lifeSkillStart -match 'ClickExactAsync\(\s*"가까운 위치 찾기"' -or
             $lifeSkillStart -match 'FindUniqueAsync\([\s\S]{0,300}"100회 채집"'){throw 'life-skill start must not OCR-click nearest location or search for a visible 100회 control'}
          if($lifeSkillStart -match 'detailTarget' -or
             $lifeSkillStart -match '생활 스킬 상세 팝업을 확인하지 못해'){throw 'life-skill target name must not be OCR-reconfirmed after row selection'}
          if($lifeSkillStart -notmatch '상세 품목명/가까운 위치 문구 OCR 생략'){throw 'life-skill post-click OCR removal trace missing'}
          $nearestPoint = [regex]::Match($bulk, 'private static Point LifeSkillNearestClickPoint[\s\S]*?(?=\r?\n    private async Task ClickLifeSkillNearestLocationAsync)').Value
          if([string]::IsNullOrWhiteSpace($nearestPoint) -or
             $nearestPoint -notmatch 'nominalLeftOffset' -or
             $nearestPoint -notmatch 'clickPoint\.X < 140' -or
             $nearestPoint -notmatch 'clickPoint\.X > 390'){throw 'nearest-location safe offset policy missing'}
          $nearestHelper = [regex]::Match($bulk, 'private async Task ClickLifeSkillNearestLocationAsync[\s\S]*?(?=\r?\n    private async Task<bool> TryRetryLifeSkillNearestLocationAsync)').Value
          if([string]::IsNullOrWhiteSpace($nearestHelper)){throw 'nearest-location help-icon helper missing'}
          if($nearestHelper -match 'FindUniqueAsync|FindCompact|ClickStableExact|FindBrightGlyphMultiScale'){throw 'nearest-location initial helper must delegate final-frame template validation to shared runtime and never depend on OCR'}
          if($nearestHelper -notmatch 'ClickOffsetFromStableBrightTemplateAsync' -or
             $nearestHelper -notmatch 'threshold: 0\.78' -or
             $nearestHelper -notmatch 'LifeSkillNearestClickPoint' -or
             $nearestHelper -notmatch '클릭 직전 재확인'){throw 'nearest-location final-frame validated template/offset guard missing'}
          $nearestRetry = [regex]::Match($bulk, 'private async Task<bool> TryRetryLifeSkillNearestLocationAsync[\s\S]*?(?=\r?\n    private async Task ResolveLifeSkillNearestResultAsync)').Value
          if([string]::IsNullOrWhiteSpace($nearestRetry) -or
             $nearestRetry -notmatch 'FindBrightTemplate' -or
             $nearestRetry -notmatch 'ProductionUiRuntime\.Stable' -or
             $nearestRetry -notmatch '_ui\.ClickFresh' -or
             $nearestRetry -notmatch '상세창 \? 기준이 계속 보일 때만 입력'){throw 'nearest-location ignored-click stable-anchor retry missing'}
          if($runtime -notmatch 'ClickOffsetFromStableBrightTemplateAsync' -or
             $runtime -notmatch 'FindBrightTemplate\(' -or
             $runtime -notmatch '클릭 직전 템플릿 위치가 바뀌었습니다' -or
             $runtime -notmatch '_input\.ClickClientPoint'){throw 'shared final-frame bright-template click guard missing'}

          $nearestResult = [regex]::Match($bulk, 'private async Task ResolveLifeSkillNearestResultAsync[\s\S]*?(?=\r?\n    private async Task<\(bool Confirmed)').Value
          if([string]::IsNullOrWhiteSpace($nearestResult)){throw 'nearest-location direct/recommended/transition routing helper missing'}
          $gatherVision = Get-Content source/FishingAutomation/dungeon/GatheringVision.cs -Raw
          if($nearestResult -notmatch 'IsOwnedLifeSkillActivity\(activity\)' -or
             $nearestResult -notmatch '_navigationVision\.FirstPlaceAsync' -or
             $nearestResult -notmatch '_navigationVision\.HasPlaceListHeaderAsync' -or
             $nearestResult -notmatch 'GatheringNavigationPolicy\.IsStableFirstRow' -or
             $nearestResult -notmatch '가까운 위치 결과=바로 이동형' -or
             $nearestResult -notmatch '가까운 위치 결과=추천 장소형' -or
             $nearestResult -notmatch '가까운 위치 결과=직접 전환형'){throw 'nearest-location direct/recommended/transition split is incomplete'}
          if($nearestResult -notmatch 'poll == 4 \|\| poll == 8' -or
             $nearestResult -notmatch 'retryOffset = retryNumber == 1 \? 56 : 84' -or
             $nearestResult -notmatch 'TryRetryLifeSkillNearestLocationAsync' -or
             $nearestResult -notmatch '상세창 \? 2프레임 소실' -or
             $nearestResult -notmatch '상세창 \? 소실 4초 유지 \+ 추천 장소 헤더 없음'){throw 'nearest-location no-response retry/transition safety guard missing'}
          if($gatherVision -notmatch 'HasPlaceListHeaderAsync' -or
             $gatherVision -notmatch '"구하는 방법"'){throw 'recommended-place list header detector missing'}
          if($bulk -notmatch 'TimeSpan\.FromSeconds\(90\)' -or
             $bulk -notmatch '생활 스킬 이동/채집 상태나 재고 증가를 확인하지 못했습니다'){throw 'direct-transition startup timeout guard missing'}
          $cliRouteIndex = $nearestResult.IndexOf('if (IsOwnedLifeSkillActivity(activity))')
          $placeRouteIndex = $nearestResult.IndexOf('_navigationVision.FirstPlaceAsync')
          if($cliRouteIndex -lt 0 -or $placeRouteIndex -lt 0 -or $cliRouteIndex -gt $placeRouteIndex){throw 'CLI/main-button direct-travel decision must run before recommended-place screen input'}
          if($lifeSkillStart -notmatch 'ResolveLifeSkillNearestResultAsync\(source\.TargetName, ct\)'){throw 'life-skill start does not route nearest-location result'}
          if($lifeSkillStart -notmatch '100회는 행동 횟수이며 획득 수량과 분리'){throw '100-action vs item-count separation trace missing'}
          if($bulk -notmatch 'WaitForProfileOpenAsync' -or
             $bulk -notmatch 'LifeSkillProfilePolicy\.MayRetryToggle' -or
             $bulk -notmatch 'C 추가 입력 없음' -or
             $bulk -notmatch '토글키 C를 다시 누르지 않고 안전하게 정지'){throw 'safe profile C-toggle recovery missing'}
          if($bulk -match 'attempt <= 3'){throw 'profile recognition must not blindly toggle C three times'}
          if($bulk -notmatch '목표 재료 확보' -or
             $bulk -notmatch '화면 Stop 버튼\+CLI 2회 확인 후 Space 정지 입력 전송' -or
             $bulk -notmatch '채집/이동 종료 CLI\+화면 2회 확인' -or
             $bulk -notmatch 'await StopAsync\(ct\);\s*await ConfirmLifeSkillStoppedAsync' -or
             $bulk -notmatch '호출한 가공 단계로 복귀'){throw 'target-quantity bulk gathering visual-stop safety trace missing'}
          $stopPolicy = Get-Content source/FishingAutomation/LifeSkillStopPolicy.cs -Raw
          $postStop = [regex]::Match($bulk, 'private async Task ConfirmLifeSkillStoppedAsync[\s\S]*?(?=\r?\n    private async Task StartInventoryHundredQuestAsync)').Value
          if([string]::IsNullOrWhiteSpace($postStop)){throw 'post-Space stop confirmation missing'}
          if($postStop -notmatch 'LifeSkillStopPolicy\.IsStoppedAfterSpace' -or
             $postStop -notmatch 'MainButtonState 잔상은 종료 판정에서 제외'){throw 'post-Space stale Stop-button handling missing'}
          if($postStop -match 'IsOwnedLifeSkillActivity\(activity\)'){throw 'post-Space confirmation must not use stale MainButtonState activity helper'}
          if($stopPolicy -match 'MainButtonState' -or
             $stopPolicy -notmatch '!isGathering' -or
             $stopPolicy -notmatch '!isAutoTraveling' -or
             $stopPolicy -notmatch '!isFishing'){throw 'post-Space activity-only stop policy missing'}

          $noDeficit = [regex]::Match($craftAuto, 'if \(deficits\.Count == 0\)[\s\S]*?(?=\r?\n\s*string signature)').Value
          if([string]::IsNullOrWhiteSpace($noDeficit)){throw 'crafting no-deficit block missing'}
          if($noDeficit -match 'CloseOverlayAsync'){throw 'final material completion must not close the quest overlay'}
          if($noDeficit -notmatch '게임 자동 제작대 복귀 대기'){throw 'automatic station-return trace missing'}

          $craftReturn = [regex]::Match($craft, 'public async Task ReturnToStationAndCraftAsync[\s\S]*?(?=\r?\n    private async Task FinishDirectCraftAsync)').Value
          if([string]::IsNullOrWhiteSpace($craftReturn)){throw 'crafting return block missing'}
          if($craftReturn -match 'FindQuestStageAsync|SetCraftCountAsync|CloseOverlayAsync'){throw 'station return must not re-find quest stage, close overlay, or reset count'}
          if($craftReturn -notmatch '추가 퀘스트/ESC/Space 입력 없음' -or
             $craftReturn -notmatch '수량 재설정 없음'){throw 'passive crafting return trace missing'}

          $createQuest = [regex]::Match($craft, 'public async Task CreateQuestAsync[\s\S]*?(?=\r?\n    private async Task<\(bool Parsed, bool AllEnough, string Summary, IReadOnlyList<string> MaterialNames\)> ReadSelectedBatchMaterialStateAsync)').Value
          if([string]::IsNullOrWhiteSpace($createQuest)){throw 'craft route selection block missing'}
          if($createQuest -notmatch 'ReadSelectedBatchMaterialStateAsync\(craftCount, ct\)' -or
             $createQuest -notmatch 'materialState\.Parsed' -or
             $createQuest -notmatch 'materialState\.AllEnough'){throw 'craft route must use selected-batch material ratios'}
          if($craft -notmatch '선택 .*회 실제 재료 판정' -or
             $craft -notmatch '2프레임 불일치 · 안전하게 퀘스트 경로 사용'){throw 'selected-batch material safety trace missing'}
          if($craft -notmatch '상세 레시피 재료명 선판독' -or
             $craft -notmatch '퀘스트 생성 전 레시피 재료 후보 확정' -or
             $craft -notmatch 'detailCanonicalNames'){throw 'recipe material pre-read guard missing'}

          $alteringPlan = Get-Content source/FishingAutomation/AlteringPlan.cs -Raw
          $alter = Get-Content source/FishingAutomation/dungeon/AlteringScreen.cs -Raw
          if($alter -notmatch 'IsRecipeDetailStructureAsync' -or
             $alter -notmatch '선택 후 품목명 OCR 재확인 생략'){throw 'altering post-click structural detail check missing'}
          if($alter -match 'IsRecipeDetailAsync\('){throw 'altering post-click recipe-name OCR reconfirmation returned'}
          $resolver = Get-Content source/FishingAutomation/RecursiveAlteringSupplyResolver.cs -Raw
          $multiGather = Get-Content source/FishingAutomation/MultiGatheringCoordinator.cs -Raw
          $lifeLayout = Get-Content source/FishingAutomation/LifeSkillListLayout.cs -Raw
          $zeroWing = Get-Content source/FishingAutomation/ZeroWingScreenGuards.cs -Raw
          if($alteringPlan -notmatch 'interface IAlteringFieldExitScreen'){throw 'altering field-exit contract missing'}
          if($alter -notmatch 'IAlteringFieldExitScreen' -or
             $alter -notmatch 'ExitToFieldAsync' -or
             $alter -notmatch '채집 전 가공 UI 종료 확인 · 일반 필드 2프레임 확인' -or
             $alter -notmatch 'stableFieldFrames >= 2'){throw 'altering field-exit implementation missing'}
          $fieldExit = [regex]::Match($alter, 'public async Task ExitToFieldAsync[\s\S]*?(?=\r?\n    public async Task RecoverStallAsync)').Value
          if([string]::IsNullOrWhiteSpace($fieldExit)){throw 'altering field-exit method missing'}
          if($fieldExit -match 'TapFresh\(0x39'){throw 'field exit must never press Space'}
          if($fieldExit -match 'ClickFresh\(new Point\(33, 55\), ct\)'){throw 'field exit must not use obsolete left-top back coordinate'}
          if($fieldExit -notmatch 'TapFresh\(0x01, ct\)'){throw 'field exit must unwind facility and hub with ESC'}
          if($zeroWing -notmatch 'IAlteringFieldExitScreen' -or
             $zeroWing -notmatch '채집 전 가공 UI 종료'){throw 'zero-wing field-exit guard missing'}
          $resolverGather = [regex]::Match($resolver, 'var multiGather = await BuildMultiGatheringPlanAsync[\s\S]*?await coordinator\.RunAsync\(multiGather, ct\);').Value
          if([string]::IsNullOrWhiteSpace($resolverGather)){throw 'recursive multi-gather transition block missing'}
          $exitIndex = $resolverGather.IndexOf('await fieldExit.ExitToFieldAsync(ct)')
          $gatherIndex = $resolverGather.IndexOf('await coordinator.RunAsync(multiGather, ct)')
          if($exitIndex -lt 0 -or $gatherIndex -lt 0 -or $exitIndex -gt $gatherIndex){throw 'multi-gather must exit processing UI before life-skill gathering'}
          if($resolverGather -notmatch '다중 채집 전 가공 UI 종료 · 일반 필드 복귀 확인'){throw 'multi-gather field-exit trace missing'}
          if($resolver -notmatch '철괴\(철 광석\)' -or $resolver -notmatch '철괴\(광석\) 제외'){throw 'iron ingot recursive producer preference missing'}
          if($multiGather -notmatch 'new GatheringAutomation' -or
             $multiGather -notmatch 'await automation\.RunAsync\(plan, ct\)' -or
             $multiGather -notmatch 'TargetTotal' -or
             $multiGather -notmatch '시작 직전 재고'){throw 'multi-gather must delegate to verified single gather with fresh inventory targets'}
          if($multiGather -match 'TapFresh|ClickFresh|DragFresh|SendInput|InterceptionInput|0x39'){throw 'multi-gather coordinator must not own direct input or Space'}
          if($bulk -notmatch 'LifeSkillListLayout\.TryFixedRowPoint' -or
             $bulk -notmatch 'LifeSkillListLayout\.SafeDragStart' -or
             $bulk -notmatch 'LifeSkillListLayout\.SafeDragEnd'){throw 'fixed/no-scroll life-skill layout is not wired'}
          if($bulk -match 'new Point\(715, 765\)' -or $bulk -match 'new Point\(715, 345\)'){throw 'unsafe border-adjacent life-skill drag returned'}
          if($lifeLayout -notmatch '"추수"' -or
             $lifeLayout -notmatch '"양털 깎기"' -or
             $lifeLayout -notmatch 'NeverScroll' -or
             $lifeLayout -notmatch 'SafeDragStart = new\(580, 760\)' -or
             $lifeLayout -notmatch 'SafeDragEnd = new\(580, 350\)'){throw 'fixed harvest/wool or safe drag layout missing'}
      - name: V3.1.44 new behavior guards
        shell: pwsh
        run: |
          $multi = Get-Content source/FishingAutomation/MultiAlteringCoordinator.cs -Raw
          $dependencyScheduler = Get-Content source/FishingAutomation/MultiAlteringDependencyScheduler.cs -Raw
          $resolver = Get-Content source/FishingAutomation/RecursiveAlteringSupplyResolver.cs -Raw
          $multiMain = Get-Content source/FishingAutomation/MainForm.MultiAltering.cs -Raw
          $page = Get-Content source/FishingAutomation/MainForm.ProductionPage.cs -Raw
          $safety = Get-Content source/FishingAutomation/GatheringSafetyPolicy.cs -Raw
          $gather = Get-Content source/FishingAutomation/GatheringAutomation.cs -Raw
          $bulk = Get-Content source/FishingAutomation/dungeon/InventoryBulkGatheringScreen.cs -Raw
          $layout = Get-Content source/FishingAutomation/LifeSkillListLayout.cs -Raw
          if($multi -notmatch 'Func<AlteringPlan, int, CancellationToken, Task<bool>>' -or
             $multi -notmatch 'facilityWorks\.All\(x => x\.IsCompleted\)' -or
             $multi -notmatch '배치 전체 완료 전 이동 없음' -or
             $multi -notmatch '같은 시설 여러 품목은 라운드로빈 혼합' -or
             $multi -notmatch 'runBatch\(plan, 1, ct\)'){throw 'mixed multi-altering whole-facility batch scheduler missing'}
          if($multi -match 'TapFresh|ClickFresh|DragFresh|SendInput|InterceptionInput|ProductionUiRuntime'){throw 'multi-altering must not own direct input'}
          if($multiMain -notmatch 'RunBatchAsync\(' -or
