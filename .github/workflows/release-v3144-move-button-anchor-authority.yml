      - name: V3.1.44 facility-first travel guards
        shell: pwsh
        run: |
          $screen = Get-Content source/FishingAutomation/dungeon/AlteringScreen.cs -Raw
          $layout = Get-Content source/FishingAutomation/AlteringFacilityLayout.cs -Raw
          if($layout -notmatch 'MoveButtonVisualArea = new\(15, 205, 155, 65\)' -or
             $layout -notmatch 'MoveButtonPoint = new\(85, 235\)'){throw 'facility move fixed geometry missing'}
          if($screen -notmatch '설비로 이동 고정좌표 클릭'){throw 'fixed free facility move route missing'}
          $queue = [regex]::Match($screen, 'public async Task QueueAsync[\s\S]*?(?=\r?\n    private async Task RecoverRemoteDetailToOnsiteAsync)').Value
          $remoteRecovery = [regex]::Match($screen, 'private async Task RecoverRemoteDetailToOnsiteAsync[\s\S]*?(?=\r?\n    private static bool HasBottomConfirmationModal)').Value
          $travelIndex = $queue.IndexOf('await TravelToFacilityAsync')
          $selectIndex = $queue.IndexOf('await SelectRecipeAsync')
          if($travelIndex -lt 0 -or $selectIndex -lt 0 -or $travelIndex -gt $selectIndex){throw 'facility travel must happen before recipe selection'}
          if([regex]::Matches($queue, 'await TravelToFacilityAsync').Count -ne 1){throw 'queue registration must allow at most one facility travel'}
          if($queue -notmatch 'TravelToFacilityAsync\(plan, ct\)'){throw 'queue must re-check remote vs on-site before facility input'}
          if($queue -match 'remoteConfirmed:\s*true'){throw 'queue must not force a second facility travel from an on-site screen'}
          if($queue -notmatch '품목 선택 전 설비로 이동'){throw 'facility-first move trace missing'}
          if($queue -notmatch '설비 도착 · 이제 .* 선택'){throw 'post-arrival recipe selection trace missing'}
          if([regex]::Matches($queue, 'IsRecipeDetailStructureAsync').Count -ne 2){throw 'queue must keep the base detail check plus one remote-candidate confirmation detail check'}
          $remoteGuard = Get-Content source/FishingAutomation/AlteringRemoteProcessGuard.cs -Raw
          if($remoteGuard -notmatch '!firstRemote \|\| !secondRemote' -or
             $queue -notmatch '작업 등록 직전 원격 상태 후보 1/2' -or
             $queue -notmatch '단일 프레임으로 중단하지 않고 200ms 후 재확인' -or
             $queue -notmatch '원격 상태 1회 오탐 해제' -or
             $queue -notmatch 'AlteringRemoteProcessGuard\.ShouldBlock'){throw 'two-frame remote processing veto confirmation missing'}
          if($queue -notmatch 'AlteringRemoteProcessGuard\.CanRecover\(true, remoteRecoveryUsed\)' -or
             $queue -notmatch '원격 상세 2프레임 확정' -or
             $queue -notmatch 'restartAfterRemoteRecovery' -or
             [string]::IsNullOrWhiteSpace($remoteRecovery) -or
             $remoteRecovery -notmatch 'TravelToFacilityAsync\(plan, ct, remoteConfirmed: true\)' -or
             [regex]::Matches($remoteRecovery, 'TravelToFacilityAsync').Count -ne 1){throw 'V3.1.44 bounded remote detail recovery missing'}
          $remoteDetailGuard = [regex]::Match($screen, 'private async Task<\(bool IsRemote, string Evidence\)> DetectRemoteProcessStateAsync[\s\S]*?(?=\r?\n    public async Task QueueAsync)').Value
          if([string]::IsNullOrWhiteSpace($remoteDetailGuard)){throw 'confirmed-detail remote processing guard missing'}
          if($remoteDetailGuard -match 'HasFacilityMoveButtonVisual'){throw 'confirmed recipe detail must not reuse facility move-button colour detection'}
          if($remoteDetailGuard -notmatch '"가공하러 가기"' -or
             $remoteDetailGuard -notmatch 'paid is not null'){throw 'confirmed-detail remote veto must rely on remote-only paid action signal'}
          if($queue -match '설비 이동 후에도 원격 가공 상태가 확인되어 추가 이동 없이 정지'){throw 'duplicate post-select detail/OCR pass returned'}
          if($queue -match '품목 상세 기준 설비 이동 필요 확정' -or
             $queue -match '같은 품목을 다시 선택하고 바로 현장 가공'){throw 'V3.1.12 recipe-first backtrack flow returned'}
          if($queue -notmatch 'V3\.1\.8 execution model for every processing facility'){throw 'V3.1.8 all-processing execution marker missing'}
          $travel = [regex]::Match($screen, 'private async Task TravelToFacilityAsync[\s\S]*?(?=\r?\n    // Free navigation only)').Value
          if($travel -notmatch 'facilityVisible' -or
             $travel -notmatch '!moveVisible' -or
             $travel -notmatch 'onsiteStableFrames'){throw 'direct on-site arrival visual gate missing'}
          if($travel -match 'if \(sawDeparture &&\s*facilityVisible'){throw 'departure evidence must not gate direct facility arrival'}
          if($travel -notmatch 'HasStableOnsiteEvidence' -or
             $travel -notmatch 'FinalOnsiteRecheckDelay' -or
             $travel -notmatch '설비 도착 후보 후행 재확인 실패' -or
             $travel -notmatch 'CLI AutoTraveling=false'){throw 'stable delayed facility arrival verification missing'}
          if($screen -notmatch 'ConfirmFacilityTravelDialogIfPresentAsync' -or
             $screen -notmatch '설비 이동 확인창 감지 · Space 1회 확인' -or
             $screen -notmatch '설비 이동 확인창 없음 · Space 생략'){throw 'optional facility travel confirmation handling missing'}
          if($layout -notmatch 'OnsiteCloseVisualArea = new\(744, 42, 44, 44\)'){throw 'on-site close-X geometry missing'}

