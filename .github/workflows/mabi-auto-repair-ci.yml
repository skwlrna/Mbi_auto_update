name: MabiAutoRepair independent offline tests

on:
  pull_request:
    paths:
      - 'tools/mabi-auto-repair/**'
      - '.github/workflows/mabi-auto-repair-ci.yml'
  push:
    branches: [main]
    paths:
      - 'tools/mabi-auto-repair/**'
      - '.github/workflows/mabi-auto-repair-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Isolated offline tests, no AI and no game actions
        shell: pwsh
        run: |
          python -m unittest discover -s tools/mabi-auto-repair -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Standalone repair tests failed" }
      - name: Parse Windows Task Scheduler installer (no task registered)
        shell: pwsh
        run: |
          $tokens = $null
          $syntaxErrors = $null
          $file = (Resolve-Path "tools/mabi-auto-repair/install_watch.ps1").Path
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            $file, [ref]$tokens, [ref]$syntaxErrors)
          if ($syntaxErrors.Count -gt 0) {
            throw "Invalid PowerShell watcher installer syntax"
          }
      - name: CLI syntax and help
        shell: pwsh
        run: |
          python tools/mabi-auto-repair/repair.py --help
          if ($LASTEXITCODE -ne 0) { throw "CLI failed" }
