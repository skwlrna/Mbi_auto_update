name: Abyss recruitment regression
on:
  pull_request:
    paths:
      - 'source/FishingAutomation/dungeon/**'
      - 'tests/retry-flow/**'
      - '.github/workflows/abyss-recruitment.yml'
jobs:
  retry-flow:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/retry-flow/Regression.csproj -c Release
