name: Prepare Reviewed Repair Release

on:
  workflow_dispatch:
    inputs:
      repair_pr:
        description: "Reviewed, merged auto-repair PR number"
        required: true
      reviewed_head_sha:
        description: "Exact reviewed repair candidate commit SHA"
        required: true
      acknowledge_unverified:
        description: "Explicit CI-only deployment, no game verification"
        required: true
        default: "false"

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: reviewed-repair-release
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ inputs.acknowledge_unverified == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate approved repair PR against exact current main CI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.repair_pr }}
          APPROVED_HEAD: ${{ inputs.reviewed_head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PR_NUMBER -notmatch '^[1-9][0-9]{0,7}$' -or
              $env:APPROVED_HEAD -notmatch '^[0-9a-f]{40}$') { throw 'Invalid approval parameters' }
          $pr = gh api "repos/$env:GITHUB_REPOSITORY/pulls/$env:PR_NUMBER" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $pr) { throw 'Cannot read approved PR' }
          $sha = (git rev-parse HEAD).Trim()
          if ($pr.merged_at -eq $null -or $pr.base.ref -ne 'main' -or
              $pr.head.repo.full_name -ne $env:GITHUB_REPOSITORY -or
              $pr.head.ref -notmatch '^auto-repair/[a-f0-9]{24}-[a-f0-9]{8}$' -or
              $pr.head.sha -ne $env:APPROVED_HEAD -or $pr.merge_commit_sha -ne $sha) {
            throw 'Only most recent exact reviewed repair merge can publish'
          }
          $files = @(gh api "repos/$env:GITHUB_REPOSITORY/pulls/$env:PR_NUMBER/files?per_page=100" | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $files.Count -lt 2 -or $files.Count -gt 12) { throw 'Invalid repair scope' }
          $source = @($files | Where-Object { $_.filename -like 'source/FishingAutomation/*.cs' })
          $tests = @($files | Where-Object { $_.filename -match '^tests/(altering|gathering|crafting|loot-retry|retry-flow)/.*\.cs$' })
          $invalid = @($files | Where-Object {
            $_.status -notin @('added','modified') -or
            $_.filename -eq 'source/FishingAutomation/UpdateManager.cs' -or
            ($_.filename -notlike 'source/FishingAutomation/*.cs' -and
             $_.filename -notmatch '^tests/(altering|gathering|crafting|loot-retry|retry-flow)/.*\.cs$')
          })
          if ($source.Count -lt 1 -or $tests.Count -lt 1 -or $invalid.Count -gt 0) {
            throw 'Candidate repair has unreviewed files'
          }
          $prCI = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$env:APPROVED_HEAD&event=pull_request&per_page=50" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or
              @($prCI.workflow_runs | Where-Object {
                $_.head_sha -eq $env:APPROVED_HEAD -and $_.conclusion -eq 'success' -and
                $_.name -eq 'Check V3 Production Engine'
              }).Count -lt 1) { throw 'Repair PR CI missing' }
          $passed = $false
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            $mainCI = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&per_page=30" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Main CI API unavailable' }
            $ours = @($mainCI.workflow_runs | Where-Object {
              $_.head_sha -eq $sha -and $_.event -eq 'push' -and $_.head_branch -eq 'main'
            })
            if (@($ours | Where-Object { $_.status -eq 'completed' -and $_.conclusion -eq 'success' }).Count -gt 0) {
              $passed = $true; break
            }
            if (@($ours | Where-Object { $_.status -eq 'completed' -and $_.conclusion -ne 'success' }).Count -gt 0) {
              throw 'Current reviewed main CI failed'
            }
            Start-Sleep -Seconds 20
          }
          if (-not $passed) { throw 'Timed out waiting for reviewed main CI' }
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq .tag_name
          if ($LASTEXITCODE -ne 0 -or $latest -notmatch '^V\d+\.\d+\.\d+$') { throw 'Latest public version missing' }
          "PUBLISHED_VERSION=$latest" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "REVIEWED_MERGE_SHA=$sha" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Create version-only release commit
        shell: pwsh
        env:
          PR_NUMBER: ${{ inputs.repair_pr }}
          APPROVED_HEAD: ${{ inputs.reviewed_head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s tools/mabi-auto-repair -p "test_*.py" -q
          if ($LASTEXITCODE -ne 0) { throw 'Offline repair regressions failed' }
          python tools/mabi-auto-repair/prepare_release.py --repo . --latest-release "$env:PUBLISHED_VERSION" --repair-pr "$env:PR_NUMBER" --approved-head-sha "$env:APPROVED_HEAD" --reviewed-merge-sha "$env:REVIEWED_MERGE_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Version-only preparation rejected' }
          if (@(git status --porcelain).Count -ne 4) { throw 'Unexpected version preparation files' }
          git add -- source/FishingAutomation/UpdateManager.cs source/FishingAutomation/FishingAutomation.csproj
          git add -- source/RELEASE_NOTES_V*.md source/V*_CI_ONLY_REPAIR_APPROVAL.json
          if (@(git diff --cached --name-only).Count -ne 4) { throw 'Unexpected release file scope' }
          # Workflow files remain unchanged; GitHub's built-in automation token
          # cannot reliably push edits to .github/workflows/**.
          git -c user.name="MabiAuto Release Bot" -c user.email="ci-release@users.noreply.github.com" commit -m "chore(release): CI-only reviewed repair from PR #$env:PR_NUMBER"
          if ($LASTEXITCODE -ne 0) { throw 'Version commit rejected' }

      - name: Fast-forward main and dispatch exact-version production CI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $remote = git ls-remote origin refs/heads/main
          if ($LASTEXITCODE -ne 0 -or (($remote -split "\s+")[0]).Trim() -ne $env:REVIEWED_MERGE_SHA) {
            throw 'Main changed since review. No release pushed.'
          }
          git push origin HEAD:refs/heads/main
          if ($LASTEXITCODE -ne 0) { throw 'Cannot push version-only update' }
          # GitHub Actions token pushes do not trigger CI by themselves.
          gh workflow run ci.yml --repo $env:GITHUB_REPOSITORY --ref main
          if ($LASTEXITCODE -ne 0) { throw 'CI dispatch failed; release remains blocked' }
