      - name: Require CI-approved current main and exact V3.2.98 version
        id: eligibility
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $sha=(git rev-parse HEAD).Trim()
          if($LASTEXITCODE-ne0 -or $sha -ne $env:CI_HEAD_SHA){throw 'Wrong CI checkout SHA'}
          $remote=(git ls-remote origin refs/heads/main | Select-Object -First 1)
          if($LASTEXITCODE-ne0 -or [string]::IsNullOrWhiteSpace($remote)){throw 'main unavailable'}
          if((($remote -split "\s+")[0]).Trim() -ne $sha){throw 'main moved since CI; abort'}
          # Automatic and manual promotion both require an already CI-approved main commit.
          # The path-scoped push event may arrive before main CI finishes.
          # Wait for that exact SHA; never publish from PR CI or a stale main.
          $deadline=(Get-Date).AddMinutes(25)
          do {
            $remote=(git ls-remote origin refs/heads/main | Select-Object -First 1)
            if($LASTEXITCODE-ne0 -or (($remote -split "\s+")[0]).Trim() -ne $sha) {
              throw 'main changed since CI; abort release'
            }
            $ci=gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$sha&per_page=20" | ConvertFrom-Json
            if($LASTEXITCODE-ne0 -or -not $ci){throw 'Cannot verify main CI'}
            $observed=@($ci.workflow_runs | Where-Object {
              $_.head_sha -eq $sha -and $_.event -eq 'push'
            })
            $passed=@($observed | Where-Object {
              $_.status -eq 'completed' -and $_.conclusion -eq 'success'
            })
            if($passed.Count -ge 1){break}
            $bad=@($observed | Where-Object {
              $_.status -eq 'completed' -and
              $_.conclusion -in @('failure','cancelled','timed_out','action_required')
            })
            if($bad.Count -gt 0){throw 'Main production CI did not pass; refuse release'}
            if((Get-Date) -ge $deadline){throw 'No successful production CI for current main SHA'}
            Write-Host 'Waiting for CI on exact main SHA (no publication until success)'
            Start-Sleep -Seconds 20
          } while ($true)
          $u=Get-Content source/FishingAutomation/UpdateManager.cs -Raw
          if(-not $u.Contains('CurrentVersion = "V3.2.98"')){
            "publish=false" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8
            Write-Host 'Not V3.2.98 any more; skip'
            exit 0
          }
          $p=Get-Content source/FishingAutomation/FishingAutomation.csproj -Raw
          foreach($tag in @('<Version>3.2.98</Version>','<AssemblyVersion>3.2.98.0</AssemblyVersion>','<FileVersion>3.2.98.0</FileVersion>')){
            if(-not $p.Contains($tag)){throw "Version mismatch: $tag"}
          }
          if(-not (Test-Path source/RELEASE_NOTES_V3.2.98.md)){throw 'Release notes missing'}
          $releases=gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if($LASTEXITCODE-ne0){throw 'Release list check failed'}
          if(@($releases | Where-Object { $_.tag_name -eq 'V3.2.98' }).Count -gt 0){
            "publish=false" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8
            Write-Host 'V3.2.98 release exists: no automatic overwrite'
            exit 0
          }
          $tag=(git ls-remote --tags origin refs/tags/V3.2.98 | Select-Object -First 1)
          if($LASTEXITCODE-ne0){throw 'Tag lookup failed'}
          if(-not [string]::IsNullOrWhiteSpace($tag)){throw 'Tag exists without release; manual recovery required'}
          "publish=true" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          Write-Host "Eligible V3.2.98 CI-approved SHA: $sha"

      - name: Require F9 shortcut regression suite and merged source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($required in @('tests/altering-screen-integration','source/FishingAutomation')) { if(-not (Test-Path $required)){throw "Missing F9 field recovery: $required"} }
          if(-not (Test-Path 'source/V3.2.98_RELEASE_AUTHORIZATION.json')){throw 'Release authorization missing'}
          $f9=Get-Content 'source/FishingAutomation/dungeon/AlteringScreen.cs' -Raw
          $field=[regex]::Match($f9,
            'Func<Bitmap, Task<bool>>\? verifyManagedK = null;[\s\S]*?(?=await RequireManagedIdleAsync\(plan, directive, "가공 메뉴 K 직전")').Value
          $scene=[regex]::Match($f9,
            'private async Task<ManagedProductionSceneKind> ClassifyManagedProductionSceneAsync[\s\S]*?(?=\r?\n    private async Task EnterFacilityAsync)').Value
          $last=[regex]::Match($f9,
            'private async Task<bool> VerifyManagedKFrameAsync[\s\S]*?(?=\r?\n    internal static bool HasManagedFoodCraftingNavigationVisual)').Value
          $space=[regex]::Match($f9,
            'private async Task<bool> HasManagedKISpaceFieldHudAsync[\s\S]*?(?=\r?\n    private async Task<ManagedWorldHudKeys> FindManagedWorldHudKeysAsync)').Value
          if([string]::IsNullOrWhiteSpace($field) -or [string]::IsNullOrWhiteSpace($scene) -or
             [string]::IsNullOrWhiteSpace($last) -or [string]::IsNullOrWhiteSpace($space) -or
             $field -notmatch 'CanAuthorizeManagedKSpaceFallback' -or
             $field -notmatch 'HasManagedKISpaceFieldHudAsync' -or
             $field -notmatch 'Task.Delay\(180, ct\)' -or
             $f9 -notmatch 'TapVerifiedFreshAsync' -or
             $field -match 'DetectManagedWorldHudTemplates|CanAuthorizeManagedKEntry|CanAuthorizeManagedKFieldFallback|CanAuthorizeManagedKHomeEndFieldFallback|FindManagedWorldHudKeysAsync' -or
             $scene -notmatch 'HasManagedKISpaceFieldHudAsync' -or
             $scene -match 'DetectManagedWorldHudTemplates|DetectManagedWorldHudKeys|HasManagedKEntryFieldHudVisual' -or
             $last -notmatch 'ClassifyManagedProductionSceneAsync' -or
             $last -match 'DetectManagedWorldHudTemplates|HasManagedKEntryFieldHudVisual|DetectManagedWorldHudKeys' -or
             $space -notmatch 'HasManagedKIShortcutGlyphs' -or
             $space -notmatch 'FindCompactAsync' -or
             $space -match 'DetectManagedWorldHudTemplates|HasManagedKEntryFieldHudVisual'){
            throw 'F9 K-I-Space exclusive preflight/classifier/final-screen contract missing'
          }
          foreach($x in @(
            'tests/altering-screen-integration/Program.cs',
            'source/RELEASE_NOTES_V3.2.98.md',
            'tests/release/test_v3298_auto_update_policy.py')){
            if(-not (Test-Path $x)){throw "V3.2.98 required F9/regression/release artifact missing: $x"}
          }

      - name: Publish verified Windows binaries
        if: steps.eligibility.outputs.publish == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore source/FishingAutomation/FishingAutomation.csproj -r win-x64
          if($LASTEXITCODE-ne0){throw 'app restore failed'}
          dotnet restore source/MacroWatchdog/MacroWatchdog.csproj -r win-x64
          if($LASTEXITCODE-ne0){throw 'watchdog restore failed'}
          New-Item artifacts/app,artifacts/watchdog -ItemType Directory -Force | Out-Null
          dotnet publish source/FishingAutomation/FishingAutomation.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:PublishAot=false -p:DebugType=None -p:DebugSymbols=false -o artifacts/app
          if($LASTEXITCODE-ne0){throw 'app publish failed'}
          dotnet publish source/MacroWatchdog/MacroWatchdog.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:PublishAot=false -p:DebugType=None -p:DebugSymbols=false -o artifacts/watchdog
          if($LASTEXITCODE-ne0){throw 'watchdog publish failed'}
          if((Get-Item artifacts/app/FishingAutomation.exe).VersionInfo.FileVersion -ne '3.2.98.0'){throw 'EXE version mismatch'}
          if(-not (Test-Path artifacts/watchdog/MacroWatchdog.exe)){throw 'Missing watchdog'}

      - name: Smoke test executable
        if: steps.eligibility.outputs.publish == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path artifacts/app/FishingAutomation.exe).Path
          $p=Start-Process $exe -WorkingDirectory (Resolve-Path artifacts/app).Path -WindowStyle Hidden -PassThru
          try {
            Start-Sleep 5
            $p.Refresh()
            if($p.HasExited){throw "App exited early: $($p.ExitCode)"}
          } finally {
            Stop-Process $p.Id -Force -ErrorAction SilentlyContinue
            Get-Process MacroWatchdog -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Build updater-compatible Windows Lite, checksum, source
        if: steps.eligibility.outputs.publish == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $pkg=Join-Path $PWD 'artifacts/package'
          $rel=Join-Path $pkg 'release'
          $tools=Join-Path $pkg 'tools'
          $compat=Join-Path $pkg 'FishingAutomation'
          New-Item $rel,$tools,$compat -ItemType Directory -Force | Out-Null
          Copy-Item artifacts/app/* $rel -Recurse -Force
          Copy-Item source/FishingAutomation/interception.dll (Join-Path $rel 'interception.dll') -Force
          Copy-Item artifacts/watchdog/MacroWatchdog.exe (Join-Path $rel 'MacroWatchdog.exe') -Force
          Copy-Item source/tools/ApplyUpdate.ps1 (Join-Path $tools 'ApplyUpdate.ps1') -Force
          Copy-Item source/tools/RetireAutoRepair.ps1 (Join-Path $tools 'RetireAutoRepair.ps1') -Force
          Copy-Item source/tools/RollbackPrevious.ps1 (Join-Path $tools 'RollbackPrevious.ps1') -Force
          Copy-Item source/ROLLBACK_PREVIOUS.cmd (Join-Path $pkg 'ROLLBACK_PREVIOUS.cmd') -Force
          Copy-Item source/START.cmd (Join-Path $pkg 'START.cmd') -Force
          Copy-Item source/REPAIR_AUTO_UPDATE.cmd (Join-Path $pkg 'REPAIR_AUTO_UPDATE.cmd') -Force
          'Compatibility directory for legacy updater notification restore.' | Set-Content (Join-Path $compat '.update_compat') -Encoding ASCII
          'MABI AUTO V3.2.98 - F07 medicine read-only paired retries; exact recipe + free button; no forced updates' | Set-Content (Join-Path $pkg 'WINDOWS_LITE.txt') -Encoding UTF8
          $required=@(
            'release/FishingAutomation.exe','release/MacroWatchdog.exe',
            'release/abyss/config/targets.json','release/abyss/config/scenario.json',
            'release/abyss/templates/managed_home_key.png','release/abyss/templates/managed_home_mail_key.png',
            'release/abyss/templates/managed_end_key.png','release/abyss/templates/managed_escape_key.png',
            'release/abyss/templates/managed_k_key.png','release/abyss/templates/managed_i_key.png',
            'release/abyss/templates/loot_v173/loot_hallucination_stone.png',
            'release/abyss/templates/loot_v173/loot_mor_corsair_tricorne.png',
            'release/interception.dll','START.cmd','tools/ApplyUpdate.ps1',
            'ROLLBACK_PREVIOUS.cmd','tools/RollbackPrevious.ps1',
             'tools/RetireAutoRepair.ps1')
          foreach($x in $required){if(-not (Test-Path (Join-Path $pkg $x))){throw "Missing package file: $x"}}
          if(Test-Path (Join-Path $rel 'ai-autopilot')){throw 'Legacy AutoFix accidentally packaged'}
          if(Test-Path (Join-Path $pkg 'tools/mabi-auto-repair')){throw 'Dedicated AI repair still packaged'}
          $sha=(git rev-parse HEAD).Trim()
          $sha | Set-Content (Join-Path $pkg 'BUILD_COMMIT.txt') -Encoding ASCII
          $zip=Join-Path $PWD 'artifacts/MabiAuto_V3.2.98_Windows_Lite.zip'
          [IO.Compression.ZipFile]::CreateFromDirectory($pkg,$zip,[IO.Compression.CompressionLevel]::Optimal,$false)
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MabiAuto_V3.2.98_Windows_Lite.zip" | Set-Content "$zip.sha256" -Encoding ASCII
          $stage=Join-Path $PWD 'artifacts/source-package'
          New-Item $stage -ItemType Directory -Force | Out-Null
          Copy-Item source (Join-Path $stage 'source') -Recurse -Force
          Copy-Item changes (Join-Path $stage 'changes') -Recurse -Force
          Copy-Item tests (Join-Path $stage 'tests') -Recurse -Force
          Copy-Item .github (Join-Path $stage '.github') -Recurse -Force
          Copy-Item BUILD_VERIFY.ps1,README.txt,GITHUB_MIGRATION.md $stage -Force
          $sha | Set-Content (Join-Path $stage 'BUILD_COMMIT.txt') -Encoding ASCII
          $buildDirs=@(Get-ChildItem $stage -Directory -Recurse | Where-Object { $_.Name -in @('bin','obj') })
          foreach($d in ($buildDirs | Sort-Object { $_.FullName.Length } -Descending)){
            if(Test-Path -LiteralPath $d.FullName){
              $safe=(Resolve-Path -LiteralPath $d.FullName).Path
              if(-not $safe.StartsWith($stage + [IO.Path]::DirectorySeparatorChar,[StringComparison]::OrdinalIgnoreCase)){throw 'Unsafe cleanup'}
              Remove-Item -LiteralPath $safe -Recurse -Force
            }
          }
          $sourceZip=Join-Path $PWD 'artifacts/MabiAuto_V3.2.98_Source.zip'
          [IO.Compression.ZipFile]::CreateFromDirectory($stage,$sourceZip,[IO.Compression.CompressionLevel]::Optimal,$false)
          foreach($n in @('MabiAuto_V3.2.98_Windows_Lite.zip','MabiAuto_V3.2.98_Windows_Lite.zip.sha256','MabiAuto_V3.2.98_Source.zip')){
            if((Get-Item (Join-Path 'artifacts' $n)).Length -lt 64){throw "Bad asset: $n"}
          }
          $archive=[IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $names=@($archive.Entries | ForEach-Object FullName)
            foreach($n in $required){if($n -notin $names){throw "ZIP missing: $n"}}
            if(@($names | Where-Object { $_ -like 'release/ai-autopilot/*' -or $_ -like 'tools/mabi-auto-repair/*' }).Count -gt 0){throw 'Auto-repair found in updater ZIP'}
            if('BUILD_COMMIT.txt' -notin $names){throw 'ZIP has no build provenance'}
          } finally { $archive.Dispose() }
          Write-Host "V3.2.98 ZIP SHA256: $hash"

      - name: Retain test-release assets in Actions
        if: steps.eligibility.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: V3.2.98-verified-release-packages
          path: |
            artifacts/MabiAuto_V3.2.98_Windows_Lite.zip
            artifacts/MabiAuto_V3.2.98_Windows_Lite.zip.sha256
            artifacts/MabiAuto_V3.2.98_Source.zip

      - name: Publish public auto-update Release
        if: steps.eligibility.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $sha=(git rev-parse HEAD).Trim()
          if($sha -ne $env:CI_HEAD_SHA){throw 'Wrong package source SHA'}
          $remote=(git ls-remote origin refs/heads/main | Select-Object -First 1)
          if($LASTEXITCODE-ne0 -or (($remote -split "\s+")[0]).Trim() -ne $sha){throw 'main changed since CI; abort release'}
          $tag=(git ls-remote --tags origin refs/tags/V3.2.98 | Select-Object -First 1)
          if($LASTEXITCODE-ne0 -or -not [string]::IsNullOrWhiteSpace($tag)){throw 'V3.2.98 tag already exists'}
          git tag V3.2.98 $sha
          if($LASTEXITCODE-ne0){throw 'tag creation failed'}
          git push origin refs/tags/V3.2.98
          if($LASTEXITCODE-ne0){throw 'tag push failed'}
          gh release create V3.2.98 artifacts/MabiAuto_V3.2.98_Windows_Lite.zip artifacts/MabiAuto_V3.2.98_Windows_Lite.zip.sha256 artifacts/MabiAuto_V3.2.98_Source.zip --draft --verify-tag --title 'Mabi Auto V3.2.98' --notes-file source/RELEASE_NOTES_V3.2.98.md
          if($LASTEXITCODE-ne0){throw 'Draft release failed'}
          $expected=@('MabiAuto_V3.2.98_Windows_Lite.zip','MabiAuto_V3.2.98_Windows_Lite.zip.sha256','MabiAuto_V3.2.98_Source.zip')
          $releases=gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if($LASTEXITCODE-ne0){throw 'Draft release lookup failed'}
          $draft=@($releases | Where-Object { $_.tag_name -eq 'V3.2.98' }) | Select-Object -First 1
          if(-not $draft -or -not $draft.draft -or $draft.prerelease){throw 'Draft release invalid'}
          foreach($n in $expected){if($n -notin $draft.assets.name){throw "Missing release asset: $n"}}
          gh release edit V3.2.98 --draft=false
          if($LASTEXITCODE-ne0){throw 'Release publication failed'}
          $published=gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/V3.2.98" | ConvertFrom-Json
          if($LASTEXITCODE-ne0 -or -not $published -or $published.draft -or $published.prerelease){throw 'Public auto-update not verified'}
          foreach($n in $expected){if($n -notin $published.assets.name){throw "Published release missing asset: $n"}}
          Write-Host "Auto-update V3.2.98 publicly published from commit $sha"
