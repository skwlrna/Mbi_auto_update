             $uiCraft -notmatch '제작 OCR 장기 대기' -or
             $testMulti -notmatch 'each unchanged hold type reports once' -or
             $testCraft -notmatch 'actual OCR retry queue emits one alert') {
            throw 'V3.2.98 phase1 warning source/regression mismatch'
          }
          dotnet run --project tests/altering/Regression.csproj -c Release
          if($LASTEXITCODE-ne0){throw 'Multi-altering phase1 regressions failed'}
          dotnet run --project tests/crafting/Regression.csproj -c Release
