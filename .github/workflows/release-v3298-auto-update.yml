name: Publish V3.2.98 F07 Medicine Identity Retry After Main CI

# Installed clients ignore prereleases. Publish only the CI-approved main.
# Explicit user-requested rollout authorization is NOT real-game testing.
# A verified attestation OR explicit sole-operator risk acceptance is required.
# Public release remains gated by exact main CI, updater ZIP checksum, source,
# binary smoke, included backup/rollback scripts, and no prior release tag.
# Manual dispatch retains exactly the same gates.
# One approved release attempt only when THIS reviewed workflow first lands
# on main. Later unrelated main pushes cannot restart this publisher.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v3298-auto-update.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: v3298-auto-update-release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Require V3.2.98 F07 fresh-pair identity, safety and retry regressions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $screen=Get-Content 'source/FishingAutomation/dungeon/AlteringScreen.cs' -Raw
          $policy=Get-Content 'source/FishingAutomation/AlteringRecipeIdentityPolicy.cs' -Raw
          $tests=Get-Content 'tests/altering/Program.cs' -Raw
          $notes=Get-Content 'source/RELEASE_NOTES_V3.2.98.md' -Raw
          if($screen -notmatch 'VerifyTwoFreshObservationsWithRetriesAsync' -or
             $screen -notmatch 'int currentF07Attempt = 0' -or
             $screen -notmatch 'priorVerifiedCenter = Point.Empty' -or
             $screen -notmatch 'TryFindFreeProcessButtonVisual\(fresh, out candidate\)' -or
             $screen -notmatch 'IsStableFreshFreeActionTarget' -or
             $screen -notmatch 'DetectRemoteProcessStateAsync\(fresh, token\)' -or
             $screen -notmatch 'ClickVerifiedFreshAsync' -or
             $screen -notmatch '위치안정=' -or
             $policy -notmatch 'maxAttempts > 3' -or
             $policy -notmatch 'await VerifyTwoFreshObservationsAsync' -or
             $tests -notmatch 'F07 alternating single-frame positives never authorize processing' -or
             $notes -notmatch 'F07') {
            throw 'V3.2.98 F07 no-input, two-fresh-positive, retry diagnostic or regression guard missing'
          }
          dotnet run --project tests/altering/Regression.csproj -c Release
          if($LASTEXITCODE-ne0){throw 'V3.2.98 F07 altering regression failed'}
          $env:PYTHONUTF8='1'
          python -m unittest discover -s tests/release -p 'test_v3298_auto_update_policy.py' -v
          if($LASTEXITCODE-ne0){throw 'V3.2.98 release policy failed'}

      - name: Require V3.2.98 managed receipt on-site proof
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $screen=Get-Content 'source/FishingAutomation/dungeon/AlteringScreen.cs' -Raw
          $policy=Get-Content 'source/FishingAutomation/AlteringReceiptPolicy.cs' -Raw
          $test=Get-Content 'tests/altering/Program.cs' -Raw
          $receipt=$screen.IndexOf('public async Task<bool> CollectAsyncAtBoundary(')
          if($receipt -lt 0){throw 'Managed receipt implementation missing'}
          $tail=$screen.Substring($receipt)
          $reuse=$tail.IndexOf('await RequireManagedReceiptReuseOnsiteAsync(plan, ct);')
          $generic=$tail.IndexOf('await EnterFacilityAsync(plan, ct, directive);')
          if($reuse -lt 0 -or $generic -lt 0 -or $reuse -ge $generic){
            throw 'Reuse receipt must verify target onsite before generic facility entry'
          }
          foreach($required in @(
            'private async Task RequireManagedReceiptReuseOnsiteAsync',
            'HasVerifiedFacilityEntryScreen(latest)',
            'stableFrames >= 2',
            'RequireManagedIdleAsync',
            'TryAutoTravelingAsync(ct)',
            'K/Esc/이동/수령 Space 입력 없이 정지')){
            if(-not $screen.Contains($required)){throw "Missing F9 receipt proof: $required"}
          }
          if($policy -notmatch 'consecutiveFacilityFrames >= 2' -or
             $policy -notmatch 'autoTraveling == false' -or
             $test -notmatch 'V3.2.98 managed receipt blocks stale'){
            throw 'F9 receipt reuse regression policy missing'
          }
          $env:PYTHONUTF8='1'
          python -m unittest discover -s tests/release -p 'test_v3298_auto_update_policy.py' -v
          if($LASTEXITCODE-ne0){throw 'V3.2.98 release policy failed'}
          dotnet run --project tests/altering/Regression.csproj -c Release
          if($LASTEXITCODE-ne0){throw 'V3.2.98 F9 receipt regression failed'}

      - name: Require user-authorized V3.2.98 managed receipt reuse rollout
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path='source/V3.2.98_RELEASE_AUTHORIZATION.json'
          if(-not (Test-Path -LiteralPath $path)){throw 'Missing V3.2.98 authorization'}
          $a=Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          if($a.schema -ne 1 -or $a.version -ne 'V3.2.98' -or
             $a.purpose -ne 'f07_bounded_fresh_recipe_identity_retry' -or
             $a.approvedBy -ne 'user_direct_request_in_chat' -or
             $a.realGameTested -ne $false -or $a.rollbackProvided -ne $true -or
             $a.mainCiRequired -ne $true -or
             $a.request -ne '수정하고 배포해'){
            throw 'V3.2.98 release authorization mismatch'
          }
          foreach($needed in @(
            'source/tools/ApplyUpdate.ps1',
            'source/tools/RollbackPrevious.ps1',
            'source/ROLLBACK_PREVIOUS.cmd',
            'source/START.cmd',
            'source/FishingAutomation/CraftingTelegramStatus.cs',
            'source/FishingAutomation/MainForm.CraftingTelegramStatus.cs',
            'tests/crafting/Program.cs',
            'source/FishingAutomation/CraftingFoodMaterialPolicy.cs',
            'tests/crafting/CraftingFoodMaterialPolicyTests.cs',
            'tests/crafting/CraftingFoodMaterialIntegrationTests.cs',
            'source/RELEASE_NOTES_V3.2.98.md',
            'source/V3.2.98_RELEASE_AUTHORIZATION.json',
            'tests/altering-screen-integration/HistoricalIncidentRegression.cs',
            'tests/altering-screen-integration/F9_PROCESSING_LATENCY_REVIEW.md',
            'tests/altering-screen-integration/F9_POST_UPDATE_GAME_ACCEPTANCE.md',
            'tests/altering-screen-integration/F9_HISTORICAL_CORPUS_CENSUS.md')){
            if(-not (Test-Path -LiteralPath $needed)){throw "Required release file missing: $needed"}
          }
          $code=Get-Content 'source/FishingAutomation/CraftingAutomation.cs' -Raw
          $queue=Get-Content 'source/FishingAutomation/CraftingQueueCoordinator.cs' -Raw
          $supply=Get-Content 'source/FishingAutomation/CraftingFoodMaterialPolicy.cs' -Raw
          $tests=Get-Content 'tests/crafting/CraftingFoodMaterialIntegrationTests.cs' -Raw
          if($code -notmatch 'FindFirstPurchaseShortageAsync' -or
             $code -notmatch 'RecoverBatchPreparationAsync' -or
             $queue -notmatch 'CraftingMaterialAcquisitionException' -or
             $supply -notmatch 'ShopOnly' -or
             $supply -notmatch '"두부"' -or
             $tests -notmatch 'VerifyBlockedMaterialAsync'){
            throw 'Crafting material-skip guard/tests missing'
          }
          $status=Get-Content 'source/FishingAutomation/CraftingTelegramStatus.cs' -Raw
          $capture=Get-Content 'source/FishingAutomation/MainForm.CraftingTelegramStatus.cs' -Raw
          $telegram=Get-Content 'source/FishingAutomation/MainForm.Telegram.cs' -Raw
          $progress=Get-Content 'source/FishingAutomation/MainForm.Crafting.cs' -Raw
          $regression=Get-Content 'tests/crafting/Program.cs' -Raw
          if($status -notmatch 'CraftingTelegramSnapshot' -or
             $status -notmatch 'CraftingTelegramPhase.Skipped' -or
             $status -notmatch '메시지 길이 제한' -or
             $capture -notmatch 'CaptureCraftingTelegramSnapshot' -or
             $capture -notmatch 'SkipCraftingTelegramItem' -or
             $telegram -notmatch 'GetCraftingTelegramDetails' -or
             $progress -notmatch 'UpdateCraftingTelegramProgress' -or
             $regression -notmatch 'telegram 상태 preserves skip reason'){
            throw 'Read-only crafting Telegram status implementation or regressions missing'
          }
          $categories=Get-Content 'source/FishingAutomation/CraftingQueries.cs' -Raw
          $list=Get-Content 'tests/crafting/Program.cs' -Raw
          $integration=Get-Content 'tests/crafting/CraftingFoodMaterialIntegrationTests.cs' -Raw
          if($categories -notmatch 'IsVerifiedFoodRecipe' -or
             $categories -notmatch '"카레라이스"' -or
             $list -notmatch 'curry rice and ambiguous foods' -or
             $supply -notmatch '"셀러리"' -or
             $supply -notmatch '"생강"' -or
             $supply -notmatch '"카레 가루"' -or
             $code -notmatch 'supportedDirect' -or
             $integration -notmatch '정체불명 특수 식재료'){
            throw 'V3.2.98 food categorization or unavailable material skip guards missing'
          }
          $hub=Get-Content 'source/FishingAutomation/dungeon/AlteringScreen.cs' -Raw
          $craftScreen=Get-Content 'source/FishingAutomation/dungeon/CraftingScreen.cs' -Raw
          $recover=Get-Content 'source/FishingAutomation/CraftingQuestMaterialRecoveryPolicy.cs' -Raw
          if($hub -notmatch 'HasActiveProcessingHubTabVisual' -or
             $hub -notmatch 'HasProcessingBottomNavigationLabels' -or
             $recover -notmatch 'IdentifyUnique' -or
             $recover -notmatch 'freshInventory' -or
             $craftScreen -notmatch 'CraftingQuestMaterialRecoveryPolicy.IdentifyUnique' -or
             $regression -notmatch 'pumpkin soup recovers only known 6/60 onion' -or
             $regression -notmatch 'equal-count distinct materials remain ambiguous') {
            throw 'V3.2.98 F9 processing-hub or same-batch food OCR recovery guard missing'
          }
          foreach($needed in @(
            'source/FishingAutomation/CraftingQuestMaterialRecoveryPolicy.cs',
            'source/V3.2.98_RELEASE_AUTHORIZATION.json',
            'source/RELEASE_NOTES_V3.2.98.md')) {
            if(-not (Test-Path -LiteralPath $needed)){throw "Missing V3.2.98 release guard: $needed"}
          }
          if($a.sourcePullRequest -ne 395 -or
             ($a.sourcePullRequests -join ',') -ne '395' -or
             $a.offlineRegressionRequired -ne $true -or
             $a.postUpdateGameTestingPending -ne $true) {
            throw 'V3.2.98 PR or offline/game state authorization mismatch'
          }
          $resume=Get-Content 'source/FishingAutomation/MultiAlteringRecentResume.cs' -Raw
          $store=Get-Content 'source/FishingAutomation/MultiAlteringBatchStore.cs' -Raw
          $automation=Get-Content 'source/FishingAutomation/AlteringPlan.cs' -Raw
          $scene=Get-Content 'source/FishingAutomation/ManagedProductionSceneArbiter.cs' -Raw
          $screen=Get-Content 'source/FishingAutomation/dungeon/AlteringScreen.cs' -Raw
          $n02=Get-Content 'tests/n02-resume/Program.cs' -Raw
          $historical=Get-Content 'tests/altering-screen-integration/HistoricalIncidentRegression.cs' -Raw
          if($resume -notmatch 'ReceiptTrackingEnabled' -or
             $resume -notmatch 'JsonSerializer.Serialize\(reloaded\)' -or
             $store -notmatch 'ConfirmedReceivedWorks' -or
             $automation -notmatch 'journaled' -or
             $scene -notmatch 'TwoDistinctFrames' -or
             $screen -notmatch 'facilityOpenWatch' -or
             $screen -notmatch 'hubReadyWatch' -or
             $screen -notmatch 'TapVerifiedFreshAsync' -or
             $n02 -notmatch 'stock-independent resume' -or
             $historical -notmatch '20261016_000111') {
            throw 'V3.2.98 F9 code, resume, safety, latency or historical regression guard missing'
          }
          if($screen -match 'HasManagedBlueMinimapRingVisual|HasManagedKEntryNonGoldFieldHudVisual' -or
             $screen -notmatch 'managed_k_key.png' -or
             $screen -notmatch 'managed_i_key.png' -or
             $screen -notmatch 'WaitForManagedFacilityExitAsync' -or
             $screen -notmatch 'ManagedKReentryHudTimeout = TimeSpan.FromSeconds\(3\)') {
            throw 'V3.2.98 shortcut-only field or bounded Esc recovery guard missing'
          }
          foreach($needed in @(
            'source/FishingAutomation/abyss/templates/managed_k_key.png',
            'source/FishingAutomation/abyss/templates/managed_i_key.png',
            'tests/altering-screen-integration/managed-field-fixtures/field-workshop-20261031-022454.png',
            'tests/altering-screen-integration/managed-field-fixtures/field-workshop-20261031-070147.png')) {
            if(-not (Test-Path -LiteralPath $needed)){throw "Missing F9 shortcut regression asset: $needed"}
          }
          $ci=Get-Content '.github/workflows/ci.yml' -Raw
          if($ci -notmatch 'N02 deterministic batch persistence regressions' -or
             $ci -notmatch 'Updater rollback regression tests' -or
             $ci -notmatch 'tests/altering-screen-integration/Regression.csproj') {
            throw 'Main CI does not exercise required F9 production regressions'
          }
          # The six reviewed follow-up PRs are an exact release contract.
          # A successful generic build cannot substitute for their behavior.
          $ocrGuard=Get-Content 'source/FishingAutomation/dungeon/OcrRecognizer.cs' -Raw
          $attendanceGuard=Get-Content 'source/FishingAutomation/dungeon/DailyInterruptionScreen.cs' -Raw
          $retryGuard=Get-Content 'source/FishingAutomation/dungeon/ScenarioEngine.AbyssRetry.cs' -Raw
          $gatherGuard=Get-Content 'source/FishingAutomation/GatheringAutomation.cs' -Raw
          $multiGuard=Get-Content 'source/FishingAutomation/MainForm.MultiAltering.cs' -Raw
          $craftGuard=Get-Content 'source/FishingAutomation/CraftingQueueCoordinator.cs' -Raw
          $alteringTests=Get-Content 'tests/altering/Program.cs' -Raw
          if($ocrGuard -notmatch 'RecognizeEngineSafeAsync' -or
             $attendanceGuard -notmatch 'IsAttendanceSkipLabel' -or
             $screen -notmatch 'HasManagedKISpaceFieldHudAsync' -or
             $retryGuard -notmatch 'TryAcknowledgeRetryCompetitionMissionCompleteAsync' -or
             $multiGuard -notmatch 'bag_capacity_90pct' -or
             $gatherGuard -notmatch 'RecoveredEmptyBottleGatheringHoldException' -or
             $multiGuard -notmatch 'missing_empty_bottle' -or
             $store -notmatch 'CanPersistMaterialHold' -or
             $alteringTests -notmatch 'only exact weight and empty-bottle lane holds are durable' -or
             $craftGuard -notmatch 'CraftingRetryableScreenRecognitionException'){
            throw 'V3.2.98 integrated fix evidence or regression missing'
          }
          # PR #377: one-off runtime Stop/CLI mismatch from 2026-11-05.
          $stopCode=Get-Content 'source/FishingAutomation/dungeon/InventoryBulkGatheringScreen.cs' -Raw
          $stopPolicy=Get-Content 'source/FishingAutomation/LifeSkillStopPolicy.cs' -Raw
          $stopTest=Get-Content 'tests/gathering/Program.cs' -Raw
          $stableLock=Get-Content 'tests/stability/ProductionBehaviorBaseline.ps1' -Raw
          if($stopCode -notmatch 'TryStopWithVerifiedEvidenceAsync' -or
             $stopCode -notmatch 'ConfirmLifeSkillStoppedAsync' -or
             $stopCode -notmatch 'if \(await TryStopWithVerifiedEvidenceAsync\(ct\)\)' -or
             $stopCode -notmatch 'await StopAsync\(ct\);[\s\S]*?await ConfirmLifeSkillStoppedAsync' -or
             $stopPolicy -notmatch 'LifeSkillStopInputDecision' -or
             $stopPolicy -notmatch 'DecideStopInput' -or
             $stopPolicy -notmatch '!isGathering && !isAutoTraveling && !isFishing && !stopButtonVisible' -or
             $stopTest -notmatch '2026-11-05 576/576' -or
             $stableLock -notmatch 'post-Space policy does not trust stale MainButtonState') {
            throw 'V3.2.98 Stop/UI CLI safe handoff and regression evidence missing'
          }
          # PR #379: post-2026-11-05 get_activity schema changes must NEVER
          # become safe idle, and public logs must not contain raw CLI replies.
          $activityParser=Get-Content 'source/FishingAutomation/GatheringQueries.cs' -Raw
          $multiLogger=Get-Content 'source/FishingAutomation/MainForm.MultiAltering.cs' -Raw
          $schemaTests=Get-Content 'tests/gathering/Program.cs' -Raw
          if($activityParser -notmatch 'private static JsonElement ActivityRequired' -or
             $activityParser -notmatch 'private static bool ActivityBool' -or
             $activityParser -notmatch 'private static string ActivityText' -or
             $activityParser -notmatch 'get_activity 필수 필드 누락:' -or
             $activityParser -notmatch 'get_activity 필드 유형 불일치:' -or
             $activityParser -notmatch '게임 입력 차단' -or
             $activityParser -notmatch 'TryGetProperty\(key, out var value\)' -or
             $multiLogger -notmatch '\[다중가공\]\[예외 진단\]' -or
             $multiLogger -notmatch 'StackTrace\(ex, false\)' -or
             $schemaTests -notmatch 'post-update missing Mode cannot authorize managed K' -or
             $schemaTests -notmatch 'post-update missing Interaction cannot be treated as idle' -or
             $schemaTests -notmatch 'post-update changed Boolean to text fails closed') {
            throw 'V3.2.98 get_activity schema diagnostics or fail-closed regression missing'
          }
          # PR #381: gated schema-only response snapshot and fail-closed
          # managed F9 boundary must survive every release edit.
          $activitySchema=Get-Content 'source/FishingAutomation/GatheringQueries.cs' -Raw
          $managedScreen=Get-Content 'source/FishingAutomation/dungeon/AlteringScreen.cs' -Raw
          $wingGuard=Get-Content 'source/FishingAutomation/ZeroWingScreenGuards.cs' -Raw
          $gatherRegression=Get-Content 'tests/gathering/Program.cs' -Raw
          $behaviorLock=Get-Content 'tests/stability/ProductionBehaviorBaseline.ps1' -Raw
          if($activitySchema -notmatch 'DescribeActivitySchema' -or
             $activitySchema -notmatch 'IsSafeActivitySchemaCandidate' -or
             $activitySchema -notmatch '추가상태키후보' -or
             $gatherRegression -notmatch 'IsReviving:missing' -or
             $managedScreen -notmatch 'var second = await _cli.GetActivityAsync\(ct\)' -or
             $managedScreen -notmatch '재조회 상태=구조 정상' -or
             $managedScreen -notmatch '입력 차단 유지' -or
             $wingGuard -notmatch 'ExceptionDispatchInfo.Capture' -or
             $gatherRegression -notmatch 'missing IsReviving remains null/unknown' -or
             $gatherRegression -notmatch 'bounded schema diagnostic never exposes account keys or values' -or
             $behaviorLock -notmatch 'F9 never authorizes input on inconsistent activity') {
            throw 'V3.2.98 activity contract schema-only diagnosis or fail-closed regression missing'
          }
          # PR #387 inherits the only optional get_activity safety property:
          # IsReviving. Absent must remain unknown, not default to false.
          # Dead, combat, travel and manager input guards remain required.
          $activityCompat=Get-Content 'source/FishingAutomation/GatheringQueries.cs' -Raw
          $gatherSafety=Get-Content 'source/FishingAutomation/GatheringSafetyPolicy.cs' -Raw
          $travelSafety=Get-Content 'source/FishingAutomation/AlteringTravelActivityPolicy.cs' -Raw
          $compatTests=Get-Content 'tests/gathering/Program.cs' -Raw
          $stableChecks=Get-Content 'tests/stability/ProductionBehaviorBaseline.ps1' -Raw
          if($activityCompat -notmatch 'bool\? IsReviving' -or
             $activityCompat -notmatch 'ActivityOptionalBool\(r, "IsReviving", "\$"\)' -or
             $activityCompat -match 'ActivityBool\(r, "IsReviving", "\$"\)' -or
             $activityCompat -notmatch 'ActivityBool\(r, "IsDead", "\$"\)' -or
             $activityCompat -notmatch 'ActivityBool\(r, "IsInCombat", "\$"\)' -or
             $activityCompat -notmatch 'IsReviving != true' -or
             $gatherSafety -notmatch 'ShouldWaitForCombat' -or
             $travelSafety -notmatch 'IsManagedSafeIdle' -or
             $compatTests -notmatch 'missing IsReviving remains null/unknown' -or
             $compatTests -notmatch 'combat still prevents F9 input' -or
             $compatTests -notmatch 'death remains unsafe' -or
             $compatTests -notmatch 'auto travel still blocks F9 managed input' -or
             $compatTests -notmatch 'post-update string-typed IsReviving also fails closed' -or
             $stableChecks -notmatch 'post-update IsReviving alone is optional') {
            throw 'V3.2.98 optional IsReviving only or unchanged safety guard regression missing'
          }
          # PR #387: the real incident screenshot puts 산뜻 버섯 at y~930.
          # OCR-only region widens; all two-frame and same-row proof remains.
          $lifeList=Get-Content 'source/FishingAutomation/LifeSkillListLayout.cs' -Raw
          $bulkLife=Get-Content 'source/FishingAutomation/dungeon/InventoryBulkGatheringScreen.cs' -Raw
          $herbTests=Get-Content 'tests/gathering/Program.cs' -Raw
          $stableTests=Get-Content 'tests/stability/ProductionBehaviorBaseline.ps1' -Raw
          if($lifeList -notmatch 'VerifiedListSearchRoi' -or
             $lifeList -notmatch 'new\(150, 145, 630, 835\)' -or
             $bulkLife -notmatch 'var listRoi = LifeSkillListLayout.VerifiedListSearchRoi;' -or
             $bulkLife -match 'var listRoi = new Rectangle\(150, 145, 630, 700\)' -or
             $bulkLife -notmatch 'GatheringNavigationPolicy.IsStableFirstRow\(first.Value.Bounds, second.Value.Bounds\)' -or
             $bulkLife -notmatch 'HasRowIconVisual\(fresh, second.Value.Bounds\)' -or
             $bulkLife -notmatch 'int maxPages = LifeSkillListLayout.NeverScroll' -or
             $bulkLife -notmatch 'if \(row is null\)' -or
             $herbTests -notmatch '산뜻 버섯 bottom-row OCR included' -or
             $herbTests -notmatch 'herb bottom-row still uses bounded scroll' -or
             $stableTests -notmatch 'search extends below y930 but ends at y980') {
            throw 'V3.2.98 verified herb bottom-row ROI or two-frame OCR+icon input gate missing'
          }
          # PR #387: incident-proven native-color row OCR fallback, strict
          # exact-name 2-frame icon/geometry validation, fail-closed on errors.
          $rowRecognition=Get-Content 'source/FishingAutomation/dungeon/LifeSkillRowRecognition.cs' -Raw
          $rowRegression=Get-Content 'tests/herb-row/Program.cs' -Raw
          $mainCi=Get-Content '.github/workflows/ci.yml' -Raw
          if($rowRecognition -notmatch 'FindAlteringLabelsAsync' -or
             $rowRecognition -notmatch 'ReadLinesAsync' -or
             $rowRecognition -notmatch 'retriedRows' -or
             $rowRecognition -notmatch 'matches.Count == 1' -or
             $rowRecognition -notmatch 'HasIcon' -or
             $bulkLife -notmatch 'LifeSkillRowRecognition.FindAsync' -or
             $bulkLife -notmatch 'LifeSkillRowRecognition.HasIcon' -or
             $bulkLife -notmatch 'GatheringNavigationPolicy.IsStableFirstRow' -or
             $rowRegression -notmatch 'Original exact matches' -or
             $rowRegression -notmatch 'Duplicate exact rows must fail closed' -or
             $rowRegression -notmatch 'Icon alone must not validate name' -or
             $mainCi -notmatch 'tests/herb-row/Regression.csproj'){
            throw 'V3.2.98 native-color herb row verification or safe row rejection regression missing'
          }
          # PR #389: checked real medicine error screenshot x=162..275 / y=330..493.
          # Only change the medicine first-result card, preserving food-crafting geometry.
          $medicineLayout=Get-Content 'source/FishingAutomation/AlteringRecipeLayout.cs' -Raw
          $craftingLayout=Get-Content 'source/FishingAutomation/CraftingHubLayout.cs' -Raw
          $medicineTest=Get-Content 'tests/altering/Program.cs' -Raw
          $screen=Get-Content 'source/FishingAutomation/dungeon/AlteringScreen.cs' -Raw
          if($medicineLayout -notmatch 'ProcessingSearchFirstResultPoint = new\(218, 412\)' -or
             $craftingLayout -notmatch 'ProductFirstResultPoint\s*=> new\(218, 613\)' -or
             $medicineTest -notmatch 'medicine search shares food dialog geometry but uses its observed first-card location' -or
             $screen -notmatch 'AlteringRecipeLayout.ProcessingSearchFirstResultPoint') {
             throw 'V3.2.98 actual medicine first card center or unchanged crafting coordinate regression missing'
          }
          Write-Warning 'V3.2.98 user-requested rollout: production screen game verification pending, rollback provided.'

      - name: Require inherited V3.2.86 phase1 wait-advisory source and regressions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($needed in @(
            'source/FishingAutomation/MultiAlteringCoordinator.cs',
            'source/FishingAutomation/CraftingQueueCoordinator.cs',
            'source/FishingAutomation/MainForm.Crafting.cs',
            'source/FishingAutomation/MainForm.MultiAltering.cs',
            'tests/altering/Program.cs',
            'tests/crafting/Program.cs',
            'docs/PRODUCTION_WAIT_ADVISORIES_PHASE1.md',
            'tests/release/test_v3298_auto_update_policy.py')) {
            if(-not (Test-Path -LiteralPath $needed)){throw "Missing V3.2.98 phase1 artifact: $needed"}
          }
          $multi=Get-Content 'source/FishingAutomation/MultiAlteringCoordinator.cs' -Raw
          $craft=Get-Content 'source/FishingAutomation/CraftingQueueCoordinator.cs' -Raw
          $uiMulti=Get-Content 'source/FishingAutomation/MainForm.MultiAltering.cs' -Raw
          $uiCraft=Get-Content 'source/FishingAutomation/MainForm.Crafting.cs' -Raw
          $testMulti=Get-Content 'tests/altering/Program.cs' -Raw
          $testCraft=Get-Content 'tests/crafting/Program.cs' -Raw
          if($multi -notmatch 'MultiAlteringLongWaitAdvisoryTracker' -or
