name: Publish Reviewed Repair Windows Auto Update

# Installed clients ignore prereleases. Publish only the CI-approved main.
# Explicit personal-use rollout authorization is NOT real-game testing.
# A verified attestation OR explicit sole-operator risk acceptance is required.
# Public release remains gated by exact main CI, updater ZIP checksum, source,
# binary smoke, included backup/rollback scripts, and no prior release tag.
# Manual dispatch retains exactly the same gates.
on:
  workflow_run:
    workflows: ["Check V3 Production Engine"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: reviewed-repair-windows-release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ (github.event_name == 'workflow_dispatch') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Require an exact, reviewed CI-only repair version
        id: approval
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $u = Get-Content 'source/FishingAutomation/UpdateManager.cs' -Raw
          $match = [regex]::Match($u, 'CurrentVersion = "(V[0-9]+\.[0-9]+\.[0-9]+)"')
          if (-not $match.Success) { throw 'Missing production version' }
          $version = $match.Groups[1].Value
          $digits = $version.Substring(1)
          $project = Get-Content source/FishingAutomation/FishingAutomation.csproj -Raw
          foreach ($part in @("<Version>$digits</Version>",
                              "<AssemblyVersion>$digits.0</AssemblyVersion>",
                              "<FileVersion>$digits.0</FileVersion>")) {
            if (-not $project.Contains($part)) { throw 'Production version mismatch' }
          }
          $path = "source/$($version)_CI_ONLY_REPAIR_APPROVAL.json"
          if (-not (Test-Path -LiteralPath $path)) {
            Write-Host 'No reviewed repair approval on this commit: release skipped.'
            "reviewed=false" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8
            exit 0
          }
          $record = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          if ($record.schema -ne 1 -or $record.version -ne $version -or
              $record.verification -ne 'ci_only_unverified' -or
              $record.operator_reviewed -ne $true -or
              $record.real_game_verified -ne $false -or
              $record.automatic_update -ne $true -or
              $record.rollback_required -ne $true -or
              $record.pr -notmatch '^[1-9][0-9]{0,7}$' -or
              $record.approved_head_sha -notmatch '^[0-9a-f]{40}$' -or
              $record.reviewed_merge_sha -notmatch '^[0-9a-f]{40}$') {
            throw 'Invalid reviewed repair release approval'
          }
          $pr = gh api "repos/$env:GITHUB_REPOSITORY/pulls/$($record.pr)" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $pr -or $pr.merged_at -eq $null -or
              $pr.base.ref -ne 'main' -or $pr.head.repo.full_name -ne $env:GITHUB_REPOSITORY -or
              $pr.head.ref -notmatch '^auto-repair/[a-f0-9]{24}-[a-f0-9]{8}$' -or
              $pr.head.sha -ne $record.approved_head_sha -or
              $pr.merge_commit_sha -ne $record.reviewed_merge_sha) {
            throw 'Reviewed PR provenance mismatch'
          }
          git cat-file -e "$($record.reviewed_merge_sha)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed merge commit missing' }
          git merge-base --is-ancestor $record.reviewed_merge_sha HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed repair is not an ancestor' }
          $allowed = @('source/FishingAutomation/UpdateManager.cs',
                       'source/FishingAutomation/FishingAutomation.csproj',
                       $path, "source/RELEASE_NOTES_$($version).md")
          $diff = @(git diff --name-only $record.reviewed_merge_sha HEAD)
          if ($LASTEXITCODE -ne 0 -or $diff.Count -ne 4) {
            throw 'Reviewed merge must be followed by exactly four version files'
          }
          foreach ($changed in $diff) {
            if ($changed -notin $allowed) { throw "Non-version change: $changed" }
          }
          foreach ($needed in @("source/RELEASE_NOTES_$($version).md",
                               'source/tools/ApplyUpdate.ps1',
                               'source/tools/RollbackPrevious.ps1')) {
            if (-not (Test-Path -LiteralPath $needed)) { throw "Required release asset missing: $needed" }
          }
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq .tag_name
          if ($LASTEXITCODE -ne 0 -or $latest -notmatch '^V[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'Cannot resolve previous public release'
          }
          $old = [version]$latest.Substring(1)
          $new = [version]$digits
          if ($old.Major -ne $new.Major -or $old.Minor -ne $new.Minor -or
              $new.Build -ne ($old.Build + 1)) {
            throw 'Not the immediately next semantic version'
          }
          "reviewed=true" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          "version=$version" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          "version_digits=$digits" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          "version_regex=$($version.Replace('.', '\.'))" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          "digits_regex=$($digits.Replace('.', '\.'))" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          Write-Warning 'CI-only reviewed release: live game behavior not verified.'

      - name: Require exact-main CI success and never overwrite a release
        if: steps.approval.outputs.reviewed == 'true'
        id: eligibility
        id: eligibility
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $sha=(git rev-parse HEAD).Trim()
          if($LASTEXITCODE-ne0 -or $sha -ne $env:CI_HEAD_SHA){throw 'Wrong CI checkout SHA'}
          $remote=(git ls-remote origin refs/heads/main | Select-Object -First 1)
          if($LASTEXITCODE-ne0 -or [string]::IsNullOrWhiteSpace($remote)){throw 'main unavailable'}
          if((($remote -split "\s+")[0]).Trim() -ne $sha){throw 'main moved since CI; abort'}
          # Automatic and manual promotion both require an already CI-approved main commit.
          $ci=gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&head_sha=$sha&per_page=20" | ConvertFrom-Json
          if($LASTEXITCODE-ne0 -or -not $ci){throw 'Cannot verify main CI'}
          $passed=@($ci.workflow_runs | Where-Object {
            $_.head_sha -eq $sha -and $_.event -in @('push','workflow_dispatch') -and
            $_.status -eq 'completed' -and $_.conclusion -eq 'success'
          })
          if($passed.Count -lt 1){throw 'No successful production CI for current main SHA'}
          $u=Get-Content source/FishingAutomation/UpdateManager.cs -Raw
          if($u -notmatch 'CurrentVersion = "${{ steps.approval.outputs.version_regex }}"'){
            "publish=false" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8
            Write-Host 'Not ${{ steps.approval.outputs.version }} any more; skip'
            exit 0
          }
          $p=Get-Content source/FishingAutomation/FishingAutomation.csproj -Raw
          foreach($tag in @('<Version>${{ steps.approval.outputs.version_digits }}</Version>','<AssemblyVersion>${{ steps.approval.outputs.version_digits }}.0</AssemblyVersion>','<FileVersion>${{ steps.approval.outputs.version_digits }}.0</FileVersion>')){
            if(-not $p.Contains($tag)){throw "Version mismatch: $tag"}
          }
          if(-not (Test-Path source/RELEASE_NOTES_${{ steps.approval.outputs.version }}.md)){throw 'Release notes missing'}
          $releases=gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if($LASTEXITCODE-ne0){throw 'Release list check failed'}
          if(@($releases | Where-Object { $_.tag_name -eq '${{ steps.approval.outputs.version }}' }).Count -gt 0){
            "publish=false" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8
            Write-Host '${{ steps.approval.outputs.version }} release exists: no automatic overwrite'
            exit 0
          }
          $tag=(git ls-remote --tags origin refs/tags/${{ steps.approval.outputs.version }} | Select-Object -First 1)
          if($LASTEXITCODE-ne0){throw 'Tag lookup failed'}
          if(-not [string]::IsNullOrWhiteSpace($tag)){throw 'Tag exists without release; manual recovery required'}
          "publish=true" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          Write-Host "Eligible ${{ steps.approval.outputs.version }} CI-approved SHA: $sha"

      - name: Publish verified Windows binaries
        if: steps.eligibility.outputs.publish == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore source/FishingAutomation/FishingAutomation.csproj -r win-x64
          if($LASTEXITCODE-ne0){throw 'app restore failed'}
          dotnet restore source/MacroWatchdog/MacroWatchdog.csproj -r win-x64
          if($LASTEXITCODE-ne0){throw 'watchdog restore failed'}
          New-Item artifacts/app,artifacts/watchdog -ItemType Directory -Force | Out-Null
          dotnet publish source/FishingAutomation/FishingAutomation.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:PublishAot=false -p:DebugType=None -p:DebugSymbols=false -o artifacts/app
          if($LASTEXITCODE-ne0){throw 'app publish failed'}
          dotnet publish source/MacroWatchdog/MacroWatchdog.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:PublishAot=false -p:DebugType=None -p:DebugSymbols=false -o artifacts/watchdog
          if($LASTEXITCODE-ne0){throw 'watchdog publish failed'}
          if((Get-Item artifacts/app/FishingAutomation.exe).VersionInfo.FileVersion -ne '${{ steps.approval.outputs.version_digits }}.0'){throw 'EXE version mismatch'}
          if(-not (Test-Path artifacts/watchdog/MacroWatchdog.exe)){throw 'Missing watchdog'}

      - name: Smoke test executable
        if: steps.eligibility.outputs.publish == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path artifacts/app/FishingAutomation.exe).Path
          $p=Start-Process $exe -WorkingDirectory (Resolve-Path artifacts/app).Path -WindowStyle Hidden -PassThru
          try {
            Start-Sleep 5
            $p.Refresh()
            if($p.HasExited){throw "App exited early: $($p.ExitCode)"}
          } finally {
            Stop-Process $p.Id -Force -ErrorAction SilentlyContinue
            Get-Process MacroWatchdog -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Build updater-compatible Windows Lite, checksum, source
        if: steps.eligibility.outputs.publish == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $pkg=Join-Path $PWD 'artifacts/package'
          $rel=Join-Path $pkg 'release'
          $tools=Join-Path $pkg 'tools'
          $compat=Join-Path $pkg 'FishingAutomation'
          New-Item $rel,$tools,$compat -ItemType Directory -Force | Out-Null
          Copy-Item artifacts/app/* $rel -Recurse -Force
          Copy-Item source/FishingAutomation/interception.dll (Join-Path $rel 'interception.dll') -Force
          Copy-Item artifacts/watchdog/MacroWatchdog.exe (Join-Path $rel 'MacroWatchdog.exe') -Force
          Copy-Item source/tools/ApplyUpdate.ps1 (Join-Path $tools 'ApplyUpdate.ps1') -Force
          Copy-Item source/tools/RollbackPrevious.ps1 (Join-Path $tools 'RollbackPrevious.ps1') -Force
          Copy-Item source/ROLLBACK_PREVIOUS.cmd (Join-Path $pkg 'ROLLBACK_PREVIOUS.cmd') -Force
          Copy-Item source/START.cmd (Join-Path $pkg 'START.cmd') -Force
          Copy-Item source/REPAIR_AUTO_UPDATE.cmd (Join-Path $pkg 'REPAIR_AUTO_UPDATE.cmd') -Force
          'Compatibility directory for legacy updater notification restore.' | Set-Content (Join-Path $compat '.update_compat') -Encoding ASCII
          'MABI AUTO ${{ steps.approval.outputs.version }} - legacy AutoFix retired; GitHub error logging retained' | Set-Content (Join-Path $pkg 'WINDOWS_LITE.txt') -Encoding UTF8
          $required=@(
            'release/FishingAutomation.exe','release/MacroWatchdog.exe',
            'release/abyss/config/targets.json','release/abyss/config/scenario.json',
            'release/abyss/templates/managed_home_key.png','release/abyss/templates/managed_home_mail_key.png',
            'release/abyss/templates/managed_end_key.png','release/abyss/templates/managed_escape_key.png',
            'release/abyss/templates/loot_v173/loot_hallucination_stone.png',
            'release/abyss/templates/loot_v173/loot_mor_corsair_tricorne.png',
            'release/interception.dll','START.cmd','tools/ApplyUpdate.ps1',
            'ROLLBACK_PREVIOUS.cmd','tools/RollbackPrevious.ps1')
          foreach($x in $required){if(-not (Test-Path (Join-Path $pkg $x))){throw "Missing package file: $x"}}
          if(Test-Path (Join-Path $rel 'ai-autopilot')){throw 'Legacy AutoFix accidentally packaged'}
          $sha=(git rev-parse HEAD).Trim()
          $sha | Set-Content (Join-Path $pkg 'BUILD_COMMIT.txt') -Encoding ASCII
          $zip=Join-Path $PWD 'artifacts/MabiAuto_${{ steps.approval.outputs.version }}_Windows_Lite.zip'
          [IO.Compression.ZipFile]::CreateFromDirectory($pkg,$zip,[IO.Compression.CompressionLevel]::Optimal,$false)
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MabiAuto_${{ steps.approval.outputs.version }}_Windows_Lite.zip" | Set-Content "$zip.sha256" -Encoding ASCII
          $stage=Join-Path $PWD 'artifacts/source-package'
          New-Item $stage -ItemType Directory -Force | Out-Null
          Copy-Item source (Join-Path $stage 'source') -Recurse -Force
          Copy-Item changes (Join-Path $stage 'changes') -Recurse -Force
          Copy-Item tests (Join-Path $stage 'tests') -Recurse -Force
          Copy-Item .github (Join-Path $stage '.github') -Recurse -Force
          Copy-Item BUILD_VERIFY.ps1,README.txt,GITHUB_MIGRATION.md $stage -Force
          $sha | Set-Content (Join-Path $stage 'BUILD_COMMIT.txt') -Encoding ASCII
          $buildDirs=@(Get-ChildItem $stage -Directory -Recurse | Where-Object { $_.Name -in @('bin','obj') })
          foreach($d in ($buildDirs | Sort-Object { $_.FullName.Length } -Descending)){
            if(Test-Path -LiteralPath $d.FullName){
              $safe=(Resolve-Path -LiteralPath $d.FullName).Path
              if(-not $safe.StartsWith($stage + [IO.Path]::DirectorySeparatorChar,[StringComparison]::OrdinalIgnoreCase)){throw 'Unsafe cleanup'}
              Remove-Item -LiteralPath $safe -Recurse -Force
            }
          }
          $sourceZip=Join-Path $PWD 'artifacts/MabiAuto_${{ steps.approval.outputs.version }}_Source.zip'
          [IO.Compression.ZipFile]::CreateFromDirectory($stage,$sourceZip,[IO.Compression.CompressionLevel]::Optimal,$false)
          foreach($n in @('MabiAuto_${{ steps.approval.outputs.version }}_Windows_Lite.zip','MabiAuto_${{ steps.approval.outputs.version }}_Windows_Lite.zip.sha256','MabiAuto_${{ steps.approval.outputs.version }}_Source.zip')){
            if((Get-Item (Join-Path 'artifacts' $n)).Length -lt 64){throw "Bad asset: $n"}
          }
          $archive=[IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $names=@($archive.Entries | ForEach-Object FullName)
            foreach($n in $required){if($n -notin $names){throw "ZIP missing: $n"}}
            if(@($names | Where-Object { $_ -like 'release/ai-autopilot/*' }).Count -gt 0){throw 'Legacy AutoFix found in updater ZIP'}
            if('BUILD_COMMIT.txt' -notin $names){throw 'ZIP has no build provenance'}
          } finally { $archive.Dispose() }
          Write-Host "${{ steps.approval.outputs.version }} ZIP SHA256: $hash"

      - name: Retain test-release assets in Actions
        if: steps.eligibility.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.approval.outputs.version }}-verified-release-packages
          path: |
            artifacts/MabiAuto_${{ steps.approval.outputs.version }}_Windows_Lite.zip
            artifacts/MabiAuto_${{ steps.approval.outputs.version }}_Windows_Lite.zip.sha256
            artifacts/MabiAuto_${{ steps.approval.outputs.version }}_Source.zip

      - name: Publish public auto-update Release
        if: steps.eligibility.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $sha=(git rev-parse HEAD).Trim()
          if($sha -ne $env:CI_HEAD_SHA){throw 'Wrong package source SHA'}
          $remote=(git ls-remote origin refs/heads/main | Select-Object -First 1)
          if($LASTEXITCODE-ne0 -or (($remote -split "\s+")[0]).Trim() -ne $sha){throw 'main changed since CI; abort release'}
          $tag=(git ls-remote --tags origin refs/tags/${{ steps.approval.outputs.version }} | Select-Object -First 1)
          if($LASTEXITCODE-ne0 -or -not [string]::IsNullOrWhiteSpace($tag)){throw '${{ steps.approval.outputs.version }} tag already exists'}
          git tag ${{ steps.approval.outputs.version }} $sha
          if($LASTEXITCODE-ne0){throw 'tag creation failed'}
          git push origin refs/tags/${{ steps.approval.outputs.version }}
          if($LASTEXITCODE-ne0){throw 'tag push failed'}
          gh release create ${{ steps.approval.outputs.version }} artifacts/MabiAuto_${{ steps.approval.outputs.version }}_Windows_Lite.zip artifacts/MabiAuto_${{ steps.approval.outputs.version }}_Windows_Lite.zip.sha256 artifacts/MabiAuto_${{ steps.approval.outputs.version }}_Source.zip --draft --verify-tag --title 'Mabi Auto ${{ steps.approval.outputs.version }}' --notes-file source/RELEASE_NOTES_${{ steps.approval.outputs.version }}.md
          if($LASTEXITCODE-ne0){throw 'Draft release failed'}
          $expected=@('MabiAuto_${{ steps.approval.outputs.version }}_Windows_Lite.zip','MabiAuto_${{ steps.approval.outputs.version }}_Windows_Lite.zip.sha256','MabiAuto_${{ steps.approval.outputs.version }}_Source.zip')
          $releases=gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if($LASTEXITCODE-ne0){throw 'Draft release lookup failed'}
          $draft=@($releases | Where-Object { $_.tag_name -eq '${{ steps.approval.outputs.version }}' }) | Select-Object -First 1
          if(-not $draft -or -not $draft.draft -or $draft.prerelease){throw 'Draft release invalid'}
          foreach($n in $expected){if($n -notin $draft.assets.name){throw "Missing release asset: $n"}}
          gh release edit ${{ steps.approval.outputs.version }} --draft=false
          if($LASTEXITCODE-ne0){throw 'Release publication failed'}
          $published=gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/${{ steps.approval.outputs.version }}" | ConvertFrom-Json
          if($LASTEXITCODE-ne0 -or -not $published -or $published.draft -or $published.prerelease){throw 'Public auto-update not verified'}
          foreach($n in $expected){if($n -notin $published.assets.name){throw "Published release missing asset: $n"}}
          Write-Host "Auto-update ${{ steps.approval.outputs.version }} publicly published from commit $sha"
